<!doctype html>
<!-- Stile: «Griglia prospettica» — un pavimento a griglia che corre verso l'orizzonte e sfuma nel buio; sopra il logo, poi la scheda.
     Idea: tecnico e profondo, come un banco di misura: la rete è il pavimento su cui il desktop viaggia, e scorre piano verso di te. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Accesso</title>
<style>
  :root{
    --buio:#020409; --carta:#070b14; --filo:#172036; --filo-chiaro:#22304d;
    --testo:#e9eef7; --tenue:#8792a8; --etichetta:#9fb0cc;
    --campo:#040810; --campo-bordo:#1d2840; --accento:#2f86ff; --ciano:#00d8ff;
    --bottone:#1560d8; --bottone-su:#0f52c0;
    --err-fondo:rgba(255,84,104,.08); --err-bordo:rgba(255,104,122,.34); --err-testo:#ff9eaa;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Cantarell,Ubuntu,sans-serif;
    --mono:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",monospace;
    --cella:2.8rem;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(16px, 0.42vw + 10px, 26px); background:var(--buio)}
  body{
    margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:2.5rem 1rem 3rem;
    font-family:var(--sans); color:var(--testo); background:var(--buio); overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }

  /* ── il pavimento ── */
  .suolo{
    position:fixed; z-index:0; left:0; right:0; bottom:0; height:38vh; overflow:hidden; pointer-events:none;
    perspective:20rem; perspective-origin:50% 0;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 60%, #000 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 60%, #000 100%);
  }
  .piano{
    position:absolute; left:-150%; right:-150%; top:0; height:300%; overflow:hidden;
    transform-origin:50% 0; transform:rotateX(74deg);
  }
  .maglie{
    position:absolute; inset:calc(var(--cella) * -1) 0 0 0;
    background-image:
      linear-gradient(to bottom, rgba(47,134,255,.5) 1px, transparent 1px),
      linear-gradient(to right, rgba(47,134,255,.5) 1px, transparent 1px);
    background-size:var(--cella) var(--cella);
    background-position:50% 0;
    animation:avanza 7s linear infinite;
  }
  @keyframes avanza{from{transform:translateY(0)} to{transform:translateY(var(--cella))}}
  /* la linea dell'orizzonte, e il chiarore sopra */
  .linea{position:fixed; z-index:0; left:0; right:0; bottom:38vh; height:1px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(0,216,255,.55) 30%, rgba(160,230,255,.9) 50%, rgba(0,216,255,.55) 70%, transparent)}
  .chiarore{position:fixed; z-index:0; left:50%; bottom:calc(38vh - 8rem); width:min(80rem,160vw); height:16rem; transform:translateX(-50%); pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%, rgba(26,124,255,.22), rgba(26,124,255,.06) 50%, transparent 72%)}
  .vignetta{position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.65))}

  /* ── la colonna ── */
  .colonna{position:relative; z-index:1; width:100%; max-width:24rem; animation:entra .7s cubic-bezier(.2,.7,.2,1) both}
  @keyframes entra{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  .marchio{display:block; width:15rem; max-width:78%; margin:0 auto; color:#fff; filter:drop-shadow(0 6px 24px rgba(0,140,255,.35))}
  .marchio svg{display:block; width:100%; height:auto}
  .motto{margin:1rem 0 2.1rem; text-align:center; color:var(--tenue); font-size:.98rem; line-height:1.5; text-wrap:balance}

  .scheda{
    position:relative; background:var(--carta); border:1px solid var(--filo); border-radius:.5rem; padding:1.5rem 1.6rem 1.4rem;
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 30px 70px -25px rgba(0,30,90,.8);
  }
  /* le crocette agli angoli, come su un disegno tecnico */
  .scheda::before, .scheda::after{content:""; position:absolute; width:.7rem; height:.7rem; border-color:var(--ciano); border-style:solid; opacity:.8}
  .scheda::before{top:-1px; left:-1px; border-width:1px 0 0 1px; border-top-left-radius:.5rem}
  .scheda::after{bottom:-1px; right:-1px; border-width:0 1px 1px 0; border-bottom-right-radius:.5rem}

  .testata{display:flex; justify-content:space-between; align-items:center; gap:1rem; margin:0 0 1.35rem; padding-bottom:1rem; border-bottom:1px dashed var(--filo-chiaro);
    font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--etichetta)}
  .testata h1{margin:0; font:inherit; color:var(--testo)}
  .testata span{display:inline-flex; align-items:center; gap:.45rem; text-transform:none; letter-spacing:.02em}
  .vivo{width:.45rem; height:.45rem; border-radius:50%; background:#2fd08f; box-shadow:0 0 0 3px rgba(47,208,143,.15)}

  form{display:grid; gap:1.1rem}
  label{display:block; font-family:var(--mono); font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--etichetta); margin-bottom:.45rem}
  input{
    width:100%; font:inherit; font-size:1rem; color:var(--testo); caret-color:var(--ciano);
    padding:.72rem .85rem; border:1px solid var(--campo-bordo); border-radius:.35rem; background:var(--campo);
    transition:border-color .15s, box-shadow .15s;
  }
  input:hover{border-color:#2d3c5c}
  input:focus{outline:none; border-color:var(--accento); box-shadow:0 0 0 3px rgba(47,134,255,.22), 0 0 18px -4px rgba(0,216,255,.35)}
  input[aria-invalid="true"]{border-color:rgba(255,104,122,.6)}
  input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px rgba(255,104,122,.2)}

  button{
    margin-top:.45rem; font:inherit; font-size:.98rem; font-weight:640; color:#fff; letter-spacing:.01em;
    padding:.8rem 1rem; border:1px solid rgba(120,190,255,.35); border-radius:.35rem; cursor:pointer;
    background:linear-gradient(180deg, #1d6eea, var(--bottone));
    display:flex; justify-content:center; align-items:center; gap:.5rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 8px 24px -8px rgba(26,124,255,.7);
    transition:background-color .15s, box-shadow .2s, transform .1s, filter .15s;
  }
  button .freccia{width:1.05rem; height:1.05rem; transition:transform .2s}
  button:hover{filter:brightness(1.08); box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 30px -8px rgba(0,216,255,.6)}
  button:hover .freccia{transform:translateX(3px)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--ciano); outline-offset:3px}
  button:disabled{cursor:progress; filter:saturate(.4) brightness(.8); box-shadow:none; transform:none}
  button:disabled .freccia{display:none}
  .ruota{display:none; width:1rem; height:1rem; border-radius:50%; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:gira .8s linear infinite}
  button:disabled .ruota{display:block}
  @keyframes gira{to{transform:rotate(360deg)}}

  #avviso:empty, #esito:empty, #dichiarazione:empty{display:none}
  #avviso{margin:0 0 1.2rem; padding:.7rem .85rem; border-radius:.35rem; font-size:.86rem; line-height:1.45;
    background:rgba(255,190,80,.07); border:1px solid rgba(255,190,80,.3); color:#ffd391}
  #esito{margin-top:1.1rem}
  #esito.errore{display:flex; gap:.6rem; align-items:flex-start; padding:.7rem .85rem; border-radius:.35rem; font-size:.88rem; line-height:1.4;
    background:var(--err-fondo); border:1px solid var(--err-bordo); border-left-width:3px; color:var(--err-testo); animation:compare .35s ease-out both}
  #esito.errore span{text-wrap:balance}
  #esito.errore svg{flex:none; width:1.05rem; height:1.05rem; margin-top:.08rem}
  @keyframes compare{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
  .scheda.scuoti{animation:scuoti .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes scuoti{20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)}}
  #dichiarazione{margin-top:1rem; padding:.7rem .85rem; border-radius:.35rem; font-size:.84rem; color:#c5ccd9; background:rgba(255,255,255,.03); border:1px solid var(--filo)}

  .piede{width:max-content; max-width:100%; margin:1.2rem auto 0; padding:.4rem .8rem; border-radius:99px; background:rgba(2,4,9,.88); border:1px solid var(--filo); display:flex; justify-content:center; align-items:center; gap:.45rem;
    font-family:var(--mono); font-size:.72rem; letter-spacing:.03em; color:var(--tenue)}
  .piede svg{width:.85rem; height:.85rem; flex:none}
  .piede b{font-weight:500; color:#b9c6dc}

  @media (max-width:420px){ .scheda{padding:1.3rem 1.15rem 1.2rem} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="chiarore" aria-hidden="true"></div>
<div class="suolo" aria-hidden="true"><div class="piano"><div class="maglie"></div></div></div>
<div class="linea" aria-hidden="true"></div>
<div class="vignetta" aria-hidden="true"></div>

<main class="colonna">
  <div class="marchio">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 360" role="img" aria-label="REMOTIX">
      <defs>
        <linearGradient id="rx-g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00d8ff"/><stop offset=".45" stop-color="#1a7cff"/><stop offset="1" stop-color="#0646c8"/>
        </linearGradient>
        <linearGradient id="rx-t" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#1a6dff"/><stop offset="1" stop-color="#00d8ff"/>
        </linearGradient>
      </defs>
      <g fill="url(#rx-g)">
        <path d="M0 0H288A116 116 0 0 1 288 232H196L170 180H252A38 38 0 0 0 252 104H86Z"/>
        <path d="M26 138L214 356H26Z"/>
        <path d="M150 180H232L442 356H296Z"/>
      </g>
      <text x="450" y="356" font-family="Montserrat,'Arial Black','Helvetica Neue',system-ui,sans-serif" font-weight="900" font-size="272" letter-spacing="6"><tspan fill="currentColor">EMO</tspan><tspan fill="url(#rx-t)">TIX</tspan></text>
    </svg>
  </div>
  <p class="motto">Il tuo desktop Linux, da qualunque browser.</p>

  <section class="scheda" aria-labelledby="titolo">
    <div class="testata">
      <h1 id="titolo">Accesso</h1>
      <span><i class="vivo" aria-hidden="true"></i>alfa.lan</span>
    </div>
    <div id="avviso"></div>

    <form id="modulo" novalidate>
      <div>
        <label for="utente">Utente</label>
        <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div>
        <label for="parola">Parola d'ordine</label>
        <input id="parola" name="parola" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="vai">Collegati
        <svg class="freccia" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5L15.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="ruota" aria-hidden="true"></span>
      </button>
    </form>

    <div id="esito" role="status" aria-live="polite"></div>
    <div id="dichiarazione"></div>
  </section>

  <p class="piede">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.3 7V5.2a2.7 2.7 0 0 1 5.4 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    Connessione cifrata con <b>alfa.lan</b>
  </p>
</main>

<script>
(function(){
  var modulo=document.getElementById('modulo'), esito=document.getElementById('esito'), vai=document.getElementById('vai'),
      scheda=document.querySelector('.scheda'), campi=[document.getElementById('utente'), document.getElementById('parola')];
  var ICONA='<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 5.8v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14" r="1.1" fill="currentColor"/></svg>';
  function errore(){
    esito.className='errore'; esito.innerHTML=ICONA+'<span>Utente o parola d\'ordine non validi.</span>';
    campi.forEach(function(c){c.setAttribute('aria-invalid','true')});
    scheda.classList.remove('scuoti'); void scheda.offsetWidth; scheda.classList.add('scuoti');
  }
  function pulisci(){ if(esito.className){esito.className=''; esito.innerHTML='';} campi.forEach(function(c){c.removeAttribute('aria-invalid')}); }
  campi.forEach(function(c){c.addEventListener('input',pulisci)});
  modulo.addEventListener('submit',function(e){
    e.preventDefault(); pulisci(); vai.disabled=true;
    setTimeout(function(){vai.disabled=false; errore(); campi[1].select();},900);
  });
  if(new URLSearchParams(location.search).get('stato')==='errore') errore();
})();
</script>
</body>
</html>
