<!doctype html>
<!-- Style: «Horizon» — night background, at the bottom the glowing edge of a planet at dawn; the card floats above.
     Idea: the opening of polished products (Linear, Vercel): a single gesture of light, everything else is silence. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Sign in</title>
<style>
  :root{
    --notte:#04060b; --carta:rgba(12,16,25,.86); --filo:rgba(255,255,255,.08); --filo-forte:rgba(255,255,255,.14);
    --testo:#eef2f8; --tenue:#8a94a8; --campo:#0a0e17; --campo-bordo:#262d3d;
    --accento:#3b8cff; --ciano:#00d8ff;
    --err-fondo:rgba(255,92,108,.09); --err-bordo:rgba(255,110,124,.32); --err-testo:#ffa3ad;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Cantarell,Ubuntu,sans-serif;
    --mono:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(16px, 0.42vw + 10px, 26px); background:var(--notte)}
  body{
    margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:2.5rem 1rem 4rem;
    font-family:var(--sans); color:var(--testo); background:var(--notte); overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ── the sky: a few static stars, and the air lighting up above the horizon ── */
  .cielo{position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1px 1px at 27% 42%, rgba(255,255,255,.30), transparent 60%),
      radial-gradient(1px 1px at 41% 12%, rgba(255,255,255,.40), transparent 60%),
      radial-gradient(1px 1px at 63% 26%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1.2px 1.2px at 78% 14%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1px 1px at 88% 38%, rgba(255,255,255,.28), transparent 60%),
      radial-gradient(1px 1px at 6% 56%, rgba(255,255,255,.25), transparent 60%),
      radial-gradient(1px 1px at 94% 60%, rgba(255,255,255,.22), transparent 60%),
      radial-gradient(120% 60% at 50% 100%, rgba(26,124,255,.20), transparent 60%);
  }
  /* the planet: a huge circle of which only the cap is visible */
  .pianeta{
    position:fixed; z-index:0; pointer-events:none; left:50%; top:calc(100% - 13vh);
    width:max(240vmax, 1600px); aspect-ratio:1; border-radius:50%; transform:translateX(-50%);
    background:radial-gradient(closest-side, #02040a 96%, #06142c 99.2%, #0c2a55 100%);
    box-shadow:
      0 0 0 1px rgba(150,220,255,.75),
      0 -.15rem .6rem rgba(120,210,255,.55),
      0 -1.2rem 4rem rgba(0,170,255,.32),
      0 -5rem 12rem rgba(26,124,255,.28);
  }
  /* the breath of dawn: opacity only, very slow */
  .alba{
    position:fixed; z-index:0; pointer-events:none; left:50%; bottom:calc(13vh - 6rem); width:min(70rem, 140vw); height:12rem;
    transform:translateX(-50%);
    background:radial-gradient(50% 50% at 50% 50%, rgba(140,220,255,.42), rgba(26,124,255,.12) 45%, transparent 70%);
    animation:respira 9s ease-in-out infinite alternate;
  }
  @keyframes respira{from{opacity:.55} to{opacity:1}}

  /* ── the column ── */
  .colonna{position:relative; z-index:1; width:100%; max-width:23.5rem; animation:entra .7s cubic-bezier(.2,.7,.2,1) both}
  @keyframes entra{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  .marchio{display:block; width:12.5rem; max-width:70%; margin:0 auto; color:#fff}
  .marchio svg{display:block; width:100%; height:auto}
  .motto{margin:1rem 0 2rem; text-align:center; color:var(--tenue); font-size:.98rem; line-height:1.5; letter-spacing:.005em; text-wrap:balance}

  .scheda{
    background:var(--carta); border:1px solid var(--filo); border-radius:1rem; padding:1.75rem 1.6rem 1.5rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.4);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  }
  .scheda h1{margin:0 0 .25rem; font-size:1.12rem; font-weight:620; letter-spacing:-.01em}
  .scheda .sotto{margin:0 0 1.5rem; font-size:.86rem; color:var(--tenue)}

  form{display:grid; gap:1.05rem}
  label{display:block; font-size:.8rem; font-weight:560; color:#c5ccd9; margin-bottom:.45rem}
  input{
    width:100%; font:inherit; font-size:1rem; color:var(--testo); caret-color:var(--ciano);
    padding:.72rem .85rem; border:1px solid var(--campo-bordo); border-radius:.55rem; background:var(--campo);
    transition:border-color .15s, box-shadow .15s, background-color .15s;
  }
  input:hover{border-color:#3a4356}
  input:focus{outline:none; border-color:var(--accento); box-shadow:0 0 0 3px rgba(59,140,255,.25)}
  input[aria-invalid="true"]{border-color:rgba(255,110,124,.55)}
  input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px rgba(255,110,124,.2)}
  input:disabled{opacity:.5; cursor:not-allowed}

  button{
    margin-top:.4rem; font:inherit; font-size:.98rem; font-weight:620; color:#05070d; letter-spacing:.005em;
    padding:.78rem 1rem; border:0; border-radius:.55rem; background:#f4f7fc; cursor:pointer;
    display:flex; justify-content:center; align-items:center; gap:.5rem;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 6px 20px -6px rgba(120,190,255,.45);
    transition:background-color .15s, box-shadow .2s, transform .1s;
  }
  button .freccia{width:1.05rem; height:1.05rem; transition:transform .2s}
  button:hover{background:#fff; box-shadow:0 1px 0 #fff inset, 0 8px 28px -6px rgba(120,190,255,.7)}
  button:hover .freccia{transform:translateX(3px)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--ciano); outline-offset:3px}
  button:disabled{cursor:progress; background:#c9d1de; box-shadow:none; transform:none}
  button:disabled .freccia{display:none}
  .ruota{display:none; width:1rem; height:1rem; border-radius:50%; border:2px solid rgba(5,7,13,.25); border-top-color:#05070d; animation:gira .8s linear infinite}
  button:disabled .ruota{display:block}
  @keyframes gira{to{transform:rotate(360deg)}}

  #avviso:empty, #esito:empty, #dichiarazione:empty{display:none}
  #avviso{margin:0 0 1.2rem; padding:.7rem .85rem; border-radius:.55rem; font-size:.86rem; line-height:1.45;
    background:rgba(255,190,80,.08); border:1px solid rgba(255,190,80,.3); color:#ffd391}
  #esito{margin-top:1.1rem}
  #esito.errore{display:flex; gap:.6rem; align-items:flex-start; padding:.7rem .85rem; border-radius:.55rem; font-size:.88rem; line-height:1.4;
    background:var(--err-fondo); border:1px solid var(--err-bordo); color:var(--err-testo); animation:compare .35s ease-out both}
  #esito.errore span{text-wrap:balance}
  #esito.errore svg{flex:none; width:1.05rem; height:1.05rem; margin-top:.08rem}
  @keyframes compare{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
  .scheda.scuoti{animation:scuoti .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes scuoti{20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)}}
  #dichiarazione{margin-top:1rem; padding:.7rem .85rem; border-radius:.55rem; font-size:.84rem; color:#c5ccd9; background:rgba(255,255,255,.04); border:1px solid var(--filo)}

  .piede{margin:1.5rem 0 0; padding-top:1.1rem; border-top:1px solid var(--filo); display:flex; justify-content:space-between; align-items:center; gap:.8rem; flex-wrap:wrap;
    font-size:.76rem; color:var(--tenue)}
  .piede span{display:inline-flex; align-items:center; gap:.4rem}
  .piede svg{width:.85rem; height:.85rem}
  .piede code{font-family:var(--mono); font-size:.74rem; color:#b9c3d4}
  .vivo{width:.45rem; height:.45rem; border-radius:50%; background:#2fd08f; box-shadow:0 0 0 3px rgba(47,208,143,.16)}

  @media (max-width:420px){ .scheda{padding:1.5rem 1.2rem 1.25rem} .piede{justify-content:center} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="cielo" aria-hidden="true"></div>
<div class="alba" aria-hidden="true"></div>
<div class="pianeta" aria-hidden="true"></div>

<main class="colonna">
  <div class="marchio">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 360" role="img" aria-label="REMOTIX">
      <defs>
        <linearGradient id="rx-g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00d8ff"/><stop offset=".45" stop-color="#1a7cff"/><stop offset="1" stop-color="#0646c8"/>
        </linearGradient>
        <linearGradient id="rx-t" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#1a6dff"/><stop offset="1" stop-color="#00d8ff"/>
        </linearGradient>
      </defs>
      <g fill="url(#rx-g)">
        <path d="M0 0H288A116 116 0 0 1 288 232H196L170 180H252A38 38 0 0 0 252 104H86Z"/>
        <path d="M26 138L214 356H26Z"/>
        <path d="M150 180H232L442 356H296Z"/>
      </g>
      <text x="450" y="356" font-family="Montserrat,'Arial Black','Helvetica Neue',system-ui,sans-serif" font-weight="900" font-size="272" letter-spacing="6"><tspan fill="currentColor">EMO</tspan><tspan fill="url(#rx-t)">TIX</tspan></text>
    </svg>
  </div>
  <p class="motto">Your Linux desktop, from any browser.</p>

  <section class="scheda" aria-labelledby="titolo">
    <h1 id="titolo">Sign in</h1>
    <p class="sotto">With your user on this server.</p>
    <div id="avviso"></div>

    <form id="modulo" novalidate>
      <div>
        <label for="utente">User</label>
        <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div>
        <label for="parola">Password</label>
        <input id="parola" name="parola" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="vai">Connect
        <svg class="freccia" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5L15.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="ruota" aria-hidden="true"></span>
      </button>
    </form>

    <div id="esito" role="status" aria-live="polite"></div>
    <div id="dichiarazione"></div>

    <p class="piede">
      <span><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.3 7V5.2a2.7 2.7 0 0 1 5.4 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Encrypted connection</span>
      <span><i class="vivo" aria-hidden="true"></i><code>alfa.lan</code></span>
    </p>
  </section>
</main>

<script>
(function(){
  var modulo=document.getElementById('modulo'), esito=document.getElementById('esito'), vai=document.getElementById('vai'),
      scheda=document.querySelector('.scheda'), campi=[document.getElementById('utente'), document.getElementById('parola')];
  var ICONA='<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 5.8v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14" r="1.1" fill="currentColor"/></svg>';
  function errore(){
    esito.className='errore'; esito.innerHTML=ICONA+'<span>Invalid user or password.</span>';
    campi.forEach(function(c){c.setAttribute('aria-invalid','true')});
    scheda.classList.remove('scuoti'); void scheda.offsetWidth; scheda.classList.add('scuoti');
  }
  function pulisci(){ if(esito.className){esito.className=''; esito.innerHTML='';} campi.forEach(function(c){c.removeAttribute('aria-invalid')}); }
  campi.forEach(function(c){c.addEventListener('input',pulisci)});
  modulo.addEventListener('submit',function(e){
    e.preventDefault(); pulisci(); vai.disabled=true;
    setTimeout(function(){vai.disabled=false; errore(); campi[1].select();},900);
  });
  if(new URLSearchParams(location.search).get('stato')==='errore') errore();
})();
</script>
</body>
</html>
