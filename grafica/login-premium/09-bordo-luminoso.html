<!doctype html>
<!-- Style: «Glowing edge» — black background, a single card; along its edge a blade of light-blue light turns very slowly.
     Idea: the bare minimum, and one living detail that says «on, ready»; a single pseudo-element turns with transform, nothing else moves. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Sign in</title>
<style>
  :root{
    --nero:#000; --carta:#07080b; --filo:rgba(255,255,255,.075); --filo-forte:rgba(255,255,255,.12);
    --testo:#f1f3f7; --tenue:#8c93a3; --etichetta:#c3c8d3;
    --campo:#0c0e13; --campo-bordo:#22262f; --accento:#3b8cff; --ciano:#00d8ff;
    --err-fondo:rgba(255,92,108,.08); --err-bordo:rgba(255,110,124,.3); --err-testo:#ffa3ad;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Cantarell,Ubuntu,sans-serif;
    --mono:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",monospace;
    --raggio:1.15rem;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(16px, 0.42vw + 10px, 26px); background:var(--nero)}
  body{
    margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:2.5rem 1rem;
    font-family:var(--sans); color:var(--testo); overflow-x:hidden; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(40rem 26rem at 50% 46%, rgba(26,124,255,.10), transparent 70%),
      var(--nero);
  }

  .colonna{width:100%; max-width:23rem; animation:entra .7s cubic-bezier(.2,.7,.2,1) both}
  @keyframes entra{from{opacity:0; transform:scale(.985)} to{opacity:1; transform:none}}

  /* ── the frame: 1.5px of rotating light, cut out by the card that sits on top of it ── */
  .cornice{
    position:relative; isolation:isolate; padding:1.5px; border-radius:var(--raggio); overflow:hidden;
    background:var(--filo-forte);
    box-shadow:0 0 0 1px rgba(0,0,0,.9), 0 40px 80px -30px rgba(0,90,255,.35), 0 0 60px -10px rgba(0,180,255,.12);
  }
  .cornice::before{
    content:""; position:absolute; z-index:-1; left:50%; top:50%; width:250%; aspect-ratio:1;
    background:conic-gradient(from 0deg,
      transparent 0deg, transparent 200deg,
      rgba(6,70,200,.0) 220deg, #0646c8 270deg, #1a7cff 320deg, #00d8ff 352deg, #e6fbff 358deg, transparent 360deg);
    transform:translate(-50%,-50%) rotate(0deg);
    animation:gira-cornice 14s linear infinite;
    will-change:transform;
  }
  @keyframes gira-cornice{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .scheda{position:relative; border-radius:calc(var(--raggio) - 1.5px); background:var(--carta); padding:2rem 1.7rem 1.5rem;
    background-image:radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.035), transparent 60%)}

  .marchio{display:block; width:10.5rem; margin:0 0 1.6rem; color:#fff}
  .marchio svg{display:block; width:100%; height:auto}
  .scheda h1{margin:0; font-size:1.3rem; font-weight:640; letter-spacing:-.02em}
  .motto{margin:.4rem 0 1.7rem; color:var(--tenue); font-size:.9rem; line-height:1.5; text-wrap:balance}

  form{display:grid; gap:1.05rem}
  label{display:block; font-size:.8rem; font-weight:560; color:var(--etichetta); margin-bottom:.45rem}
  input{
    width:100%; font:inherit; font-size:1rem; color:var(--testo); caret-color:var(--ciano);
    padding:.72rem .85rem; border:1px solid var(--campo-bordo); border-radius:.6rem; background:var(--campo);
    transition:border-color .15s, box-shadow .15s;
  }
  input:hover{border-color:#343a46}
  input:focus{outline:none; border-color:var(--accento); box-shadow:0 0 0 3px rgba(59,140,255,.22)}
  input[aria-invalid="true"]{border-color:rgba(255,110,124,.55)}
  input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px rgba(255,110,124,.2)}

  button{
    margin-top:.45rem; font:inherit; font-size:.98rem; font-weight:620; color:#000;
    padding:.8rem 1rem; border:0; border-radius:.6rem; background:#fff; cursor:pointer;
    display:flex; justify-content:center; align-items:center; gap:.5rem;
    transition:background-color .15s, box-shadow .2s, transform .1s;
  }
  button .freccia{width:1.05rem; height:1.05rem; transition:transform .2s}
  button:hover{background:#e8f6ff; box-shadow:0 0 0 1px rgba(0,216,255,.5), 0 8px 30px -6px rgba(0,190,255,.55)}
  button:hover .freccia{transform:translateX(3px)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--ciano); outline-offset:3px}
  button:disabled{cursor:progress; background:#bfc4cd; box-shadow:none; transform:none}
  button:disabled .freccia{display:none}
  .ruota{display:none; width:1rem; height:1rem; border-radius:50%; border:2px solid rgba(0,0,0,.2); border-top-color:#000; animation:gira .8s linear infinite}
  button:disabled .ruota{display:block}
  @keyframes gira{to{transform:rotate(360deg)}}

  #avviso:empty, #esito:empty, #dichiarazione:empty{display:none}
  #avviso{margin:0 0 1.2rem; padding:.7rem .85rem; border-radius:.6rem; font-size:.86rem; line-height:1.45;
    background:rgba(255,190,80,.07); border:1px solid rgba(255,190,80,.28); color:#ffd391}
  #esito{margin-top:1.1rem}
  #esito.errore{display:flex; gap:.6rem; align-items:flex-start; padding:.7rem .85rem; border-radius:.6rem; font-size:.88rem; line-height:1.4;
    background:var(--err-fondo); border:1px solid var(--err-bordo); color:var(--err-testo); animation:compare .35s ease-out both}
  #esito.errore span{text-wrap:balance}
  #esito.errore svg{flex:none; width:1.05rem; height:1.05rem; margin-top:.08rem}
  @keyframes compare{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
  /* on error the blade of light turns red: same rotation, only which layer is visible changes */
  .cornice::after{content:""; position:absolute; z-index:-1; inset:0; opacity:0; transition:opacity .4s;
    background:linear-gradient(160deg, rgba(255,110,124,.75), rgba(255,110,124,.12) 45%, rgba(255,110,124,.5))}
  .cornice.in-errore::after{opacity:1}
  .colonna.scuoti{animation:scuoti .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes scuoti{20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)}}
  #dichiarazione{margin-top:1rem; padding:.7rem .85rem; border-radius:.6rem; font-size:.84rem; color:var(--etichetta); background:rgba(255,255,255,.03); border:1px solid var(--filo)}

  .piede{margin:1.5rem 0 0; padding-top:1.1rem; border-top:1px solid var(--filo); display:flex; justify-content:space-between; align-items:center; gap:.8rem; flex-wrap:wrap;
    font-size:.76rem; color:var(--tenue)}
  .piede span{display:inline-flex; align-items:center; gap:.4rem}
  .piede svg{width:.85rem; height:.85rem}
  .piede code{font-family:var(--mono); font-size:.74rem; color:#b9c0cc}
  .vivo{width:.45rem; height:.45rem; border-radius:50%; background:#2fd08f; box-shadow:0 0 0 3px rgba(47,208,143,.16)}

  @media (max-width:420px){ .scheda{padding:1.7rem 1.2rem 1.25rem} .piede{justify-content:center} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
    .cornice::before{transform:translate(-50%,-50%) rotate(35deg)}
  }
</style>
</head>
<body>
<main class="colonna">
  <div class="cornice">
    <section class="scheda" aria-labelledby="titolo">
      <div class="marchio">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 360" role="img" aria-label="REMOTIX">
          <defs>
            <linearGradient id="rx-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#00d8ff"/><stop offset=".45" stop-color="#1a7cff"/><stop offset="1" stop-color="#0646c8"/>
            </linearGradient>
            <linearGradient id="rx-t" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#1a6dff"/><stop offset="1" stop-color="#00d8ff"/>
            </linearGradient>
          </defs>
          <g fill="url(#rx-g)">
            <path d="M0 0H288A116 116 0 0 1 288 232H196L170 180H252A38 38 0 0 0 252 104H86Z"/>
            <path d="M26 138L214 356H26Z"/>
            <path d="M150 180H232L442 356H296Z"/>
          </g>
          <text x="450" y="356" font-family="Montserrat,'Arial Black','Helvetica Neue',system-ui,sans-serif" font-weight="900" font-size="272" letter-spacing="6"><tspan fill="currentColor">EMO</tspan><tspan fill="url(#rx-t)">TIX</tspan></text>
        </svg>
      </div>
      <h1 id="titolo">Sign in</h1>
      <p class="motto">Your Linux desktop, from any browser.</p>
      <div id="avviso"></div>

      <form id="modulo" novalidate>
        <div>
          <label for="utente">User</label>
          <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div>
          <label for="parola">Password</label>
          <input id="parola" name="parola" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="vai">Connect
          <svg class="freccia" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5L15.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="ruota" aria-hidden="true"></span>
        </button>
      </form>

      <div id="esito" role="status" aria-live="polite"></div>
      <div id="dichiarazione"></div>

      <p class="piede">
        <span><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.3 7V5.2a2.7 2.7 0 0 1 5.4 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Encrypted connection</span>
        <span><i class="vivo" aria-hidden="true"></i><code>alfa.lan</code></span>
      </p>
    </section>
  </div>
</main>

<script>
(function(){
  var modulo=document.getElementById('modulo'), esito=document.getElementById('esito'), vai=document.getElementById('vai'),
      colonna=document.querySelector('.colonna'), cornice=document.querySelector('.cornice'),
      campi=[document.getElementById('utente'), document.getElementById('parola')];
  var ICONA='<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 5.8v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14" r="1.1" fill="currentColor"/></svg>';
  function errore(){
    esito.className='errore'; esito.innerHTML=ICONA+'<span>Invalid user or password.</span>';
    campi.forEach(function(c){c.setAttribute('aria-invalid','true')});
    cornice.classList.add('in-errore');
    colonna.classList.remove('scuoti'); void colonna.offsetWidth; colonna.classList.add('scuoti');
  }
  function pulisci(){ if(esito.className){esito.className=''; esito.innerHTML='';} cornice.classList.remove('in-errore'); campi.forEach(function(c){c.removeAttribute('aria-invalid')}); }
  campi.forEach(function(c){c.addEventListener('input',pulisci)});
  modulo.addEventListener('submit',function(e){
    e.preventDefault(); pulisci(); vai.disabled=true;
    setTimeout(function(){vai.disabled=false; errore(); campi[1].select();},900);
  });
  if(new URLSearchParams(location.search).get('stato')==='errore') errore();
})();
</script>
</body>
</html>
