<!doctype html>
<!-- Style: «Stacked cards» — three staggered cards like a deck, slightly tilted in 3D; the front one carries the form.
     Idea: the depth says «there is a desktop behind this door», and the colours of the cards behind are those of the logo. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Sign in</title>
<style>
  :root{
    --fondo:#070b18; --scheda:#0f1730; --scheda-alta:#131d3b; --filo:rgba(170,190,240,.12);
    --testo:#eef2fc; --tenue:#9aa6c2; --etichetta:#c9d2e8;
    --campo:#0a1124; --campo-bordo:#2a3657; --campo-bordo-su:#3e4d78;
    --accento:#1466e0; --accento-scuro:#0a4fc0; --anello:rgba(46,140,255,.38);
    --errore-testo:#ffb9b9; --errore-fondo:rgba(255,92,92,.09); --errore-bordo:rgba(255,120,120,.38);
    --vivo:#2fd39a;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(16px, 0.42vw + 10px, 26px)}
  body{
    margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:2rem 1rem;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Cantarell,Ubuntu,sans-serif;
    color:var(--testo); background:var(--fondo); overflow-x:hidden;
    background-image:
      radial-gradient(60em 40em at 70% -10%, rgba(26,124,255,.16), transparent 60%),
      radial-gradient(50em 36em at 10% 110%, rgba(0,216,255,.08), transparent 60%);
  }
  .impianto{width:100%; max-width:25rem; display:flex; flex-direction:column; align-items:center}

  .logo{width:12.5rem; height:auto; color:#fff; display:block; margin:0 0 .7rem}
  .motto{margin:0 0 2.6rem; color:var(--tenue); font-size:.95rem; text-align:center; line-height:1.45}

  /* the deck: the perspective is on the container, the tilt is fixed */
  .mazzo{position:relative; width:100%; perspective:1800px}
  .pila{position:relative; transform-style:preserve-3d; transform:rotateX(4deg) rotateY(-5deg)}
  .foglio{
    position:absolute; inset:0; border-radius:1.1rem; border:1px solid var(--filo);
    box-shadow:0 30px 60px -30px rgba(0,0,0,.8);
    animation:apre .9s cubic-bezier(.2,.8,.2,1) both;
  }
  .foglio.terzo{
    background:linear-gradient(135deg, rgba(0,216,255,.55), rgba(26,124,255,.25) 55%, rgba(6,70,200,.15));
    transform:translate3d(2.9rem,-2.3rem,-80px) rotate(4deg); opacity:.6;
  }
  .foglio.secondo{
    background:linear-gradient(135deg, #1a3f8f, #102352 60%, #0d1a3c);
    transform:translate3d(1.45rem,-1.15rem,-40px) rotate(2deg); opacity:.95;
  }
  @keyframes apre{from{transform:none; opacity:0}}

  .scheda{
    position:relative; border-radius:1.1rem; padding:2.1rem 2rem 1.5rem;
    background:linear-gradient(180deg, var(--scheda-alta), var(--scheda));
    border:1px solid rgba(170,190,240,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 40px 80px -30px rgba(0,0,0,.85), 0 12px 24px -12px rgba(0,0,0,.6);
    animation:entra .6s ease-out both;
  }
  @keyframes entra{from{opacity:0; transform:translateY(12px)}}
  .scheda h1{margin:0 0 .3rem; font-size:1.3rem; font-weight:650; letter-spacing:-.01em}
  .scheda .sotto{margin:0 0 1.6rem; color:var(--tenue); font-size:.88rem}

  form{display:grid; gap:1.05rem}
  label{display:block; font-size:.8rem; font-weight:600; letter-spacing:.02em; color:var(--etichetta); margin-bottom:.4rem}
  input{
    width:100%; font:inherit; font-size:1rem; color:var(--testo); caret-color:#5aa2ff;
    padding:.72rem .85rem; border:1px solid var(--campo-bordo); border-radius:.6rem; background:var(--campo);
    transition:border-color .15s, box-shadow .15s;
  }
  input:hover{border-color:var(--campo-bordo-su)}
  input:focus{outline:none; border-color:#3d8bff; box-shadow:0 0 0 3px var(--anello)}
  input[aria-invalid="true"]{border-color:rgba(255,120,120,.6)}
  input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px rgba(255,110,110,.25)}
  input:disabled{opacity:.5; cursor:not-allowed}

  button{
    margin-top:.45rem; font:inherit; font-size:1rem; font-weight:650; color:#fff; letter-spacing:.01em;
    padding:.8rem; border:1px solid rgba(255,255,255,.12); border-radius:.6rem; cursor:pointer;
    background:linear-gradient(180deg, var(--accento), var(--accento-scuro));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 8px 20px -10px rgba(20,102,224,.9);
    display:flex; justify-content:center; align-items:center; gap:.55rem;
    transition:filter .15s, transform .1s, box-shadow .15s;
  }
  button svg{width:1.1rem; height:1.1rem; transition:transform .2s}
  button:hover{filter:brightness(1.1)}
  button:hover svg{transform:translateX(3px)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid #8cc2ff; outline-offset:3px}
  button:disabled{cursor:wait; filter:saturate(.6) brightness(.85); box-shadow:none}
  .giro{display:none; width:1rem; height:1rem; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:gira .8s linear infinite}
  button.attesa .giro{display:block} button.attesa svg{display:none}
  @keyframes gira{to{transform:rotate(1turn)}}

  #avviso, #dichiarazione{font-size:.85rem; line-height:1.45; border-radius:.6rem; padding:.7rem .85rem}
  #avviso{margin:0 0 1.2rem; color:#ffd88a; background:rgba(255,190,70,.08); border:1px solid rgba(255,190,70,.3)}
  #dichiarazione{margin-top:1rem; color:var(--tenue); border:1px solid var(--filo)}
  #avviso:empty, #dichiarazione:empty, #esito:empty{display:none}

  #esito.errore{
    margin-top:1rem; display:flex; gap:.6rem; align-items:flex-start; padding:.7rem .85rem; border-radius:.6rem;
    font-size:.88rem; line-height:1.4; color:var(--errore-testo); background:var(--errore-fondo); border:1px solid var(--errore-bordo);
    animation:scuote .4s ease-out;
  }
  #esito svg{flex:none; width:1.1rem; height:1.1rem; margin-top:.05rem}
  @keyframes scuote{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}100%{transform:none}}

  .piede{
    margin:1.4rem -2rem -1.5rem; padding:.9rem 2rem; border-top:1px solid var(--filo); border-radius:0 0 1.1rem 1.1rem;
    display:flex; align-items:center; gap:.5rem; font-size:.78rem; color:var(--tenue); background:rgba(0,0,0,.14);
  }
  .piede svg{flex:none; width:.9rem; height:.9rem; color:var(--vivo)}
  .piede code{font-family:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",monospace; color:var(--etichetta); font-size:.95em}
  .piede .sep{opacity:.5}

  @media (max-width:520px){
    body{padding:1.5rem 1rem}
    .logo{width:10.5rem}
    .motto{margin-bottom:2.6rem}
    .pila{transform:none}
    .foglio.terzo{transform:translate3d(.4rem,-1.2rem,0) rotate(1deg)}
    .foglio.secondo{transform:translate3d(.2rem,-.6rem,0) rotate(.5deg)}
    .scheda{padding:1.7rem 1.25rem 1.2rem}
    .piede{margin:1.3rem -1.25rem -1.2rem; padding:.85rem 1.25rem}
  }
  .motto, .sotto, #esito span{text-wrap:balance}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
  }
</style>
</head>
<body>
<div class="impianto">
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 360" role="img" aria-label="REMOTIX">
    <defs>
      <linearGradient id="rx-g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#00d8ff"/><stop offset=".45" stop-color="#1a7cff"/><stop offset="1" stop-color="#0646c8"/>
      </linearGradient>
      <linearGradient id="rx-t" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#1a6dff"/><stop offset="1" stop-color="#00d8ff"/>
      </linearGradient>
    </defs>
    <g fill="url(#rx-g)">
      <path d="M0 0H288A116 116 0 0 1 288 232H196L170 180H252A38 38 0 0 0 252 104H86Z"/>
      <path d="M26 138L214 356H26Z"/>
      <path d="M150 180H232L442 356H296Z"/>
    </g>
    <text x="450" y="356" font-family="Montserrat,'Arial Black','Helvetica Neue',system-ui,sans-serif" font-weight="900" font-size="272" letter-spacing="6"><tspan fill="currentColor">EMO</tspan><tspan fill="url(#rx-t)">TIX</tspan></text>
  </svg>
  <p class="motto">Your Linux desktop, from any browser.</p>

  <div class="mazzo">
    <div class="pila">
      <div class="foglio terzo" aria-hidden="true"></div>
      <div class="foglio secondo" aria-hidden="true"></div>
      <main class="scheda" aria-labelledby="titolo">
        <h1 id="titolo">Sign in</h1>
        <p class="sotto">Enter with the server's user.</p>
        <div id="avviso"></div>

        <form id="modulo" action="#" method="post" novalidate>
          <div>
            <label for="utente">User</label>
            <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
          </div>
          <div>
            <label for="parola">Password</label>
            <input id="parola" name="parola" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" id="vai">Connect
            <span class="giro" aria-hidden="true"></span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5L15.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>

        <div id="esito" role="status" aria-live="polite"></div>
        <div id="dichiarazione"></div>

        <p class="piede">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          Encrypted connection <span class="sep">·</span> <code>alfa.lan</code>
        </p>
      </main>
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var modulo=$('modulo'), esito=$('esito'), vai=$('vai'), utente=$('utente'), parola=$('parola');
  function errore(){
    esito.className='errore';
    esito.innerHTML='<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 5.8v5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.2" r="1.1" fill="currentColor"/></svg><span>Invalid user or password.</span>';
    utente.setAttribute('aria-invalid','true'); parola.setAttribute('aria-invalid','true');
  }
  function pulisci(){esito.className=''; esito.textContent=''; utente.removeAttribute('aria-invalid'); parola.removeAttribute('aria-invalid');}
  modulo.addEventListener('submit',function(ev){
    ev.preventDefault(); pulisci(); vai.disabled=true; vai.classList.add('attesa');
    setTimeout(function(){vai.disabled=false; vai.classList.remove('attesa'); errore(); parola.value=''; parola.focus();},700);
  });
  [utente,parola].forEach(function(c){c.addEventListener('input',function(){c.removeAttribute('aria-invalid');});});
  var stato=new URLSearchParams(location.search).get('stato');
  if(stato==='errore') errore();
  if(stato==='attesa'){vai.disabled=true; vai.classList.add('attesa');}
  if(stato==='avviso') $('avviso').textContent='The sign-in attempts from this address are used up. Try again in 11 hours and 59 minutes.';
})();
</script>
</body>
</html>
