<!-- Stile: NEUMORFISMO CHIARO — tutto è della stessa «argilla» grigio-perla, i pezzi escono o rientrano con ombre morbide.
     Idea: un oggetto tattile e calmo; i campi sono incavi, il pulsante sporge e si «preme» davvero. Testi scuri per restare AA. -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Accesso</title>
<style>
  :root {
    --clay: #e7ebf0;
    --hi: #ffffff;
    --lo: #c3cad4;
    --ink: #232a36;
    --muted: #525b69;       /* 6,2:1 sull'argilla */
    --accent: #3b6fd8;      /* bianco su accento 4,9:1 */
    --accent-dark: #2d5bbd;
    --err-ink: #9d1f2b;
    --err-bg: #f7e4e6;
    --r: 22px;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(16px, 0.3vw + 14px, 24px); }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 2rem 16px;
    background: var(--clay);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif;
  }
  .card {
    width: 100%; max-width: 25rem;
    padding: 2.4rem 2.2rem 2rem;
    border-radius: 32px;
    background: var(--clay);
    box-shadow: 18px 18px 40px var(--lo), -18px -18px 40px var(--hi);
  }
  .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 2rem; }
  .knob {
    width: 5.2rem; height: 5.2rem; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--clay);
    box-shadow: 8px 8px 18px var(--lo), -8px -8px 18px var(--hi);
    margin-bottom: 1.1rem;
  }
  .knob .inner {
    width: 3.9rem; height: 3.9rem; border-radius: 50%;
    display: grid; place-items: center;
    box-shadow: inset 4px 4px 9px var(--lo), inset -4px -4px 9px var(--hi);
  }
  .knob svg { width: 2.1rem; height: 2.1rem; }
  h1 { margin: 0; font-size: 1.45rem; letter-spacing: .2em; font-weight: 750; padding-left: .2em; }
  .motto { margin: .45rem 0 0; color: var(--muted); font-size: .92rem; }

  .field { margin-bottom: 1.25rem; }
  label { display: block; font-size: .85rem; font-weight: 600; color: var(--ink); margin: 0 0 .5rem .4rem; }
  input {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    padding: .9rem 1.1rem;
    border: 1px solid transparent; border-radius: 16px;
    background: var(--clay);
    box-shadow: inset 5px 5px 10px var(--lo), inset -5px -5px 10px var(--hi);
    outline: none;
    transition: box-shadow .2s, border-color .2s;
  }
  input:hover { box-shadow: inset 6px 6px 12px #b9c1cc, inset -6px -6px 12px var(--hi); }
  input:focus-visible {
    border-color: var(--accent);
    box-shadow: inset 5px 5px 10px var(--lo), inset -5px -5px 10px var(--hi), 0 0 0 3px rgba(59,111,216,.28);
  }

  button {
    width: 100%; margin-top: .8rem;
    font: inherit; font-size: 1.02rem; font-weight: 650; letter-spacing: .02em;
    color: #fff;
    background: linear-gradient(145deg, #3b6fd8, #2d5bbd);
    border: 0; border-radius: 16px;
    padding: .95rem 1rem;
    cursor: pointer;
    box-shadow: 8px 8px 16px var(--lo), -8px -8px 16px var(--hi);
    transition: box-shadow .18s, transform .18s, background .18s;
  }
  button:hover { box-shadow: 10px 10px 20px #b9c1cc, -10px -10px 20px var(--hi); transform: translateY(-1px); }
  button:active {
    transform: none;
    background: linear-gradient(145deg, #2d5bbd, #3b6fd8);
    box-shadow: inset 4px 4px 8px rgba(20,40,90,.35), inset -3px -3px 8px rgba(255,255,255,.18);
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  /* esempio: errore — un incavo rosato */
  .error {
    display: flex; gap: .65rem; align-items: center;
    margin-top: 1.4rem; padding: .85rem 1rem;
    border-radius: 16px;
    background: var(--err-bg);
    box-shadow: inset 3px 3px 7px #dcc4c7, inset -3px -3px 7px #fff6f7;
    color: var(--err-ink); font-size: .9rem;
  }
  .error svg { flex: none; width: 1.15rem; height: 1.15rem; }

  .foot {
    display: flex; justify-content: center; align-items: center; gap: .5rem;
    margin: 1.8rem 0 0; color: var(--muted); font-size: .8rem;
  }
  .foot .dot {
    width: .55rem; height: .55rem; border-radius: 50%; background: #2f9e6b;
    box-shadow: 0 0 0 3px rgba(47,158,107,.18);
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: emerge .8s cubic-bezier(.2,.8,.2,1) both; }
    .knob { animation: emerge-knob 1s cubic-bezier(.2,.8,.2,1) .15s both; }
    .foot .dot { animation: breathe 2.8s ease-in-out infinite; }
    @keyframes emerge {
      from { opacity: 0; box-shadow: 0 0 0 var(--lo), 0 0 0 var(--hi); transform: scale(.98); }
      to   { opacity: 1; }
    }
    @keyframes emerge-knob { from { box-shadow: 0 0 0 var(--lo), 0 0 0 var(--hi); } }
    @keyframes breathe { 50% { box-shadow: 0 0 0 6px rgba(47,158,107,.08); } }
  }
  @media (max-width: 400px) {
    .card { padding: 1.8rem 1.25rem 1.5rem; border-radius: 26px;
            box-shadow: 10px 10px 24px var(--lo), -10px -10px 24px var(--hi); }
  }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <div class="knob"><div class="inner">
      <!-- Logo: schermo con un punto di segnale al centro e due onde -->
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="24" height="16" rx="3.5" stroke="#3b6fd8" stroke-width="2.2"/>
        <path d="M12 26h8" stroke="#3b6fd8" stroke-width="2.2"/>
        <circle cx="16" cy="16" r="1.8" fill="#3b6fd8"/>
        <path d="M12.8 12.8a4.5 4.5 0 0 1 6.4 0" stroke="#3b6fd8" stroke-width="2"/>
      </svg>
    </div></div>
    <h1>REMOTIX</h1>
    <p class="motto">Il tuo desktop Linux, a portata di browser</p>
  </div>

  <form action="#" method="post" onsubmit="return false">
    <div class="field">
      <label for="u">Utente</label>
      <input id="u" name="utente" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="p">Parola d'ordine</label>
      <input id="p" name="parola" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Collegati</button>
  </form>

  <!-- esempio: stato d'errore, visibile solo nel mockup -->
  <div class="error" role="alert">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/></svg>
    Utente o parola d'ordine non corretti.
  </div>

  <p class="foot"><span class="dot" aria-hidden="true"></span>Connessione cifrata · niente da installare</p>
</main>
</body>
</html>
