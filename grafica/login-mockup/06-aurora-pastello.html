<!DOCTYPE html>
<!-- Stile 06 «Aurora pastello»: sfumatura morbida pesca, lilla e azzurro che respira lentamente.
     Idea: una scheda di vetro smerigliato chiaro galleggia sull'aurora, calma e luminosa. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX · Accesso</title>
<style>
  :root {
    --ink: #2b2540;
    --ink-soft: #5b5470;
    --accent: #6b4fd8;
    --accent-2: #4f7fe0;
    --line: rgba(80, 60, 140, .22);
    --err-bg: #fdecec;
    --err-line: #f2b8b8;
    --err-ink: #9b1c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: clamp(16px, 4vw, 64px);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", Ubuntu, Cantarell, sans-serif;
    color: var(--ink);
    background: #fbf6f4;
    position: relative;
    overflow-x: hidden;
  }
  /* L'aurora: tre macchie sfumate che si spostano piano */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora span {
    position: absolute; border-radius: 50%;
    filter: blur(70px); opacity: .85;
    animation: deriva 22s ease-in-out infinite alternate;
  }
  .aurora .pesca  { width: 60vmax; height: 60vmax; left: -15vmax; top: -20vmax; background: #ffcfb8; }
  .aurora .lilla  { width: 55vmax; height: 55vmax; right: -18vmax; top: 5vmax; background: #dcc8ff; animation-delay: -7s; }
  .aurora .azzurro{ width: 60vmax; height: 60vmax; left: 10vmax; bottom: -30vmax; background: #bfe2ff; animation-delay: -14s; }
  @keyframes deriva {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(4vmax, 3vmax) scale(1.08); }
  }

  .scheda {
    position: relative; z-index: 1;
    width: min(100%, 25rem);
    padding: clamp(24px, 5vw, 44px);
    border-radius: 24px;
    background: rgba(255, 255, 255, .62);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, .85);
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset,
                0 24px 60px -20px rgba(90, 60, 150, .28),
                0 4px 14px rgba(90, 60, 150, .08);
    animation: entra .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes entra { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }

  .marchio { display: flex; align-items: center; gap: 12px; }
  .marchio svg { width: 44px; height: 44px; flex: none; }
  .marchio h1 { margin: 0; font-size: 1.55rem; letter-spacing: .14em; font-weight: 750; }
  .motto { margin: 10px 0 28px; color: var(--ink-soft); font-size: .98rem; line-height: 1.45; }

  form { display: grid; gap: 18px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
  input {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    padding: 12px 14px; border-radius: 12px;
    background: rgba(255,255,255,.8);
    border: 1px solid var(--line);
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:hover { border-color: rgba(107, 79, 216, .45); background: #fff; }
  input:focus-visible {
    outline: none; background: #fff; border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(107, 79, 216, .22);
  }
  button {
    margin-top: 6px; font: inherit; font-weight: 650; font-size: 1rem;
    padding: 13px 18px; border: 0; border-radius: 12px; cursor: pointer; color: #fff;
    background: linear-gradient(120deg, #5f43d2, #3a66cc);
    box-shadow: 0 8px 22px -8px rgba(79, 90, 220, .6);
    transition: transform .15s, box-shadow .2s, filter .2s;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 12px 26px -8px rgba(79, 90, 220, .7); }
  button:active { transform: translateY(0); }
  button:focus-visible { outline: 3px solid #2b2540; outline-offset: 3px; }

  /* esempio: stato d'errore, qui sempre visibile per disegnarlo */
  .errore {
    margin-top: 18px; display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px; border-radius: 12px;
    background: var(--err-bg); border: 1px solid var(--err-line); color: var(--err-ink);
    font-size: .9rem; line-height: 1.4;
  }
  .errore svg { flex: none; margin-top: 1px; }

  .piede { margin: 26px 0 0; text-align: center; font-size: .78rem; color: var(--ink-soft); display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }

  @media (min-width: 2000px) { html { font-size: 22px; } }
  @media (prefers-reduced-motion: reduce) {
    .aurora span, .scheda { animation: none; }
    input, button { transition: none; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span class="pesca"></span><span class="lilla"></span><span class="azzurro"></span></div>

  <main class="scheda">
    <div class="marchio">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f7a"/><stop offset=".5" stop-color="#9b7bf0"/><stop offset="1" stop-color="#5aa8f0"/></linearGradient></defs>
        <rect x="4" y="8" width="40" height="26" rx="5" fill="url(#g6)"/>
        <rect x="8" y="12" width="32" height="18" rx="2.5" fill="#fff" opacity=".9"/>
        <path d="M18 24a8 8 0 0 1 12 0M21 21.5a4 4 0 0 1 6 0" fill="none" stroke="#6b4fd8" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="26.3" r="1.4" fill="#6b4fd8"/>
        <path d="M18 41h12M24 34v7" stroke="#6b5f8a" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <h1>REMOTIX</h1>
    </div>
    <p class="motto">Il tuo desktop Linux, da qualunque browser.</p>

    <form action="#" method="post" onsubmit="return false">
      <div>
        <label for="utente">Utente</label>
        <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div>
        <label for="parola">Parola d'ordine</label>
        <input id="parola" name="parola" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Collegati</button>
    </form>

    <!-- esempio: messaggio d'errore dopo un tentativo sbagliato -->
    <div class="errore" role="alert">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 5.5v5.5M10 14v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Utente o parola d'ordine non corretti.</span>
    </div>

    <p class="piede">
      <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      Connessione cifrata · niente da installare
    </p>
  </main>
</body>
</html>
