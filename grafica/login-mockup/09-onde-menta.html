<!DOCTYPE html>
<!-- Stile 09 «Onde menta»: fondo bianco-acqua, tre onde SVG turchese e menta che ondeggiano in basso.
     Idea: il flusso continuo della connessione; scheda bianca con striscia turchese in cima, fresca e ordinata. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX · Accesso</title>
<style>
  :root {
    --ink: #10363a;
    --ink-soft: #3f6266;
    --tur: #0e8a86;
    --tur-dark: #0a716e;
    --line: #cfe4e1;
    --err-bg: #fff0ef;
    --err-line: #f3c0ba;
    --err-ink: #9d2318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    padding: clamp(16px, 4vw, 64px) clamp(16px, 4vw, 64px) clamp(120px, 22vh, 260px);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", Ubuntu, Cantarell, sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 0%, #ffffff 0%, #f1fbf9 55%, #e4f6f2 100%) fixed;
    overflow-x: hidden;
  }
  .mare { position: fixed; left: 0; right: 0; bottom: 0; height: clamp(140px, 30vh, 360px); pointer-events: none; overflow: hidden; }
  .mare svg { position: absolute; bottom: 0; left: 0; width: 200%; height: 100%; animation: ondeggia linear infinite; }
  .o1 { animation-duration: 26s; opacity: .45; }
  .o2 { animation-duration: 18s; animation-direction: reverse; opacity: .6; height: 80% !important; }
  .o3 { animation-duration: 12s; height: 58% !important; }
  @keyframes ondeggia { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .scheda {
    position: relative; z-index: 1; width: min(100%, 25.5rem);
    background: #fff; border-radius: 20px; overflow: hidden;
    border: 1px solid #dbeeea;
    box-shadow: 0 22px 50px -24px rgba(10, 100, 95, .4), 0 2px 6px rgba(10, 100, 95, .06);
    animation: galleggia .8s cubic-bezier(.2,.8,.2,1) both;
  }
  .scheda::before { content: ""; display: block; height: 6px; background: linear-gradient(90deg, #36c7b0, #0e8a86, #5fd4c4); }
  .corpo { padding: clamp(24px, 5vw, 42px); }
  @keyframes galleggia { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .marchio { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .marchio svg { width: 60px; height: 60px; margin-bottom: 10px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .16em; font-weight: 700; }
  .motto { margin: 8px 0 28px; color: var(--ink-soft); text-align: center; line-height: 1.45; }

  form { display: grid; gap: 20px; }
  .campo { position: relative; }
  /* etichetta sopra il campo, piccola, sempre visibile (niente placeholder che sparisce) */
  label { display: block; font-size: .82rem; font-weight: 650; color: var(--ink); margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    padding: 12px 2px 10px; border: 0; border-bottom: 2px solid var(--line);
    background: transparent; border-radius: 0;
    transition: border-color .2s;
  }
  .campo::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--tur);
    transform: scaleX(0); transform-origin: left; transition: transform .3s ease;
  }
  .campo:focus-within::after { transform: scaleX(1); }
  input:hover { border-bottom-color: #9fcac4; }
  input:focus-visible { outline: none; background: #f4fbfa; }
  .campo:focus-within label { color: var(--tur-dark); }
  button {
    margin-top: 10px; font: inherit; font-weight: 650; font-size: 1rem; color: #fff;
    padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--tur); position: relative; overflow: hidden;
    box-shadow: 0 10px 22px -12px rgba(14, 138, 134, .9);
    transition: background .2s, transform .15s;
  }
  button::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
    transform: translateX(-100%); transition: transform .6s ease;
  }
  button:hover { background: var(--tur-dark); transform: translateY(-1px); }
  button:hover::after { transform: translateX(100%); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* esempio: stato d'errore sempre visibile nel mockup */
  .errore {
    margin-top: 18px; padding: 12px 14px; border-radius: 12px;
    background: var(--err-bg); border-left: 4px solid #d9483b; border-top: 1px solid var(--err-line); border-right: 1px solid var(--err-line); border-bottom: 1px solid var(--err-line);
    color: var(--err-ink); font-size: .9rem;
  }
  .piede { margin: 24px 0 0; text-align: center; font-size: .78rem; color: var(--ink-soft); }

  @media (min-width: 2000px) { html { font-size: 22px; } }
  @media (prefers-reduced-motion: reduce) {
    .mare svg, .scheda { animation: none; }
    input, button, button::after, .campo::after { transition: none; }
  }
</style>
</head>
<body>
  <div class="mare" aria-hidden="true">
    <svg class="o1" viewBox="0 0 2400 200" preserveAspectRatio="none"><path fill="#7fdcc8" d="M0 90 C200 40 400 140 600 90 S1000 40 1200 90 S1600 140 1800 90 S2200 40 2400 90 V200 H0z"/></svg>
    <svg class="o2" viewBox="0 0 2400 200" preserveAspectRatio="none"><path fill="#3cbfae" d="M0 100 C150 60 450 140 600 100 S1050 60 1200 100 S1650 140 1800 100 S2250 60 2400 100 V200 H0z"/></svg>
    <svg class="o3" viewBox="0 0 2400 200" preserveAspectRatio="none"><path fill="#1aa39a" d="M0 110 C250 70 350 150 600 110 S950 70 1200 110 S1550 150 1800 110 S2150 70 2400 110 V200 H0z"/></svg>
  </div>

  <main class="scheda"><div class="corpo">
    <div class="marchio">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect x="4" y="7" width="40" height="27" rx="6" fill="#e3f7f3" stroke="#0e8a86" stroke-width="2.2"/>
        <path d="M9 24c3-4 6-4 9 0s6 4 9 0 6-4 9 0" fill="none" stroke="#0e8a86" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M9 18c3-4 6-4 9 0s6 4 9 0 6-4 9 0" fill="none" stroke="#5fd4c4" stroke-width="2" stroke-linecap="round"/>
        <path d="M18 41h12M24 34v7" stroke="#10363a" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <h1>REMOTIX</h1>
    </div>
    <p class="motto">Il tuo desktop Linux, in un flusso continuo, da qualunque browser.</p>

    <form action="#" method="post" onsubmit="return false">
      <div class="campo">
        <label for="utente">Utente</label>
        <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="campo">
        <label for="parola">Parola d'ordine</label>
        <input id="parola" name="parola" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Collegati</button>
    </form>

    <!-- esempio: messaggio d'errore dopo un tentativo sbagliato -->
    <div class="errore" role="alert"><strong>Accesso negato.</strong> Utente o parola d'ordine non corretti.</div>

    <p class="piede">Connessione cifrata · niente da installare</p>
  </div></main>
</body>
</html>
