<!doctype html>
<!-- Stile: «Finestra di sistema» — il modulo vive dentro una finestra con barra del titolo, su un desktop chiaro stilizzato.
     Idea: l'accesso ha già l'aspetto di quello che si ottiene dopo: un pannello in alto, uno sfondo morbido, una finestra in primo piano. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Accesso</title>
<style>
  :root{
    --inchiostro:#1c2330; --tenue:#566172; --bordo:#d6dce5;
    --accento:#3a56d4; --accento-scuro:#2c44b0;
    --titolo-fondo:#eef1f6; --titolo-bordo:#dde2ea;
    --errore-fondo:#fdeeee; --errore-bordo:#f0c2c2; --errore-testo:#a3201f;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(16px, 0.42vw + 10px, 26px)}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Cantarell,Ubuntu,sans-serif;
    color:var(--inchiostro);
    background:#e9eef6;
    background-image:
      radial-gradient(ellipse 60% 50% at 20% 30%, #d9e4fb 0, transparent 70%),
      radial-gradient(ellipse 55% 45% at 85% 75%, #f7e3ec 0, transparent 70%),
      radial-gradient(ellipse 40% 40% at 70% 15%, #e0f3ef 0, transparent 70%);
  }

  /* pannello del desktop, in alto */
  .pannello{
    display:flex; align-items:center; justify-content:space-between;
    padding:.35rem 1rem; font-size:.8rem; color:#2c3442;
    background:rgba(255,255,255,.72); border-bottom:1px solid rgba(40,50,70,.08);
    backdrop-filter:blur(8px);
  }
  .pannello .sx{display:flex; gap:1.1rem; align-items:center}
  .pannello .sx b{font-weight:650}
  .pannello .dx{display:flex; gap:.8rem; align-items:center}
  .pannello svg{width:.95rem; height:.95rem; display:block}

  .scrivania{flex:1; display:grid; place-items:center; padding:2rem 1rem 3rem; position:relative}

  /* icone sul desktop, solo decoro */
  .icone{position:absolute; left:1.5rem; top:1.5rem; display:grid; gap:1.2rem}
  .icone div{display:grid; justify-items:center; gap:.25rem; font-size:.7rem; color:#3d4758; width:4.2rem}
  .icone svg{width:2.2rem; height:2.2rem}

  /* la finestra */
  .finestra{
    width:100%; max-width:28rem; background:#fff; border-radius:.7rem; overflow:hidden;
    border:1px solid rgba(30,40,60,.14);
    box-shadow:0 2px 4px rgba(20,30,50,.06), 0 24px 48px -16px rgba(20,30,60,.28);
    animation:apri .45s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes apri{from{opacity:0; transform:scale(.96) translateY(8px)} to{opacity:1; transform:none}}
  .barra{
    display:flex; align-items:center; gap:.6rem; padding:.55rem .75rem;
    background:var(--titolo-fondo); border-bottom:1px solid var(--titolo-bordo);
    font-size:.82rem; font-weight:600; color:#39414f;
  }
  .barra .titolo{flex:1; text-align:center}
  .barra .spazio{width:3.6rem; display:flex}
  .comandi{display:flex; gap:.4rem; width:3.6rem; justify-content:flex-end}
  .comandi span{width:.8rem; height:.8rem; border-radius:50%; background:#cfd5de; transition:background .15s}
  .finestra:hover .comandi span:nth-child(1){background:#e8b931}
  .finestra:hover .comandi span:nth-child(2){background:#4cb35e}
  .finestra:hover .comandi span:nth-child(3){background:#e0554f}
  .barra svg{width:1rem; height:1rem}

  .corpo{padding:1.75rem 1.75rem 1.4rem}
  .marchio{display:flex; align-items:center; gap:.75rem}
  .marchio svg{width:2.6rem; height:2.6rem; flex:none}
  .marchio h1{margin:0; font-size:1.45rem; letter-spacing:.1em; font-weight:750}
  .motto{margin:.15rem 0 0; color:var(--tenue); font-size:.88rem}

  form{display:grid; gap:.95rem; margin-top:1.5rem}
  .campo{display:grid; grid-template-columns:8.2rem 1fr; align-items:center; gap:.75rem}
  label{font-size:.88rem; font-weight:600; text-align:right; color:#2f3745}
  input{
    width:100%; font:inherit; font-size:.98rem; color:var(--inchiostro);
    padding:.55rem .7rem; border:1px solid #bfc7d3; border-radius:.35rem; background:#fff;
    box-shadow:inset 0 1px 2px rgba(20,30,50,.06);
    transition:border-color .15s, box-shadow .15s;
  }
  input:hover{border-color:#8f9bac}
  input:focus{outline:none; border-color:var(--accento); box-shadow:0 0 0 3px rgba(58,86,212,.25)}

  .azioni{display:flex; justify-content:flex-end; gap:.6rem; margin-top:.4rem; padding-top:1rem; border-top:1px solid #edf0f4}
  button{
    font:inherit; font-size:.95rem; font-weight:650; color:#fff;
    padding:.6rem 1.4rem; border:1px solid var(--accento-scuro); border-radius:.35rem;
    background:linear-gradient(#4462e0, var(--accento)); cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  button:hover{filter:brightness(.93)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:3px solid #9fb0f2; outline-offset:2px}

  /* esempio: stato d'errore */
  .errore{
    margin:1rem 0 0; padding:.6rem .8rem; border-radius:.35rem; font-size:.86rem;
    display:flex; gap:.55rem; align-items:flex-start;
    background:var(--errore-fondo); border:1px solid var(--errore-bordo); color:var(--errore-testo);
  }
  .errore svg{flex:none; width:1.05rem; height:1.05rem; margin-top:.1rem}

  .stato{
    display:flex; justify-content:space-between; gap:1rem; padding:.45rem .9rem;
    background:#f6f8fb; border-top:1px solid var(--titolo-bordo); font-size:.74rem; color:var(--tenue);
  }
  .stato .ok{display:inline-flex; align-items:center; gap:.35rem}
  .stato .ok::before{content:""; width:.5rem; height:.5rem; border-radius:50%; background:#2f9a57}

  @media (max-width:760px){ .icone{display:none} }
  @media (max-width:440px){
    .pannello .sx span{display:none}
    .corpo{padding:1.4rem 1.15rem 1.2rem}
    .campo{grid-template-columns:1fr; gap:.3rem}
    label{text-align:left}
    .azioni{justify-content:stretch} button{width:100%}
    .stato{flex-direction:column; gap:.1rem}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
  }
</style>
</head>
<body>
<header class="pannello" aria-hidden="true">
  <div class="sx"><b>REMOTIX</b><span>Attività</span><span>Sessione</span></div>
  <div class="dx">
    <svg viewBox="0 0 16 16"><path d="M1.5 6.5a9.5 9.5 0 0 1 13 0M4 9a6 6 0 0 1 8 0M6.5 11.5a2.4 2.4 0 0 1 3 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="7" rx="1.2" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    <span>09:41</span>
  </div>
</header>

<div class="scrivania">
  <div class="icone" aria-hidden="true">
    <div><svg viewBox="0 0 36 36"><path d="M4 9a2 2 0 0 1 2-2h8l3 3h13a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="#8fb0ea"/><path d="M4 13h28v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="#6f96e0"/></svg>Cartella</div>
    <div><svg viewBox="0 0 36 36"><rect x="4" y="6" width="28" height="24" rx="3" fill="#39414f"/><path d="M9 13l4 3-4 3M15 20h7" stroke="#bfe7c9" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Terminale</div>
    <div><svg viewBox="0 0 36 36"><rect x="8" y="4" width="20" height="28" rx="2" fill="#fff" stroke="#b9c2cf"/><path d="M12 11h12M12 16h12M12 21h8" stroke="#b9c2cf" stroke-width="2" stroke-linecap="round"/></svg>Note</div>
  </div>

  <main class="finestra">
    <div class="barra">
      <span class="spazio" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="7" rx="1.2" fill="#3a56d4"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="#3a56d4" stroke-width="1.5"/></svg></span>
      <span class="titolo">Accesso — REMOTIX</span>
      <span class="comandi" aria-hidden="true"><span></span><span></span><span></span></span>
    </div>

    <div class="corpo">
      <div class="marchio">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="10" fill="#3a56d4"/>
          <rect x="10" y="12" width="28" height="18" rx="2.5" fill="none" stroke="#fff" stroke-width="2.6"/>
          <path d="M19 37h10M24 30v7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M16 21h16M28 17l4 4-4 4" stroke="#cdd6ff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <h1>REMOTIX</h1>
          <p class="motto">Il tuo desktop Linux, in una finestra del browser</p>
        </div>
      </div>

      <form action="#" method="post">
        <div class="campo">
          <label for="utente">Utente</label>
          <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="campo">
          <label for="parola">Parola d'ordine</label>
          <input id="parola" name="parola" type="password" autocomplete="current-password" required>
        </div>
        <div class="azioni">
          <button type="submit">Collegati</button>
        </div>
      </form>

      <!-- esempio: stato d'errore dopo un tentativo sbagliato -->
      <div class="errore" role="alert">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l8 14H2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 8v4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="10" cy="14.3" r="1.1" fill="currentColor"/></svg>
        <span>Utente o parola d'ordine non corretti.</span>
      </div>
    </div>

    <footer class="stato">
      <span class="ok">Connessione cifrata</span>
      <span>Niente da installare</span>
    </footer>
  </main>
</div>
</body>
</html>
