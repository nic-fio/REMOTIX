<!doctype html>
<!-- Stile: «Progetto tecnico» — carta millimetrata azzurrina, righe sottili, quote e squadri come su una tavola da disegno.
     Idea: la pagina è una tavola di progetto; il modulo è la «figura 1», con il cartiglio in basso come nei disegni d'officina. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Accesso</title>
<style>
  :root{
    --carta:#f6fafe; --maglia:#dbe8f5; --maglia-forte:#bfd5ec;
    --tratto:#1d4f86; --inchiostro:#132235; --tenue:#4a5e75;
    --accento:#1d4f86; --accento-scuro:#153c68;
    --errore-fondo:#fdf0f0; --errore-bordo:#e9b9b9; --errore-testo:#a01f1f;
    --mono:ui-monospace,"SFMono-Regular","DejaVu Sans Mono","Liberation Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(16px, 0.42vw + 10px, 26px)}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:2.5rem 1rem;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Cantarell,Ubuntu,sans-serif;
    color:var(--inchiostro); background-color:var(--carta);
    /* carta millimetrata: maglia fine ogni 0,5 rem, maglia grossa ogni 2,5 rem */
    background-image:
      linear-gradient(var(--maglia-forte) 1px, transparent 1px),
      linear-gradient(90deg, var(--maglia-forte) 1px, transparent 1px),
      linear-gradient(var(--maglia) 1px, transparent 1px),
      linear-gradient(90deg, var(--maglia) 1px, transparent 1px);
    background-size:2.5rem 2.5rem, 2.5rem 2.5rem, .5rem .5rem, .5rem .5rem;
    background-position:-1px -1px;
  }

  .tavola{position:relative; width:100%; max-width:27rem; animation:traccia .6s ease-out both}
  @keyframes traccia{from{opacity:0; clip-path:inset(0 0 100% 0)} to{opacity:1; clip-path:inset(0 0 0 0)}}

  .fig{
    font:600 .7rem/1 var(--mono); letter-spacing:.14em; color:var(--tratto);
    display:flex; justify-content:space-between; margin:0 0 1rem;
  }

  /* la scheda, con squadri agli angoli */
  .scheda{
    position:relative; background:rgba(255,255,255,.93); border:1.5px solid var(--tratto);
    padding:2rem 1.8rem 1.5rem;
    box-shadow:6px 6px 0 rgba(29,79,134,.08);
  }
  .scheda::before,.scheda::after,.angoli::before,.angoli::after{
    content:""; position:absolute; width:.9rem; height:.9rem; border:1.5px solid var(--tratto);
  }
  .scheda::before{top:-.55rem; left:-.55rem; border-right:0; border-bottom:0}
  .scheda::after{top:-.55rem; right:-.55rem; border-left:0; border-bottom:0}
  .angoli::before{bottom:-.55rem; left:-.55rem; border-right:0; border-top:0}
  .angoli::after{bottom:-.55rem; right:-.55rem; border-left:0; border-top:0}

  /* quota orizzontale sotto */
  .quota{position:absolute; left:0; right:0; bottom:-1.9rem; height:1rem; display:none}
  .quota svg{width:100%; height:100%; display:block}

  .marchio{display:flex; align-items:center; gap:.7rem}
  .marchio svg{width:2.5rem; height:2.5rem; flex:none}
  .marchio h1{margin:0; font-size:1.5rem; font-weight:750; letter-spacing:.2em}
  .motto{margin:.6rem 0 1.5rem; padding-bottom:1.1rem; border-bottom:1px dashed var(--maglia-forte); color:var(--tenue); font-size:.93rem}

  form{display:grid; gap:1.05rem}
  label{display:flex; justify-content:space-between; font-size:.85rem; font-weight:650; margin-bottom:.35rem}
  label small{font:500 .68rem var(--mono); color:#5d7189; letter-spacing:.08em}
  input{
    width:100%; font:inherit; font-size:1rem; color:var(--inchiostro);
    padding:.65rem .8rem; border:1px solid #9fb6cf; border-radius:0; background:#fff;
    transition:border-color .15s, box-shadow .15s;
  }
  input:hover{border-color:var(--tratto)}
  input:focus{outline:none; border-color:var(--tratto); box-shadow:3px 3px 0 var(--maglia-forte), 0 0 0 1px var(--tratto)}
  button{
    margin-top:.35rem; font:inherit; font-size:1rem; font-weight:650; letter-spacing:.04em; color:#fff;
    padding:.8rem; border:1.5px solid var(--accento-scuro); border-radius:0; background:var(--accento); cursor:pointer;
    box-shadow:4px 4px 0 var(--maglia-forte);
    transition:transform .12s, box-shadow .12s, background .15s;
  }
  button:hover{background:var(--accento-scuro); transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--maglia-forte)}
  button:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--maglia-forte)}
  button:focus-visible{outline:2px dashed var(--tratto); outline-offset:4px}

  /* esempio: stato d'errore, come una nota di revisione */
  .errore{
    margin-top:1.1rem; display:grid; grid-template-columns:auto 1fr; gap:.6rem; align-items:start;
    padding:.65rem .8rem; font-size:.87rem;
    background:var(--errore-fondo); border:1px solid var(--errore-bordo); border-left:3px solid var(--errore-testo); color:var(--errore-testo);
  }
  .errore b{font:700 .7rem/1.6 var(--mono); letter-spacing:.08em; padding:0 .3rem; border:1px solid currentColor}

  /* cartiglio */
  .cartiglio{
    margin-top:1.4rem; display:grid; grid-template-columns:1fr auto; border:1px solid var(--tratto);
    font:500 .68rem/1.3 var(--mono); color:var(--tenue); letter-spacing:.05em;
  }
  .cartiglio div{padding:.4rem .55rem}
  .cartiglio div + div{border-left:1px solid var(--tratto)}
  .cartiglio .riga{grid-column:1 / -1; border-top:1px solid var(--tratto); border-left:0 !important; font-family:system-ui,sans-serif; font-size:.76rem; letter-spacing:0; text-align:center; color:var(--tenue)}

  @media (min-width:600px){ .quota{display:block} }
  @media (max-width:400px){ .scheda{padding:1.6rem 1.2rem 1.25rem} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
  }
</style>
</head>
<body>
<div class="tavola">
  <p class="fig" aria-hidden="true"><span>FIG. 1 — ACCESSO</span><span>SCALA 1:1</span></p>

  <main class="scheda">
    <span class="angoli" aria-hidden="true"></span>
    <div class="quota" aria-hidden="true">
      <svg viewBox="0 0 400 16" preserveAspectRatio="none">
        <path d="M1 2v12M399 2v12M1 8h398" stroke="#1d4f86" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"/>
        <path d="M1 8l7-3v6zM399 8l-7-3v6z" fill="#1d4f86"/>
      </svg>
    </div>

    <div class="marchio">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="none" stroke="#bfd5ec" stroke-width="1" stroke-dasharray="2 2"/>
        <rect x="8" y="11" width="32" height="21" fill="#fff" stroke="#1d4f86" stroke-width="2.4"/>
        <path d="M18 39h12M24 32v7" stroke="#1d4f86" stroke-width="2.4"/>
        <path d="M14 17h8v8h-8zM26 17h8M26 21h8M26 25h5" stroke="#1d4f86" stroke-width="1.6" fill="none"/>
        <path d="M2 24h4M42 24h4M24 2v4" stroke="#1d4f86" stroke-width="1"/>
      </svg>
      <h1>REMOTIX</h1>
    </div>
    <p class="motto">Il tuo desktop Linux, da qualunque browser. Progettato per funzionare, ovunque.</p>

    <form action="#" method="post">
      <div>
        <label for="utente">Utente <small aria-hidden="true">A</small></label>
        <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div>
        <label for="parola">Parola d'ordine <small aria-hidden="true">B</small></label>
        <input id="parola" name="parola" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Collegati</button>
    </form>

    <!-- esempio: stato d'errore dopo un tentativo sbagliato -->
    <div class="errore" role="alert">
      <b aria-hidden="true">NOTA</b>
      <span>Utente o parola d'ordine non corretti.</span>
    </div>

    <div class="cartiglio">
      <div>REMOTIX · TAVOLA 01</div>
      <div>REV. A</div>
      <div class="riga">Connessione cifrata · niente da installare</div>
    </div>
  </main>
</div>
</body>
</html>
