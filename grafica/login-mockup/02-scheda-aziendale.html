<!-- Stile: SCHEDA AZIENDALE — una scheda bianca centrata su grigio chiarissimo, accento blu aziendale.
     Idea: il login «da prodotto serio»: ordinato, rassicurante, con ogni stato (passaggio, fuoco, errore) curato. -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Accesso</title>
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --ink: #0f1b2d;
    --muted: #55637a;
    --line: #d5dbe4;
    --blue: #1f5fd1;         /* bianco su blu 5,6:1 */
    --blue-dark: #174aa6;
    --blue-soft: #e8f0fd;
    --err-bg: #fdf1f1;
    --err-line: #f1c4c4;
    --err-ink: #9b1c1c;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(16px, 0.3vw + 14px, 24px); }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 2rem 16px;
    background:
      radial-gradient(60rem 30rem at 50% -10%, #e4ebf6 0%, transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif;
  }
  .wrap { width: 100%; max-width: 26rem; }

  .brand { display: flex; flex-direction: column; align-items: center; gap: .8rem; margin-bottom: 1.6rem; text-align: center; }
  .logo {
    width: 3.4rem; height: 3.4rem; border-radius: .9rem;
    background: linear-gradient(145deg, #2a6ee8, #1a4fb3);
    display: grid; place-items: center;
    box-shadow: 0 6px 16px -6px rgba(31,95,209,.55), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .logo svg { width: 62%; height: 62%; }
  .brand h1 { margin: 0; font-size: 1.5rem; letter-spacing: .14em; font-weight: 750; }
  .brand p { margin: 0; color: var(--muted); font-size: .95rem; }

  .card {
    background: var(--card);
    border: 1px solid #e3e8ef;
    border-radius: 14px;
    padding: 2rem 2rem 1.75rem;
    box-shadow: 0 1px 2px rgba(16,27,45,.05), 0 12px 32px -12px rgba(16,27,45,.14);
  }
  .card h2 { margin: 0 0 .25rem; font-size: 1.15rem; font-weight: 650; }
  .card .sub { margin: 0 0 1.5rem; color: var(--muted); font-size: .88rem; }

  .field { margin-bottom: 1.1rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .4rem; }
  .input {
    position: relative;
  }
  .input svg {
    position: absolute; left: .8rem; top: 50%; transform: translateY(-50%);
    width: 1.05rem; height: 1.05rem; color: #7a879b; pointer-events: none;
    transition: color .15s;
  }
  input {
    width: 100%;
    font: inherit; font-size: 1rem; color: var(--ink);
    padding: .72rem .85rem .72rem 2.5rem;
    background: #fbfcfd;
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:hover { border-color: #b6c0ce; }
  input:focus-visible {
    background: #fff;
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(31,95,209,.18);
  }
  .input:focus-within svg { color: var(--blue); }

  button {
    width: 100%; margin-top: .5rem;
    font: inherit; font-size: 1rem; font-weight: 600;
    color: #fff; background: var(--blue);
    border: 0; border-radius: 9px;
    padding: .82rem 1rem;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 4px 12px -4px rgba(31,95,209,.6);
    transition: background .15s, transform .1s, box-shadow .15s;
  }
  button:hover { background: var(--blue-dark); box-shadow: 0 6px 16px -6px rgba(31,95,209,.7); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--blue); }

  /* esempio: errore */
  .error {
    display: flex; gap: .65rem; align-items: flex-start;
    margin-top: 1.1rem;
    padding: .75rem .9rem;
    background: var(--err-bg);
    border: 1px solid var(--err-line);
    border-radius: 9px;
    color: var(--err-ink); font-size: .88rem; line-height: 1.4;
  }
  .error svg { flex: none; width: 1.1rem; height: 1.1rem; margin-top: .1rem; }
  .error b { display: block; font-weight: 600; }

  .foot {
    display: flex; justify-content: center; align-items: center; gap: .45rem;
    margin-top: 1.4rem; color: var(--muted); font-size: .8rem;
  }
  .foot svg { width: .95rem; height: .95rem; color: #2f7d4f; }

  @media (prefers-reduced-motion: no-preference) {
    .brand { animation: fade .5s ease-out both; }
    .card  { animation: lift .6s cubic-bezier(.2,.8,.2,1) .08s both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes lift { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
  }
  @media (max-width: 400px) { .card { padding: 1.5rem 1.25rem 1.25rem; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">
      <!-- Logo: monitor con due archi di collegamento -->
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="12" rx="2"/>
        <path d="M9 20h6M12 16v4"/>
        <path d="M9.5 11.2a3.5 3.5 0 0 1 5 0"/>
        <path d="M7.6 9.3a6.2 6.2 0 0 1 8.8 0"/>
      </svg>
    </div>
    <h1>REMOTIX</h1>
    <p>Il tuo desktop Linux, da qualunque browser</p>
  </div>

  <main class="card">
    <h2>Accedi al tuo desktop</h2>
    <p class="sub">Usa le credenziali del tuo utente sul server.</p>
    <form action="#" method="post" onsubmit="return false">
      <div class="field">
        <label for="u">Utente</label>
        <div class="input">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="u" name="utente" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
      </div>
      <div class="field">
        <label for="p">Parola d'ordine</label>
        <div class="input">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="p" name="parola" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit">Collegati</button>
    </form>

    <!-- esempio: stato d'errore, visibile solo nel mockup -->
    <div class="error" role="alert">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5" stroke-linecap="round"/></svg>
      <div><b>Accesso non riuscito</b>Utente o parola d'ordine non corretti.</div>
    </div>
  </main>

  <p class="foot">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
    Connessione cifrata · niente da installare
  </p>
</div>
</body>
</html>
