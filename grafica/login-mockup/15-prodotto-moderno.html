<!doctype html>
<!-- Stile: «Prodotto moderno» — il linguaggio dei servizi in rete di oggi: tanto bianco, tipografia grande, un solo colore.
     Idea: il gradiente indaco-azzurro compare soltanto nel logo e nel pulsante, così l'occhio va dritto a «Collegati». -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Accesso</title>
<style>
  :root{
    --inchiostro:#0f1729; --tenue:#5b6478; --leggero:#6b7488; --bordo:#e4e7ee; --campo:#fafbfc;
    --indaco:#4f46e5; --azzurro:#0ea5e9;
    --gradiente:linear-gradient(135deg, var(--indaco) 0%, #3b6ff0 55%, #1592d6 100%);
    --errore-fondo:#fef2f2; --errore-bordo:#fbd0d0; --errore-testo:#b42318;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(16px, 0.42vw + 10px, 26px)}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; background:#fff; color:var(--inchiostro);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Cantarell,Ubuntu,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{display:flex; align-items:center; gap:.6rem; padding:1.4rem 2rem}
  header svg{width:2rem; height:2rem}
  header .nome{font-size:1.1rem; font-weight:750; letter-spacing:.08em}

  main{flex:1; display:grid; place-items:center; padding:1rem 1rem 3rem}
  .blocco{width:100%; max-width:23rem; animation:sale .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes sale{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

  .emblema{
    width:3.4rem; height:3.4rem; border-radius:1rem; display:grid; place-items:center; background:var(--gradiente);
    box-shadow:0 10px 24px -10px rgba(79,70,229,.6), inset 0 1px 0 rgba(255,255,255,.25);
    margin-bottom:1.6rem;
  }
  .emblema svg{width:2rem; height:2rem}
  h1{margin:0; font-size:1.9rem; line-height:1.15; font-weight:750; letter-spacing:-.02em}
  h1 span{display:block; font-size:.8rem; font-weight:650; letter-spacing:.16em; color:var(--leggero); margin-bottom:.6rem}
  .motto{margin:.7rem 0 2rem; color:var(--tenue); font-size:1rem; line-height:1.5}

  form{display:grid; gap:1.1rem}
  label{display:block; font-size:.84rem; font-weight:600; margin-bottom:.4rem; color:#1f2a3d}
  input{
    width:100%; font:inherit; font-size:1rem; color:var(--inchiostro);
    padding:.78rem .9rem; border:1px solid var(--bordo); border-radius:.65rem; background:var(--campo);
    box-shadow:0 1px 2px rgba(15,23,41,.04);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input:hover{border-color:#c8cdd8}
  input:focus{outline:none; background:#fff; border-color:#6d66ea; box-shadow:0 0 0 4px rgba(79,70,229,.16)}

  button{
    position:relative; overflow:hidden; margin-top:.5rem;
    font:inherit; font-size:1rem; font-weight:650; color:#fff; letter-spacing:.01em;
    padding:.85rem; border:0; border-radius:.65rem; background:var(--gradiente); cursor:pointer;
    box-shadow:0 1px 2px rgba(15,23,41,.1), 0 10px 22px -10px rgba(79,70,229,.7);
    transition:transform .15s, box-shadow .15s;
  }
  /* un riflesso che attraversa il pulsante al passaggio */
  button::after{
    content:""; position:absolute; inset:0; transform:translateX(-120%);
    background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
    transition:transform .6s ease;
  }
  button:hover{transform:translateY(-1px); box-shadow:0 1px 2px rgba(15,23,41,.1), 0 14px 26px -10px rgba(79,70,229,.8)}
  button:hover::after{transform:translateX(120%)}
  button:active{transform:translateY(0)}
  button:focus-visible{outline:3px solid #a5b4fc; outline-offset:3px}

  /* esempio: stato d'errore */
  .errore{
    margin-top:1.1rem; display:flex; gap:.6rem; align-items:flex-start; padding:.75rem .9rem;
    border-radius:.65rem; font-size:.88rem;
    background:var(--errore-fondo); border:1px solid var(--errore-bordo); color:var(--errore-testo);
  }
  .errore svg{flex:none; width:1.1rem; height:1.1rem; margin-top:.1rem}

  footer{padding:1.4rem 1rem 1.8rem; text-align:center; font-size:.8rem; color:var(--leggero)}
  footer{display:flex; justify-content:center; align-items:center; gap:.35rem; flex-wrap:wrap}
  footer span{display:inline-flex; align-items:center; gap:.35rem}
  footer svg{width:.85rem; height:.85rem}

  @media (max-width:420px){
    header{padding:1.1rem 1rem}
    h1{font-size:1.6rem}
    .emblema{margin-bottom:1.2rem}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset=".55" stop-color="#3b6ff0"/><stop offset="1" stop-color="#1592d6"/>
    </linearGradient>
  </defs>
</svg>

<header>
  <svg viewBox="0 0 40 40" aria-hidden="true">
    <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#g)"/>
    <rect x="9" y="11" width="22" height="14" rx="2.5" fill="none" stroke="#fff" stroke-width="2.4"/>
    <path d="M16 31h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="20" cy="18" r="2.4" fill="#fff"/>
  </svg>
  <span class="nome">REMOTIX</span>
</header>

<main>
  <div class="blocco">
    <div class="emblema" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <rect x="4" y="6" width="24" height="16" rx="2.5" fill="none" stroke="#fff" stroke-width="2.2"/>
        <path d="M12 27h8M16 22v5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M10.5 14.5a7.5 7.5 0 0 1 11 0M13.3 17a3.6 3.6 0 0 1 5.4 0" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
      </svg>
    </div>
    <h1><span>REMOTIX</span>Accedi al tuo desktop</h1>
    <p class="motto">Il tuo desktop Linux, da qualunque browser.</p>

    <form action="#" method="post">
      <div>
        <label for="utente">Utente</label>
        <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div>
        <label for="parola">Parola d'ordine</label>
        <input id="parola" name="parola" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Collegati</button>
    </form>

    <!-- esempio: stato d'errore dopo un tentativo sbagliato -->
    <div class="errore" role="alert">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 5.5v5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14.2" r="1.2" fill="currentColor"/></svg>
      <span>Utente o parola d'ordine non corretti.</span>
    </div>
  </div>
</main>

<footer>
  <span><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="7" rx="1.5" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Connessione cifrata</span> · niente da installare
</footer>
</body>
</html>
