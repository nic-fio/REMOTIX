<!doctype html>
<!--
  18-decodifica-chrome.html — un browser VERO decodifica il flusso, con la stessa
  strada della pagina del prodotto: Annex-B → EncodedVideoChunk → VideoDecoder.

  Si apre con Chrome headless (`18-decodifica-chrome.sh`) e l'esito si legge
  dalla console (`console.log`, con `--enable-logging=stderr`):
    google-chrome --headless=new --allow-file-access-from-files --enable-logging=stderr \
      "file:///…/18-decodifica-chrome.html?flusso=file:///…/F.bin&codec=avc1.64002a"
  E' una riga JSON: fotogrammi decodificati, errori, la
  misura del primo fotogramma, e un'impronta (somma dei pixel) di ogni decimo
  fotogramma — cosi' due flussi «uguali» si confrontano anche sull'immagine.

  ⚠ Il codec si passa come lo passa la pagina (`hev1.1.6.L120.B0`,
    `avc1.64002a`): la stringa e' la stessa che `src/codificatore.c` legge
    dall'SPS, e se Chrome la rifiuta e' un rosso vero.
-->
<html><head><meta charset="utf-8"><title>18-decodifica</title></head>
<body>
<pre id="esito">in corso</pre>
<script>
(async () => {
  const p = new URLSearchParams(location.search);
  const flusso = p.get("flusso"), codec = p.get("codec");
  const esito = { flusso, codec, decodificati: 0, errori: [], chunk: 0, misura: "", impronte: [] };
  const fine = (m) => {
    const testo = "ESITO " + JSON.stringify(Object.assign(esito, m || {}));
    document.getElementById("esito").textContent = testo;
    console.log(testo); /* e' quel che 18-decodifica-chrome.sh legge dal registro di Chrome */
    setTimeout(() => window.close(), 300); /* in headless l'ultima finestra chiusa chiude Chrome */
  };
  try {
    const byte = new Uint8Array(await (await fetch(flusso)).arrayBuffer());
    // la fila dei NAL: si taglia sui codici di inizio, si raggruppano in fotogrammi
    // (un fotogramma = dal primo NAL non-VCL o VCL fino al VCL successivo compreso)
    const hevc = codec.startsWith("hev1") || codec.startsWith("hvc1");
    const nal = [];
    let i = 0;
    while (i + 3 <= byte.length) {
      if (byte[i] === 0 && byte[i + 1] === 0 && byte[i + 2] === 1) {
        const inizio = (i > 0 && byte[i - 1] === 0) ? i - 1 : i;
        let j = i + 3;
        while (j + 3 <= byte.length && !(byte[j] === 0 && byte[j + 1] === 0 && byte[j + 2] === 1)) j++;
        let fine_nal = j;
        if (j + 3 <= byte.length && j > 0 && byte[j - 1] === 0) fine_nal = j - 1;
        nal.push({ inizio, fine: fine_nal, tipo: hevc ? (byte[i + 3] >> 1) & 0x3f : byte[i + 3] & 0x1f });
        i = j;
      } else i++;
    }
    const vcl = (t) => hevc ? t <= 31 : (t >= 1 && t <= 5);
    const chiave = (t) => hevc ? (t >= 16 && t <= 23) : t === 5;
    const fotogrammi = [];
    let corrente = null;
    for (const n of nal) {
      if (!corrente) corrente = { inizio: n.inizio, fine: n.fine, chiave: false };
      corrente.fine = n.fine;
      if (vcl(n.tipo)) { corrente.chiave = chiave(n.tipo); fotogrammi.push(corrente); corrente = null; }
    }
    esito.chunk = fotogrammi.length;
    let n = 0;
    const tela = document.createElement("canvas");
    const ctx = tela.getContext("2d", { willReadFrequently: true });
    const dec = new VideoDecoder({
      output: (f) => {
        n++;
        if (!esito.misura) esito.misura = f.codedWidth + "x" + f.codedHeight + " (mostra " + f.displayWidth + "x" + f.displayHeight + ")";
        if ((n - 1) % 10 === 0) {
          tela.width = 64; tela.height = 36;
          ctx.drawImage(f, 0, 0, 64, 36);
          const d = ctx.getImageData(0, 0, 64, 36).data;
          let s = 0; for (let k = 0; k < d.length; k += 4) s += d[k] + d[k + 1] + d[k + 2];
          esito.impronte.push(s);
        }
        f.close();
      },
      error: (e) => { esito.errori.push(String(e)); },
    });
    const config = { codec, optimizeForLatency: true };
    const sup = await VideoDecoder.isConfigSupported(config);
    esito.supportato = sup.supported;
    if (!sup.supported) return fine({ decodificati: 0, perche: "configure non supportata" });
    dec.configure(config);
    fotogrammi.forEach((f, k) => {
      dec.decode(new EncodedVideoChunk({ type: f.chiave ? "key" : "delta", timestamp: k * 16667, data: byte.subarray(f.inizio, f.fine) }));
    });
    await dec.flush();
    fine({ decodificati: n });
  } catch (e) {
    fine({ eccezione: String(e) });
  }
})();
</script>
</body></html>
