<!doctype html>
<meta charset="utf-8">
<title>Banco tela</title>
<!--
  Banco «strada del disegno» — Firefox 140, VideoFrame VA-API → vetro.
  Uso:  banco-tela.html?via=bmp|gl&file=prova.h264&fps=60&secondi=30
    via=bmp  createImageBitmap(f) + bitmaprenderer   (strada di oggi)
    via=gl   WebGL2 texImage2D(f) + triangolo pieno  (candidata)
  Il file è H.264 Annex-B con AUD (una unità d'accesso per AUD), fatto sul server:
    ffmpeg -f lavfi -i testsrc2=3840x2160:r=60 -t 30 -pix_fmt yuv420p \
      -c:v libx264 -profile:v high -level 5.1 -bf 0 -g 600 \
      -x264-params aud=1 -preset veryfast prova.h264
  Esito: window.ESITO (JSON) e document.title = "FATTO" alla fine.
  Profilo Firefox: webgl.perf.max-warnings=20 per vedere in console
  «Missed GPU-copy fast-path: ...» se la via veloce NON scatta.
-->
<body style="margin:0;background:#000">
<canvas id="t" style="width:100vw;height:100vh;display:block"></canvas>
<script>
const P = new URLSearchParams(location.search);
const VIA = P.get("via") || "bmp", FPS = +(P.get("fps") || 60),
      SECONDI = +(P.get("secondi") || 30), FILE = P.get("file") || "prova.h264";
const tela = document.getElementById("t");
const R = { via: VIA, usciti: 0, saltati_coda: 0, dipinti: 0, errori: [],
            disegno_ms: [], callback_gap_ms: [], coda_max: 0, formato: null };
let ctx, gl, tex;

function prepara(l, a) {
  tela.width = l; tela.height = a;
  if (VIA === "bmp") { ctx = tela.getContext("bitmaprenderer"); return; }
  gl = tela.getContext("webgl2", { alpha: false, antialias: false, depth: false,
                                   preserveDrawingBuffer: false,
                                   desynchronized: true });
  const vs = `#version 300 es
    out vec2 uv; void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2);
    uv = vec2(p.x, 1.0-p.y); gl_Position = vec4(p*2.0-1.0,0,1); }`;
  const fs = `#version 300 es
    precision mediump float; in vec2 uv; uniform sampler2D s; out vec4 c;
    void main(){ c = texture(s, uv); }`;
  const pr = gl.createProgram();
  for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh);
    gl.attachShader(pr, sh);
  }
  gl.linkProgram(pr); gl.useProgram(pr);
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER])
    gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  /* ⚠ condizioni della via veloce (TexUnpackBlob.cpp BlitPreventReason):
     livello 0, offset 0, RGBA/UNSIGNED_BYTE, niente UNPACK_SKIP, stesso spazio colore. */
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.viewport(0, 0, l, a);
}

function disegna(f) {
  const t0 = performance.now();
  if (VIA === "bmp") {
    createImageBitmap(f).then((b) => {
      R.disegno_ms.push(performance.now() - t0);
      f.close();
      ctx.transferFromImageBitmap(b); R.dipinti++;
    }).catch((e) => { f.close(); R.errori.push(String(e)); });
    R.chiamata_ms = (R.chiamata_ms || []); R.chiamata_ms.push(performance.now() - t0);
    return;
  }
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, f);
  f.close();                               /* ⭐ chiuso SUBITO: la via veloce ha già copiato */
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  R.disegno_ms.push(performance.now() - t0); R.dipinti++;
}

let ultimo_cb = 0, dec;
function uscita(f) {
  const ora = performance.now();
  if (ultimo_cb) R.callback_gap_ms.push(ora - ultimo_cb);
  ultimo_cb = ora; R.usciti++;
  if (R.formato === null) R.formato = f.format;
  if (!gl && !ctx) prepara(f.displayWidth, f.displayHeight);
  R.coda_max = Math.max(R.coda_max, dec.decodeQueueSize);
  if (dec.decodeQueueSize > 2) { R.saltati_coda++; f.close(); return; }   /* la regola della pagina */
  disegna(f);
}

function unita(buf) {                      /* Annex-B → unità d'accesso sull'AUD (nal 9) */
  const u = new Uint8Array(buf), inizi = [];
  for (let i = 0; i + 4 < u.length; i++)
    if (u[i] === 0 && u[i+1] === 0 && u[i+2] === 1 && (u[i+3] & 31) === 9)
      inizi.push(i > 0 && u[i-1] === 0 ? i - 1 : i);
  inizi.push(u.length);
  const out = [];
  for (let k = 0; k + 1 < inizi.length; k++) {
    const pezzo = u.subarray(inizi[k], inizi[k+1]);
    let chiave = false;                    /* nal 5 = IDR */
    for (let i = 0; i + 3 < pezzo.length; i++)
      if (pezzo[i] === 0 && pezzo[i+1] === 0 && pezzo[i+2] === 1 && (pezzo[i+3] & 31) === 5) { chiave = true; break; }
    out.push({ dati: pezzo, chiave });
  }
  return out;
}

function mediana(v) { if (!v.length) return null; const s = [...v].sort((a,b)=>a-b);
  return +s[s.length >> 1].toFixed(2); }
function p95(v) { if (!v.length) return null; const s = [...v].sort((a,b)=>a-b);
  return +s[Math.floor(s.length * 0.95)].toFixed(2); }

(async () => {
  const au = unita(await (await fetch(FILE)).arrayBuffer());
  dec = new VideoDecoder({ output: uscita, error: (e) => R.errori.push("dec: " + e) });
  dec.configure({ codec: P.get("codec") || "avc1.640033", optimizeForLatency: true,
                  hardwareAcceleration: P.get("hw") || "no-preference" });
  const passo = 1000 / FPS, t_inizio = performance.now();
  let n = 0;
  await new Promise((fine) => {
    const giro = () => {                   /* consegna al ritmo del server, come il filo */
      const dovuti = Math.floor((performance.now() - t_inizio) / passo);
      while (n <= dovuti) {
        const a = au[n % au.length];
        if (n > 0 && n % au.length === 0 && !a.chiave) { n++; continue; }
        dec.decode(new EncodedVideoChunk({ type: (n === 0 || a.chiave) ? "key" : "delta",
                                           timestamp: n * passo * 1000, data: a.dati }));
        n++;
      }
      if (performance.now() - t_inizio < SECONDI * 1000) setTimeout(giro, 2); else fine();
    };
    giro();
  });
  await dec.flush().catch(() => {});
  window.ESITO = { via: VIA, consegnati: n, usciti: R.usciti, dipinti: R.dipinti,
    saltati_coda: R.saltati_coda,
    saltati_pct: +(100 * R.saltati_coda / Math.max(1, R.usciti)).toFixed(1),
    disegno_ms_mediana: mediana(R.disegno_ms), disegno_ms_p95: p95(R.disegno_ms),
    chiamata_ms_mediana: mediana(R.chiamata_ms || []),
    gap_callback_mediana: mediana(R.callback_gap_ms), coda_max: R.coda_max,
    formato: R.formato, errori: R.errori.slice(0, 5) };
  console.log("ESITO " + JSON.stringify(window.ESITO));
  document.title = "FATTO";
})();
</script>
