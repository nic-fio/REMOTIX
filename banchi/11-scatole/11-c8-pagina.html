<title>REMOTIX — C8</title>
<!--
  ⭐ THE PAGE THAT C8 ASKS THE BROWSER TO DRAW.

  ⛔ It is not just any page, and it is made this way for one reason only: it must be
     RECOGNISABLE IN THE PIXELS without knowing what the desktop underneath looks like.

  · the background is `#FF00FF`, a colour that ⛔ **no desktop puts up on its own**: not GNOME,
    not Plasma, not labwc.  ⇒ If a wide slice of the screen turns that colour, the
    browser has drawn — and there is no need to know anything else.
  · the black text is there ON PURPOSE: ⚠ a page all of one colour would be «solid
    colour», i.e. exactly the verdict the image judge uses to say
    «degenerate».  ⛔ A target the judge would discard is not a target.
  · and the colour tolerance is declared by the bench, not by this page: compositors
    apply profiles and rescaling, and a `#FF00FF` can come back slightly
    different (`fasi/11…` §4.3, Gemini's finding, accepted).
-->
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#FF00FF; }
  body { display:flex; align-items:center; justify-content:center;
         font-family: monospace; color:#000; }
  h1 { font-size: 6vw; letter-spacing: 0.1em; }
</style>
