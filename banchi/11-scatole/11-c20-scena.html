<meta charset="utf-8">
<title>REMOTIX — C20</title>
<!--
  ⭐⭐ C20'S DECLARED SCENE: **it moves, and its light does NOT change.**

  ⛔⛔ WHY A NEW ONE IS NEEDED, and C3's was not enough — 23 Sep 2026.

  C20 asks: *«after «Log out» and a new login, the screen does not flicker»*, and
  judges it on the MEAN LUMINANCE of the frames: on a healthy screen it is one only,
  with the ghost it alternates between distant values.  ⇒ C3's scene cannot serve:
  it changes the background between blue and yellow ON PURPOSE, that is it flickers — ⛔ it is
  C20's INJECTED FAULT, not its healthy run.

  ⚠ And the still desktop cannot serve either.  `[M]` 23 September 2026,
  second login, same mesh, same binary:

    | box | compositor | frames delivered |
    |---|---|---|
    | **kde**  | KWin   | **1 800 in 45 s** — delivers even with a still desktop |
    | **xfce** | labwc  | ⛔ **7 in 60 s** — wlroots delivers only on DAMAGE  |

  ⇒ On xfce (and on lxqt, which uses the same labwc) a still desktop does not give
    enough frames to have a tail to look at: the mesh exited
    **3 for ever**, ⛔ which is the cousin of the perpetual red (§1.49).

  ⭐⭐ THE CURE IS THE SAME AS C3'S: **the mesh puts the scene there, and
      declares it** — but here it must move WITHOUT changing the light.

  ---------------------------------------------------------------------------
  WHAT MOVES, and why the light stays still
  ---------------------------------------------------------------------------

  A **dark band slides** over a light background, and advances by 3 % of the screen
  at every animation frame.  ⇒ Every frame is different from the previous one
  (there is damage, so the compositor delivers), ⭐ but the pixel histogram
  never changes: the same amount of dark and the same amount of light,
  only moved.  ⇒ **The mean luminance is a constant.**

  ⛔⛔ AND THE BANDS ARE TWO, and this is the part that goes wrong.
     With ONE band only, when it reaches the edge it leaves the screen: at `left:
     90%` only half of it is visible, ⇒ the light background gains 10 % of the
     screen and ⛔ **the mean luminance rises** — a periodic jump on a perfectly
     healthy scene, that is a false red at every turn of the band.
     ⭐ The second band always stays 100 percentage points further left:
     what leaves on the right comes back in on the left at the same instant, and the
     amount of dark in view is **exactly 20 %** always.

  ⚠ The 3 % is the same step as `11-c3-scena.html`, and for the same reason
    written there: with 4 % the scene would come back to the starting point every 25
    animation frames, and two frames captured at that distance
    would be identical on a perfectly healthy scene.

  ---------------------------------------------------------------------------
  ⛔ And the three rules of the page, as for `11-c2-finestra.html` and
     `11-c3-scena.html`:
     · no external resource: the box has no network to the outside;
     · no text that moves by itself (the time, a counter): the
       movement must be THE DECLARED ONE and no other;
     · `requestAnimationFrame` and not a `setInterval`: we draw when the
       compositor is ready to receive.

  ⭐ THE LIGHT THIS PAGE PRODUCES, declared: background `#C0C0C0` (BT.601
     luminance ≈ 192) for 80 % of the screen, bands `#101010` (≈ 16) for
     20 % ⇒ expected mean ≈ **157**.  `[M]` 23 Sep 2026, kde, second login:
     **156**, and ⭐ **a single distinct value over 2 166 frames** — that is the
     scene does what it declares.  ⚠ The bench does not demand that number —
     the desktop's panels and borders eat a bit of it — ⛔ but it demands that the
     screen **is not black**: if the median stays below 40, the scene did not
     arrive and the mesh says «I could not look» instead of giving away a
     green to a screen that is off.
-->
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body { background:#C0C0C0; }
  .banda { position:absolute; top:0; bottom:0; width:20%; background:#101010; }
  #targa { position:absolute; left:0; right:0; top:45%;
           text-align:center; font-family:monospace; font-size:4vw;
           color:#606060; }
</style>
<div class="banda" id="a"></div>
<div class="banda" id="b"></div>
<div id="targa">REMOTIX C20</div>
<script>
  // ⛔ TWO bands, and the second chases the first at 100 points distance: what
  //    leaves on the right comes back in on the left at the same instant.  ⇒ In view
  //    there is ALWAYS 20 % of dark, and the mean luminance does not move.
  var a = document.getElementById('a');
  var b = document.getElementById('b');
  var x = 0;
  function giro() {
    x = (x + 3) % 100;
    a.style.left = x + '%';
    b.style.left = (x - 100) + '%';
    requestAnimationFrame(giro);
  }
  requestAnimationFrame(giro);
</script>
