<!doctype html>
<meta charset="utf-8">
<title>REMOTIX — C3</title>
<!--
  ⭐⭐ THE DECLARED, MOVING SCENE that C3 puts on the screen.

  ⛔ «Declared» means: **it is this file that decides what moves and by
     how much**, not the semantics of someone else's generator.  It is the same
     rule C5 gave itself for the sound wave (`11-c5…`, §«WHERE THE
     SOUND COMES FROM»): `[M]` a probe that made the wave with `ffmpeg -f lavfi -i sine=…`
     measured *«the path attenuates by 21 dB»*, ⛔ and it was the GENERATOR attenuating.
     ⇒ A quantity that depends on someone else's program is a threshold that moves
       without saying so.

  ---------------------------------------------------------------------------
  WHAT MOVES, and why two things and not one
  ---------------------------------------------------------------------------

  1. ⭐ **THE BACKGROUND CHANGES COLOUR** between `#0000FF` (blue) and `#FFFF00` (yellow) every
     3 animation frames.  ⛔ The two colours are at opposite ends on all
     three channels: after an H.264 encoding in 4:2:0 — which subsamples the chroma —
     they stay distinguishable with a wide tolerance.  ⚠ And they also serve C3 to
     answer the question *«is the scene I declared really the one on the
     screen?»*: if neither of the two colours covers a wide slice, C3 says «I could not
     look» instead of judging a scene that is not its own.

  2. ⭐⭐ **A BAND SCROLLS**, and ⛔ this is the part that matters most.
     The background changes every 3 frames: between the cadence of the animation and that
     of the capture, two consecutive frames could land on the same
     colour — ⇒ and then they would look identical **without anything being broken**,
     i.e. a false red.  The band instead moves at **every** frame:
     ⭐ with it, two consecutive frames must ALWAYS differ.
     ⚠ The band is 20 % of the screen wide and advances by **3 %** per frame
       ⇒ it changes ~6 % of the pixels, i.e. six times the threshold C3 uses to say
       «these two frames are different» (1 %).  The margin is declared
       on purpose: a scene that passes the threshold by a hair proves nothing.

  ⛔⛔ AND THE «3 %» IS NOT JUST ANY NUMBER — it is chosen so as NOT to be periodic.
     If the band advanced by 4 %, it would return to its starting point every 25
     animation frames: ⇒ two frames CAPTURED 25 (or 50, or 75)
     frames apart would be **identical on a perfectly healthy scene**, and C3
     would say «frozen image» on a product that works.  ⚠ With 25
     animation frames between one capture and the next the rate would be
     60/25 = 2.4 per second — below the floor C3 demands (4.0/s), but
     **a single step** away from it.
     ⭐ With 3 % the period becomes 100 animation frames, i.e. a
       rate of 0.6 per second: ⇒ the case is four times away from the
       floor instead of close to it, and whoever lowered `--ritmo-minimo` tomorrow
       would have much more margin before opening that door.

  ---------------------------------------------------------------------------
  ⛔ And the three rules of the page, as for `11-c2-finestra.html`:
     · no external resource: the box has no network to the outside, and a page
       waiting for something that never arrives would give a red that is not the
       product's;
     · no text that moves by itself (the time, a seconds counter):
       the movement must be THE DECLARED ONE and no other;
     · `requestAnimationFrame` and not a `setInterval`: we draw when the
       compositor is ready to receive, which is the only cadence that makes sense here.
-->
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body { background:#0000FF; }
  #banda { position:absolute; top:0; bottom:0; width:20%; background:#000;
           opacity:0.85; }
  #targa { position:absolute; left:0; right:0; top:45%;
           text-align:center; font-family:monospace; font-size:5vw;
           color:#000; }
</style>
<div id="banda"></div>
<div id="targa">REMOTIX C3</div>
<script>
  // ⭐ The two colours are DECLARED here and repeated in the bench: if someone
  //    changes one here and not there, C3 will say «the scene I declared is not
  //    on the screen» ⇒ ⛔ «I could not look», not a red for the product.
  var COLORI = ['#0000FF', '#FFFF00'];
  var n = 0, x = 0;
  var banda = document.getElementById('banda');
  function giro() {
    // the background changes every 3 frames
    if (n % 3 === 0) document.body.style.background = COLORI[(n / 3 | 0) % 2];
    // the band advances by 3 % at EVERY frame, and re-enters from the other side.
    // ⛔ 3 and not 4: see the box at the top — with 4 the scene would be periodic
    //    every 25 frames, and at a rate of 2.4/s C3 would see two identical
    //    frames on a perfectly healthy scene.
    x = (x + 3) % 100;
    banda.style.left = x + '%';
    n++;
    requestAnimationFrame(giro);
  }
  requestAnimationFrame(giro);
</script>
