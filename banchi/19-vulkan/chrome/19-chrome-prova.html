<!doctype html><meta charset="utf-8"><title>hevc test</title><body>
<canvas id="c" width="480" height="270"></canvas><pre id="o"></pre>
<script>
const q = new URLSearchParams(location.search);
const FILE = q.get("f"), CODEC = q.get("codec") || "hev1.1.6.L153.B0";
const HW = q.get("hw") || "no-preference", L = +(q.get("l")||3840), A = +(q.get("a")||2160);
const out = { file: FILE, codec: CODEC, hw: HW, frames: [], errori: [] };
function nals(b) {
  const p = []; let i = 0;
  while (i + 3 < b.length) {
    if (b[i]==0 && b[i+1]==0 && (b[i+2]==1 || (b[i+2]==0 && b[i+3]==1))) {
      const sc = b[i+2]==1 ? 3 : 4; p.push([i, i+sc]); i += sc;
    } else i++;
  }
  return p.map((x, k) => ({ s: x[0], h: x[1], e: k+1 < p.length ? p[k+1][0] : b.length }));
}
function aus(b) {
  const n = nals(b), r = []; let cur = null, vcl = false;
  for (const x of n) {
    const t = (b[x.h] >> 1) & 63; const isv = t < 32;
    const first = isv ? (b[x.h+2] & 0x80) : 0;
    const apre = (!isv && (t==32||t==33||t==34||t==35||t==39)) || (isv && first);
    if (!cur || (apre && vcl)) {
      if (cur) r.push(cur); cur = { s: x.s, e: x.e, key: false }; vcl = false;
    }
    cur.e = x.e; if (isv) { vcl = true; if (t >= 16 && t <= 21) cur.key = true; }
  }
  if (cur) r.push(cur); return r;
}
async function va() {
  const b = new Uint8Array(await (await fetch(FILE)).arrayBuffer());
  const u = aus(b); out.aus = u.length; out.chiavi = u.filter(x=>x.key).length;
  const cv = document.getElementById("c"), g = cv.getContext("2d", { willReadFrequently: true });
  let fatti = 0;
  const dec = new VideoDecoder({
    output: (f) => {
      const info = { fmt: f.format, cw: f.codedWidth, ch: f.codedHeight, dw: f.displayWidth, dh: f.displayHeight,
                     cs: JSON.stringify(f.colorSpace) };
      g.drawImage(f, 0, 0, cv.width, cv.height); f.close();
      const d = g.getImageData(0, 0, cv.width, cv.height).data, m = new Map();
      for (let i = 0; i < d.length; i += 4*7) { const k = d[i]+","+d[i+1]+","+d[i+2]; m.set(k, (m.get(k)||0)+1); }
      let best = null, bn = 0, tot = 0; for (const [k, v] of m) { tot += v; if (v > bn) { bn = v; best = k; } }
      info.dom = best; info.quota = +(100*bn/tot).toFixed(1); out.frames.push(info); fatti++;
    },
    error: (e) => out.errori.push(String(e)),
  });
  const cfg = { codec: CODEC, codedWidth: L, codedHeight: A, optimizeForLatency: true };
  if (HW != "no-preference") cfg.hardwareAcceleration = HW;
  try { out.supporto = (await VideoDecoder.isConfigSupported(cfg)).supported; } catch (e) { out.supporto = String(e); }
  try { dec.configure(cfg); } catch (e) { out.errori.push("configure " + e); }
  for (let k = 0; k < u.length && dec.state != "closed"; k++) {
    dec.decode(new EncodedVideoChunk({ type: u[k].key ? "key" : "delta", timestamp: k*16666, data: b.subarray(u[k].s, u[k].e) }));
    await new Promise(r => setTimeout(r, 16));
  }
  try { await dec.flush(); } catch (e) { out.errori.push("flush " + e); }
  out.decodificati = fatti;
  await fetch("/esito", { method: "POST", body: JSON.stringify(out) });
  document.getElementById("o").textContent = "FATTO";
}
va().catch(e => fetch("/esito", { method: "POST", body: JSON.stringify({ file: FILE, eccezione: String(e) }) }));
</script>
