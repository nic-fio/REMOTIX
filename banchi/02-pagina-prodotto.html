<!--
=============================================================================
⛔ PERCHE' QUESTA PAGINA ESISTE ACCANTO A `02-pagina-prova.html`

`02-pagina-prova.html` misura **il browser**: sa il browser decodificare HEVC e
portarlo fino al pixel?  E' la domanda di F2.5, ed e' stata risposta.

⛔ Questa misura **il prodotto**: la pagina che l'utente apre — `src/pagina.html`
— riceve un fotogramma di RCP, lo decodifica e lo dipinge?  Sono due domande
diverse, e una pagina di prova che decodifica per conto suo **non risponde alla
seconda**: sarebbe la forma **E10**, una prova verde su un client che non e'
quello che l'utente usa.

⇒ Qui il prodotto sta in un `<iframe>` della **stessa origine**, e questa pagina
  guida `REMOTIX.schermo` — cioe' l'oggetto vero — e rilegge i pixel dalla **sua**
  tela.  ⛔ Nessuna riga della catena video del prodotto e' ricopiata qui dentro.

=============================================================================
⛔ E QUEL CHE QUESTA PAGINA NON PRENDE DAL PRODOTTO: IL GIUDIZIO

Il lettore dei 28 byte di `RCP.md` §6.2 esiste **due volte**, e deve continuare
a esistere due volte:

  · nel prodotto  — `Schermo.leggi_intestazione`, scritto dalla tabella di §6.2;
  · qui           — `intestazione()`, che li **scrive**, dalla stessa tabella.

⭐ Sono due implementazioni indipendenti, ed e' il pezzo di arbitro che
   `PIANO.md` §0.4 dice di aver comprato.  ⛔ Se questa pagina ricopiasse il
   lettore del prodotto, i due lettori tornerebbero a essere uno e un
   fraintendimento della specifica passerebbe due volte senza che nessuno lo
   veda.  ⚠ E c'e' un TERZO scrittore, quello Python di
   `02-pagina-sequenze.py` (`intestazione_rcp`): la riga `INTESTAZIONE` del
   registro confronta i byte che scrive questa pagina con i suoi, ed e' li' che
   un disaccordo verrebbe fuori.

=============================================================================
⚠ LA SCENA, E VA LETTA PRIMA DEI NUMERI

La scena viaggia nell'indirizzo (`?scena=`) e finisce in **ogni riga** del
registro.  ⛔ Su schermo finto (Xvfb) Chrome non ha GPU, e su Linux il
decodificatore HEVC di Chrome e' quello della PIATTAFORMA (VA-API): `[M]` 12
agosto 2026, su Xvfb **ogni stringa HEVC e' rifiutata**.  ⇒ Un `HEVC=non-arriva`
su schermo finto **non e' un difetto del prodotto**: e' la scena.  AV1, che e'
il ripiego negoziato (`DECISIONI.md` §1.13), arriva al pixel su tutt'e due i
motori **anche senza GPU**, ed e' li' che questo banco vede la catena intera.

=============================================================================
⛔ I CONTROLLI, e senza di loro nessun numero di qui vale

  P1  il lettore trova 8/8 su celle dipinte a mano SULLA TELA DEL PRODOTTO
  P2  su una tela grigia piatta NON trova 8/8
  P3  i pixel di un pattern non si classificano anche sull'altro
  P4  ⭐ VP9 arriva al pixel — decodificato QUI, non dal prodotto: `RCP.md` §4.3
      non ha VP9, quindi il prodotto non puo' e non deve saperlo fare.  P4
      risponde a «questo MOTORE e questa TELA portano un video fino ai pixel?»,
      che e' la domanda che rende leggibile un «no» su HEVC
  P5  l'immagine dipinta e' piu' vicina al pattern CHIESTO che all'altro
  P6  ogni sequenza che non dipinge DICE PERCHE'
  P9  ⭐ il controllo positivo DEL PERCORSO DEL PRODOTTO: AV1 attraverso
      `REMOTIX.schermo`.  ⛔ Senza, «HEVC non arriva» e «la catena del prodotto
      non funziona» avrebbero lo stesso aspetto — e' P4 un piano piu' in su

⛔ GUASTI INNESTABILI (`?guasta=`), perche' chi scrive un banco lo certifica
   nello stesso giro:
     lettore   il classificatore risponde sempre «la tinta attesa»  ⇒ P2, P3
     scambio   al prodotto vanno i byte del pattern OPPOSTO         ⇒ P5
     muto      i testi degli errori si buttano                      ⇒ P6
     pixel     la tela si copre di grigio DOPO la decodifica e prima della
               rilettura                                            ⇒ P4, P9
               ⭐ e P1, P2 restano VERDI: il rosso e' del percorso video, non
                 del lettore
=============================================================================
-->
<h1>F2.5-prodotto — <code>src/pagina.html</code> sotto misura</h1>
<div id="stato">in corso…</div>
<iframe id="prodotto" src="/prodotto/pagina.html"></iframe>
<div id="registro"></div>
<script>
"use strict";

const PARAMETRI = new URLSearchParams(location.search);
const GIRO = PARAMETRI.get("giro") || "f25p-" + Math.random().toString(36).slice(2, 10);
const GUASTO = PARAMETRI.get("guasta") || "";
const SCENA = PARAMETRI.get("scena") || "non dichiarata";

/* Le sequenze che si danno al PRODOTTO.  ⛔ Niente `*-hvcc`: il prodotto manda
   Annex-B senza `description` per decisione (`fasi/02-primo-fotogramma.md` D1),
   e dargli byte hvcC misurerebbe una forma che sul filo non esiste.  ⛔ Niente
   `*-lossless-*`: quelle sono il caso di banco sui 10 bit veri di F2.5, non la
   catena. */
const SEQUENZE = [
  { file: "A-8bit-annexb",     codec: "hevc", profondita: 8,  contro: "B-8bit-annexb" },
  { file: "B-8bit-annexb",     codec: "hevc", profondita: 8,  contro: "A-8bit-annexb" },
  { file: "A-10bit-annexb",    codec: "hevc", profondita: 10, contro: "B-10bit-annexb" },
  { file: "B-10bit-annexb",    codec: "hevc", profondita: 10, contro: "A-10bit-annexb" },
  { file: "A-10bitvero-annexb", codec: "hevc", profondita: 10, contro: "B-10bit-annexb" },
  { file: "A-av1-8bit",        codec: "av1",  profondita: 8,  contro: "B-av1-8bit" },
  { file: "B-av1-8bit",        codec: "av1",  profondita: 8,  contro: "A-av1-8bit" },
  { file: "A-av1-10bitvero",   codec: "av1",  profondita: 10, contro: "B-av1-8bit" },
];
const CODEC_RCP = { hevc: 1, av1: 2 };

let numero_riga = 0;
const riassunto = { prove: 0 };

function scrivi(testo, classe) {
  const r = document.getElementById("registro");
  const d = document.createElement("div");
  if (classe) d.className = classe;
  d.textContent = testo;
  r.appendChild(d);
  r.scrollTop = r.scrollHeight;
}

/* ⛔ Si ASPETTA la conferma del raccoglitore, e niente parte da dentro
   `pagehide`: li' il tracciatore e' cieco su Chrome (`fasi/01-filo-nudo.md`). */
async function spedisci(dati) {
  dati.n = ++numero_riga;
  dati.giro = GIRO;
  dati.guasto = GUASTO;
  dati.motore = navigator.userAgent;
  dati.scena = SCENA;
  dati.bersaglio = "prodotto";
  try {
    const r = await fetch("/esito", {
      method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dati) });
    if (!r.ok) scrivi("⛔ il raccoglitore ha risposto " + r.status, "no");
  } catch (e) { scrivi("⛔ l'esito non e' potuto uscire: " + e, "no"); }
}

/* ── IL LETTORE DEI PIXEL — di questa pagina, non del prodotto ───────────── */

function distanza(a, b) {
  const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
  return dr * dr + dg * dg + db * db;
}

function colore_cella(pixel, larghezza, cella) {
  const bx = Math.floor(cella.l * 0.2), by = Math.floor(cella.a * 0.2);
  let r = 0, g = 0, b = 0, n = 0;
  for (let y = cella.y + by; y < cella.y + cella.a - by; y += 3) {
    for (let x = cella.x + bx; x < cella.x + cella.l - bx; x += 3) {
      const i = (y * larghezza + x) * 4;
      r += pixel[i]; g += pixel[i + 1]; b += pixel[i + 2]; n++;
    }
  }
  return n ? [Math.round(r / n), Math.round(g / n), Math.round(b / n)] : null;
}

function classifica(colore, tinte) {
  let prima = null;
  for (const t of tinte) {
    const d = distanza(colore, t.rgb);
    if (prima === null || d < prima.d) prima = { nome: t.nome, d: d };
  }
  return prima.nome;
}

/* Legge LA TELA DEL PRODOTTO e classifica le otto celle di `g`. */
function leggi(g, celle) {
  let dati;
  try { dati = pennello().getImageData(0, 0, g.larghezza, g.altezza).data; }
  catch (e) { return { errore: "getImageData: " + e, corrette: 0, celle: [] }; }
  const letture = [];
  let corrette = 0;
  for (const c of (celle || g.celle)) {
    const colore = colore_cella(dati, g.larghezza, c);
    if (colore === null) continue;
    /* ⛔ GUASTO «lettore»: il classificatore risponde sempre giusto ⇒ P2 e P3
       devono cadere.  Un classificatore che dice sempre si' passerebbe P1 e
       ogni sequenza, e il banco sarebbe verde su un difetto vivo. */
    const letta = (GUASTO === "lettore") ? c.tinta : classifica(colore, g.tinte);
    if (letta === c.tinta) corrette++;
    letture.push({ indice: c.indice, attesa: c.tinta, letta: letta,
                   rgb_letto: colore, rgb_atteso: c.rgb,
                   scarto: [colore[0] - c.rgb[0], colore[1] - c.rgb[1],
                            colore[2] - c.rgb[2]] });
  }
  return { celle: letture, corrette: corrette, errore: null };
}

/* ── IL PRODOTTO ─────────────────────────────────────────────────────────── */

let P = null;                       /* `window.REMOTIX` dell'iframe */
function tela()     { return P.schermo.tela; }
function pennello() { return P.schermo.pennello; }

function aspetta_prodotto() {
  return new Promise((risolvi, rifiuta) => {
    const f = document.getElementById("prodotto");
    const scadenza = setTimeout(() => rifiuta(new Error(
      "la pagina del prodotto non ha esposto REMOTIX entro 15 s")), 15000);
    (function guarda() {
      let r = null;
      try { r = f.contentWindow && f.contentWindow.REMOTIX; } catch (e) { r = null; }
      if (r && r.schermo) { clearTimeout(scadenza); risolvi(r); return; }
      setTimeout(guarda, 100);
    })();
  });
}

/* ⛔ L'INTESTAZIONE DI 28 BYTE — SCRITTA QUI, DALLA TABELLA DI `RCP.md` §6.2.
       0 u16 tipo · 2 u16 codec · 4 u32 largh. · 8 u32 altezza ·
      12 u32 numero · 16 u64 istante · 24 u32 input
   ⛔ Nessun riempimento: 28 byte esatti, e i dati cominciano all'offset 28. */
function intestazione(chiave, codec, l, a, numero, istante) {
  const b = new Uint8Array(28);
  const v = new DataView(b.buffer);
  v.setUint16(0, chiave ? 0x0301 : 0x0302);
  v.setUint16(2, codec);
  v.setUint32(4, l);
  v.setUint32(8, a);
  v.setUint32(12, numero);
  v.setBigUint64(16, BigInt(istante));
  v.setUint32(24, 0);
  return b;
}

function byte_da_base64(b64) {
  const s = atob(b64);
  const d = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) d[i] = s.charCodeAt(i);
  return d;
}

function unisci(a, b) {
  const u = new Uint8Array(a.length + b.length);
  u.set(a); u.set(b, a.length);
  return u;
}

const seq = {};
async function carica(nome) {
  if (seq[nome]) return seq[nome];
  const r = await fetch("02-pagina-sequenze/" + nome + ".json", { cache: "no-store" });
  if (!r.ok) throw new Error(nome + ".json: HTTP " + r.status);
  seq[nome] = await r.json();
  return seq[nome];
}

/* Aspetta che la coda del decodificatore del PRODOTTO si sia svuotata e che i
   fotogrammi abbiano smesso di uscire.  ⛔ Niente `flush()`: WebCodecs pretende
   una chiave dopo un `flush()`, e in una sessione vera il flush non c'e'. */
async function attendi(tetto) {
  const t0 = performance.now();
  let ultimo = -1, fermo = 0;
  while (performance.now() - t0 < (tetto || 3000)) {
    await new Promise((r) => setTimeout(r, 40));
    let coda = 0;
    try { coda = P.schermo.dec ? P.schermo.dec.decodeQueueSize : 0; } catch (e) { coda = 0; }
    const d = P.schermo.conti.dipinti;
    if (d !== ultimo) { ultimo = d; fermo = 0; } else fermo += 40;
    if (coda === 0 && fermo >= 240) break;
  }
  return Math.round(performance.now() - t0);
}

async function spedisci_png(nome) {
  let url;
  try { url = tela().toDataURL("image/png"); }
  catch (e) { scrivi("⛔ toDataURL: " + e, "no"); return null; }
  const nomefile = GIRO + "-" + nome + ".png";
  try {
    const r = await fetch("/pixel?nome=" + encodeURIComponent(nomefile),
                          { method: "POST", cache: "no-store", body: url });
    if (!r.ok) { scrivi("⛔ /pixel ha risposto " + r.status, "no"); return null; }
  } catch (e) { scrivi("⛔ il PNG non e' uscito: " + e, "no"); return null; }
  return nomefile;
}

/* ── UNA SEQUENZA, ATTRAVERSO IL PRODOTTO ────────────────────────────────── */

const disaccordi = { pezzi: 0, discordi: 0, senza_intestazione: 0,
                     senza_scrittore_python: 0, righe: [] };

async function prova(voce) {
  const g = await carica(voce.file);
  /* ⛔ GUASTO «scambio»: al decodificatore vanno i byte del pattern OPPOSTO
     mentre il banco dichiara di aver chiesto questo.  ⇒ P5 deve cadere. */
  const da_dare = (GUASTO === "scambio" && voce.contro) ? await carica(voce.contro) : g;

  P.schermo.riparti();
  /* ⛔ La stringa di codec e' QUELLA CHE LA SONDA DEL PRODOTTO HA SCELTO — cioe'
     quel che il prodotto userebbe davvero.  ⚠ Se la sonda non ha dipinto, si usa
     la prima stringa che il prodotto comporrebbe: cosi' `configure()` viene
     chiamata comunque e l'errore vero finisce nel registro, invece di un buco. */
  const sondato = (P.sondato.codec[voce.codec] || {})[voce.profondita] || {};
  const stringa = sondato.stringa ||
    P.stringhe_codec(voce.codec, voce.profondita, "5.1")[0];
  P.schermo.negozia(CODEC_RCP[voce.codec], voce.profondita, stringa,
                    g.larghezza, g.altezza);
  /* La vista uguale alla tela: cosi' il fotogramma riempie la tela 1:1 e le
     coordinate delle celle valgono senza riscalature.  ⚠ La riscalatura del
     prodotto la misura `02-pagina-tela-prodotto.html`, dove serve. */
  P.schermo.vista(g.larghezza, g.altezza);
  /* ⛔⭐ LA TELA SI PULISCE PRIMA, E QUESTA RIGA E' NATA DA UN DIFETTO DI QUESTO
   *     BANCO, trovato al PRIMO GIRO — 12 agosto 2026.
   *
   * Senza, `A-8bit-annexb` — che su schermo finto non dipinge NIENTE, perche'
   * Chrome li' non ha HEVC — usciva con **8 celle su 8**: la tela portava ancora
   * l'immagine del controllo di prima, e il lettore la classificava
   * correttamente.  ⛔ «Ha dipinto» e «la tela era rimasta come prima» avevano
   * lo stesso aspetto: la forma E8, dentro il banco.
   *
   * ⚠ E si riempie di MAGENTA, che non e' nessuna delle otto tinte e non e'
   *   nero: cosi' «non ha dipinto niente» ha un aspetto suo anche nel PNG. */
  pennello().fillStyle = "#7a007a";
  pennello().fillRect(0, 0, tela().width, tela().height);

  let numero = 1;
  for (const p of da_dare.pezzi) {
    const testa = intestazione(p.tipo === "key", CODEC_RCP[voce.codec],
                               g.larghezza, g.altezza, numero, p.istante || 0);
    /* ⭐ Il confronto fra i DUE scrittori dei 28 byte: questo (JavaScript) e
       quello di `02-pagina-sequenze.py` (Python).  ⛔ Un disaccordo qui non e'
       un difetto del banco: e' un fraintendimento della specifica trovato da
       due letture separate. */
    if (p.intestazione_rcp) {
      disaccordi.pezzi++;
      const suo = byte_da_base64(p.intestazione_rcp);
      const guai = [];
      /* ⚠ Si confrontano i campi che i due scrittori decidono allo stesso modo:
         `numero` e `istante` li sceglie chi spedisce, e qui li scelgo io. */
      if (suo.length !== 28) guai.push("il suo e' lungo " + suo.length);
      else {
        const a = new DataView(suo.buffer, suo.byteOffset, 28);
        const b = new DataView(testa.buffer);
        if (a.getUint16(0) !== b.getUint16(0)) guai.push("tipo");
        if (a.getUint16(2) !== b.getUint16(2)) guai.push("codec");
        if (a.getUint32(4) !== b.getUint32(4)) guai.push("larghezza");
        if (a.getUint32(8) !== b.getUint32(8)) guai.push("altezza");
      }
      if (guai.length) {
        disaccordi.discordi++;
        disaccordi.righe.push({ pezzo: voce.file + "#" + numero, guai: guai });
      }
    } else {
      /* ⚠ NON e' un disaccordo: `02-pagina-sequenze.py` scrive i 28 byte per le
         sequenze HEVC e non per quelle AV1 — quelle nascono da un IVF spogliato.
         ⛔ Va contato a parte, o «non c'era niente da confrontare» e «i due
         scrittori non vanno d'accordo» finirebbero nella stessa colonna. */
      disaccordi.senza_scrittore_python++;
    }
    P.schermo.stream_video(unisci(testa, byte_da_base64(p.dati)), true);
    numero++;
  }
  const ms = await attendi();

  /* ⛔ GUASTO «pixel»: la tela si copre di grigio DOPO la decodifica e prima
     della rilettura ⇒ P4 e P9 devono cadere, e P1/P2 restano verdi. */
  if (GUASTO === "pixel") {
    pennello().fillStyle = "#808080";
    pennello().fillRect(0, 0, tela().width, tela().height);
  }

  const l = leggi(g);
  const contro = await carica(voce.contro);
  /* Le celle dell'ALTRO pattern, lette sulla stessa immagine: e' P5. */
  const l_contro = leggi(g, contro.celle);
  const errori = (GUASTO === "muto") ? [] : P.schermo.errori.slice(0, 4);
  const png = P.schermo.conti.dipinti > 0 ? await spedisci_png(voce.file) : null;

  const riga = {
    tipo: "SEQUENZA", prova: voce.file,
    codec_chiesto: stringa, con_descrizione: false,
    codec_rcp: voce.codec, profondita: voce.profondita,
    api_dichiarata: { supported: sondato.api && sondato.api.length
                                 ? sondato.api[0].isConfigSupported : null },
    /* I DENOMINATORI: senza, «zero» non si distingue da «sono fallito». */
    pezzi_attesi: da_dare.pezzi.length,
    pezzi_dati: P.schermo.conti.consegnati,
    fotogrammi_usciti: P.schermo.conti.dipinti,
    disegni: P.schermo.conti.dipinti,
    celle_attese: g.celle.length, celle_giuste: l.corrette,
    contro_pattern: { pattern: contro.pattern, corrette: l_contro.corrette },
    letture: l.celle,
    errore_configure: (GUASTO === "muto") ? null
      : (errori.find((e) => e.indexOf("configure") === 0) || null),
    errori_decode: errori,
    conti_del_prodotto: JSON.parse(JSON.stringify(P.schermo.conti)),
    profondita_fotogramma: { formato: P.schermo.formato },
    sonda_del_prodotto: { arriva: !!sondato.arriva, stringa: sondato.stringa || null,
                          perche: sondato.perche || null, formato: sondato.formato || null },
    png: png, ms: ms,
    esito: P.schermo.conti.dipinti === 0 ? "NIENTE"
         : (l.corrette === g.celle.length ? "PIXEL-GIUSTI" : "pixel-sbagliati"),
  };
  await spedisci(riga);
  scrivi(voce.file.padEnd(22) + " → " + riga.esito.padEnd(15)
       + " celle " + l.corrette + "/" + g.celle.length
       + " · contro " + l_contro.corrette + "/" + contro.celle.length
       + " · dipinti " + P.schermo.conti.dipinti + "/" + da_dare.pezzi.length
       + " · «" + stringa + "»"
       + (errori.length ? "  ⛔ " + errori.join(" | ") : ""),
       riga.esito === "PIXEL-GIUSTI" ? "si" : "boh");
  riassunto.prove++;
}

/* ── I CONTROLLI ─────────────────────────────────────────────────────────── */

async function controlli_lettore(g) {
  /* ⛔ Si dipinge SULLA TELA DEL PRODOTTO: il lettore che P1 certifica deve
     essere lo stesso che legge le sequenze, sulla stessa tela. */
  P.schermo.vista(g.larghezza, g.altezza);
  const p = pennello();
  for (const c of g.celle) {
    p.fillStyle = "rgb(" + c.rgb.join(",") + ")";
    p.fillRect(c.x, c.y, c.l, c.a);
  }
  const l1 = leggi(g);
  await spedisci({ tipo: "CONTROLLO", prova: "P1-lettore-si",
                   corrette: l1.corrette, attese: g.celle.length,
                   errore: l1.errore });
  scrivi("P1 il lettore dice SI': " + l1.corrette + "/" + g.celle.length,
         l1.corrette === g.celle.length ? "si" : "no");

  p.fillStyle = "#808080";
  p.fillRect(0, 0, tela().width, tela().height);
  const l2 = leggi(g);
  await spedisci({ tipo: "CONTROLLO", prova: "P2-lettore-no",
                   corrette: l2.corrette, attese: g.celle.length });
  scrivi("P2 il lettore dice NO:   " + l2.corrette + "/" + g.celle.length,
         l2.corrette < g.celle.length ? "si" : "no");
}

/* ⛔⭐ P4 — VP9, E LO DECODIFICA QUESTA PAGINA, NON IL PRODOTTO.
 *
 * `RCP.md` §4.3 porta VP9 come l'esempio canonico di valore che
 * un'implementazione RCP/1 deve IGNORARE: il prodotto non lo sa fare **per
 * decisione**, e chiedergli di farlo misurerebbe una cosa che non esiste.
 *
 * ⇒ P4 risponde a un'altra domanda, ed e' quella che rende leggibile un «no»:
 *   *questo motore, su questa scena, porta un video fino ai pixel di questa
 *   tela?*  Se P4 e' verde e HEVC e' a zero, il «no» e' di HEVC.  Se cadono
 *   tutt'e due, il «no» e' della scena o del banco, e su HEVC non si scrive
 *   niente.  ⭐ E si dipinge sulla TELA DEL PRODOTTO, cosi' anche la tela e la
 *   rilettura sono quelle vere.
 */
async function controllo_vp9() {
  const g = await carica("A-vp9");
  P.schermo.riparti();
  P.schermo.vista(g.larghezza, g.altezza);
  const p = pennello();
  p.fillStyle = "#7a007a";
  p.fillRect(0, 0, tela().width, tela().height);
  const conto = { fotogrammi: 0, disegni: 0, errori: [], configure: null };
  let dec = null;
  try {
    dec = new VideoDecoder({
      output: (f) => { conto.fotogrammi++;
                       try { p.drawImage(f, 0, 0); conto.disegni++; }
                       catch (e) { conto.errori.push("drawImage: " + e); }
                       try { f.close(); } catch (e) { /* gia' chiuso */ } },
      error: (e) => conto.errori.push(String(e)) });
    dec.configure({ codec: g.codec, codedWidth: g.larghezza,
                    codedHeight: g.altezza, optimizeForLatency: true });
    for (const pz of g.pezzi)
      dec.decode(new EncodedVideoChunk({ type: pz.tipo, timestamp: pz.istante,
                                         data: byte_da_base64(pz.dati) }));
  } catch (e) { conto.configure = String(e); }
  const t0 = performance.now();
  while (performance.now() - t0 < 3000) {
    await new Promise((r) => setTimeout(r, 40));
    let coda = 0;
    try { coda = dec ? dec.decodeQueueSize : 0; } catch (e) { coda = 0; }
    if (coda === 0 && conto.fotogrammi > 0) break;
    if (conto.configure || conto.errori.length) break;
  }
  if (GUASTO === "pixel") { p.fillStyle = "#808080"; p.fillRect(0, 0, tela().width, tela().height); }
  const l = leggi(g);
  try { if (dec && dec.state !== "closed") dec.close(); } catch (e) { /* gia' chiusa */ }
  const errori = (GUASTO === "muto") ? [] : conto.errori;
  await spedisci({ tipo: "SEQUENZA", prova: "P4-controllo-vp9",
                   via: "il decodificatore DI QUESTA PAGINA, non del prodotto",
                   codec_chiesto: g.codec, con_descrizione: false,
                   pezzi_attesi: g.pezzi.length, pezzi_dati: g.pezzi.length,
                   fotogrammi_usciti: conto.fotogrammi, disegni: conto.disegni,
                   celle_attese: g.celle.length, celle_giuste: l.corrette,
                   contro_pattern: { pattern: "-", corrette: 0 },
                   errore_configure: (GUASTO === "muto") ? null : conto.configure,
                   errori_decode: errori, letture: l.celle,
                   esito: conto.disegni === 0 ? "NIENTE"
                        : (l.corrette === g.celle.length ? "PIXEL-GIUSTI" : "pixel-sbagliati") });
  scrivi("P4 VP9 (decodificato da questa pagina): " + l.corrette + "/"
       + g.celle.length + " celle, " + conto.fotogrammi + " fotogrammi"
       + (errori.length ? "  ⛔ " + errori.join(" | ") : ""),
       l.corrette === g.celle.length ? "si" : "no");
}

/* ── Il giro ─────────────────────────────────────────────────────────────── */

async function giro() {
  P = await aspetta_prodotto();
  /* ⛔ Il sondaggio del prodotto e' una PROMESSA: si aspetta, o si leggerebbe
     `undefined` e si scriverebbe «la sonda non ha detto niente». */
  P.sondato = await P.sondaggio;

  await spedisci({ tipo: "AMBIENTE",
    webcodecs: typeof VideoDecoder !== "undefined",
    contesto_sicuro: window.isSecureContext,
    schermo: screen.width + "x" + screen.height, dpr: devicePixelRatio,
    /* ⭐ Che cosa la SONDA DEL PRODOTTO ha deciso, con le due voci separate:
       quel che ha detto l'API e quel che ha detto il pixel. */
    sonda_del_prodotto: P.sondato,
    tela_desincronizzata: false });
  scrivi("giro " + GIRO + (GUASTO ? "  ⚠ GUASTO INNESTATO: " + GUASTO : "")
       + " · scena " + SCENA);
  for (const nome of ["hevc", "av1"]) {
    for (const prof of [8, 10]) {
      const s = P.sondato.codec[nome][prof];
      scrivi("  sonda del prodotto · " + nome + " " + prof + " bit: "
           + (s.arriva ? "ARRIVA AL PIXEL con «" + s.stringa + "» (formato "
                       + s.formato + ")"
                       : "non arriva — " + s.perche),
             s.arriva ? "si" : "boh");
    }
  }

  if (typeof VideoDecoder === "undefined") {
    scrivi("⛔ questo browser non ha WebCodecs: non c'e' niente da misurare", "no");
    await spedisci({ tipo: "FINITO", esito: "SENZA_WEBCODECS", prove: 0 });
    document.getElementById("stato").textContent = "FINITO — senza WebCodecs";
    return;
  }

  const primo = await carica("A-8bit-annexb");
  await controlli_lettore(primo);
  await controllo_vp9();

  for (const voce of SEQUENZE) {
    try { await prova(voce); }
    catch (e) {
      /* ⛔ Una sequenza che manca non deve fermare la corsa: e' il difetto che
         F2.5 ha pagato il 12 agosto (il guasto `scambio` cercava un gemello che
         non c'era e le sequenze AV1 non venivano eseguite affatto). */
      scrivi("⛔ " + voce.file + ": " + e, "no");
      await spedisci({ tipo: "SEQUENZA", prova: voce.file, esito: "SEQUENZA_ASSENTE",
                       pezzi_attesi: 0, pezzi_dati: 0, fotogrammi_usciti: 0,
                       disegni: 0, celle_attese: 8, celle_giuste: 0,
                       errori_decode: [String(e)] });
    }
  }

  await spedisci({ tipo: "INTESTAZIONE", pezzi: disaccordi.pezzi,
                   discordi: disaccordi.discordi,
                   senza_intestazione: disaccordi.senza_intestazione,
                   senza_scrittore_python: disaccordi.senza_scrittore_python,
                   nota: "i pezzi AV1 non hanno un'intestazione scritta da "
                       + "02-pagina-sequenze.py (nascono da un IVF spogliato): "
                       + "non c'era niente da confrontare, e non e' un disaccordo",
                   righe: disaccordi.righe });
  scrivi("l'intestazione di RCP §6.2: " + disaccordi.pezzi + " pezzi confrontati "
       + "fra lo scrittore di questa pagina e quello di 02-pagina-sequenze.py, "
       + disaccordi.discordi + " in disaccordo · "
       + disaccordi.senza_scrittore_python + " pezzi (AV1) senza un'intestazione "
       + "da confrontare",
       disaccordi.discordi === 0 ? "si" : "no");

  await spedisci({ tipo: "FINITO", esito: "COMPLETO", prove: riassunto.prove });
  document.getElementById("stato").textContent = "FINITO — " + riassunto.prove + " prove";
  scrivi("FINITO: " + riassunto.prove + " prove.  ⛔ Il verdetto lo calcola il "
       + "banco fuori dal browser, non questa pagina.");
}

giro().catch(async (e) => {
  scrivi("⛔ il giro si e' fermato: " + e + "\n" + (e && e.stack ? e.stack : ""), "no");
  await spedisci({ tipo: "FINITO", esito: "ECCEZIONE", errore: String(e),
                   pila: e && e.stack ? String(e.stack) : null,
                   prove: riassunto.prove });
  document.getElementById("stato").textContent = "FINITO — eccezione";
});
</script>
