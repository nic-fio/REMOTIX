<!doctype html>
<meta charset="utf-8">
<title>18-a1 · Opus in the browser</title>
<script>
/*
 * 18-a1 — the REAL BROWSER decodes the packets of the new `audio.c` with the
 * PAGE's decoder (D-006: libopus 1.5.2 in WebAssembly, taken from
 * `src/pagina.html` between the two markers, not from another copy), and compares them:
 *   · with the old one (libavcodec) decoded the same way, sample by
 *     sample;
 *   · with the server's NATIVE decoding (`opus_decode_float`, `fresh.f32`).
 * The gesture and the block scheduling of `plays()` are NOT tested here:
 * they do not depend on who encodes.
 */
async function take(u) {
  const r = await fetch(u);
  if (!r.ok) throw new Error(u + " " + r.status);
  return new Uint8Array(await r.arrayBuffer());
}
async function module() {
  const s = atob(await (await fetch("wasm.b64")).text());
  const b = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  const { instance } = await WebAssembly.instantiate(b, {});
  const x = instance.exports;
  if (typeof x._initialize === "function") x._initialize();
  if (x.rx_apri() !== 0) throw new Error("rx_apri");
  return x;
}
async function decoding(pkt) {
  const x = await module();
  const outside = [];
  let packets = 0, silenced = 0, refused = 0, t = 0;
  for (let i = 0; i < pkt.length;) {
    const n = pkt[i] | (pkt[i + 1] << 8);
    i += 2;
    if (n === 0) { silenced++; continue; }
    if (n > x.rx_pacchetto_max()) { refused++; i += n; continue; }
    new Uint8Array(x.memory.buffer, x.rx_pacchetto(), n).set(pkt.subarray(i, i + n));
    i += n;
    const t0 = performance.now();
    const f = x.rx_decodifica(n);
    t += performance.now() - t0;
    if (f <= 0) { refused++; continue; }
    packets++;
    outside.push(new Float32Array(x.memory.buffer, x.rx_uscita(), f * 2).slice());
  }
  return { packets, silenced, refused, outside, ms: t };
}
(async function () {
  const outcome = { ua: navigator.userAgent };
  try {
    const v = await decoding(await take("prior.pkt"));
    const n = await decoding(await take("fresh.pkt"));
    const nat = new Float32Array((await take("fresh.f32")).buffer);
    outcome.prior = { packets: v.packets, silenced: v.silenced, refused: v.refused };
    outcome.fresh = { packets: n.packets, silenced: n.silenced, refused: n.refused,
                    ms_per_packet: n.ms / Math.max(1, n.packets) };
    let different_vn = 0, different_nat = 0, max_nat = 0, k = 0, samples = 0, e = 0;
    for (let b = 0; b < n.outside.length; b++) {
      const a = n.outside[b], c = v.outside[b];
      for (let i = 0; i < a.length; i++, k++) {
        samples++;
        if (!c || a[i] !== c[i]) different_vn++;
        const d = Math.abs(a[i] - nat[k]);
        if (d !== 0) different_nat++;
        if (d > max_nat) max_nat = d;
        e += a[i] * a[i];
      }
    }
    outcome.samples = samples;
    outcome.different_old_new = different_vn;
    outcome.different_from_native = different_nat;
    outcome.max_gap_from_native = max_nat;
    outcome.rms_dbfs = 10 * Math.log10(e / Math.max(1, samples) + 1e-20);
  } catch (err) {
    outcome.failure = String(err);
  }
  await fetch("outcome", { method: "POST", body: JSON.stringify(outcome) });
  document.title = "finished";
})();
</script>
