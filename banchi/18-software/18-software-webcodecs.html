<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>18 · WebCodecs on the fallback stream</title>
</head>
<body>
<pre id="outcome">running…</pre>
<script>
/*
 * Phase 18, V-software line: the OpenH264 (or SVT-AV1) stream given to
 * `VideoDecoder` EXACTLY as the page does: Annex B without `description`,
 * string `avc1.640033` (High 5.1, `codec_strings()` of src/pagina.html) or
 * `av01.0.13M.08`, one chunk per frame ("key"/"delta" from the bench's .csv).
 *
 *   ?flow=h264-nuova-1920x1080.h264&codec=avc1.640033&hw=prefer-software
 *
 * Writes into #outcome one JSON line: configured, outputs, errors, and the fingerprint
 * (sum of the Y bytes) of EVERY decoded frame, to compare with
 * the ffmpeg one on the same stream.
 */
const q = new URLSearchParams(location.search);
const flow = q.get("flow"), codec = q.get("codec") || "avc1.640033";
const hw = q.get("hw") || "no-preference";
const outcome = { flow, codec, hw, supported: null, outputs: 0, errors: [], fingerprints: [], l: 0, a: 0 };
const fine = () => {
  const t = JSON.stringify(outcome);
  document.getElementById("outcome").textContent = t;
  /* the bench reads the outcome from the Chrome console (`--enable-logging`) */
  console.log("F18OUTCOME " + t);
};

(async () => {
  try {
    const data_v = new Uint8Array(await (await fetch(flow)).arrayBuffer());
    const line_list = (await (await fetch(flow + ".csv")).text()).trim().split("\n").slice(1);
    const s = await VideoDecoder.isConfigSupported({ codec, hardwareAcceleration: hw });
    outcome.supported = s.supported;
    console.log("F18 supported", s.supported, data_v.length, line_list.length);
    let waits = [];
    const dec = new VideoDecoder({
      output: (f) => { if (!outcome.outputs) console.log("F18 first frame"); waits.push(fingerprint(f)); },
      error: (e) => { outcome.errors.push(String(e)); },
    });
    async function fingerprint(f) {
        const idx = Math.round(f.timestamp / 16667);
        outcome.outputs++;
        outcome.l = f.displayWidth; outcome.a = f.displayHeight;
        const buf = new Uint8Array(f.allocationSize());
        let lay;
        try { lay = await f.copyTo(buf); } finally { if (!lay) f.close(); }
        /* fingerprint: the sum of the luma, line by line (the stride is in the layout) */
        let total_sum = 0;
        const p = lay[0];
        for (let y = 0; y < f.codedHeight && y < f.displayHeight; y++)
          for (let x = 0; x < f.displayWidth; x++) total_sum += buf[p.offset + y * p.stride + x];
        outcome.fingerprints[idx] = total_sum;
        outcome.schema = f.format;
        f.close();
    }
    dec.configure({ codec, hardwareAcceleration: hw, optimizeForLatency: true });
    let at = 0;
    for (let i = 0; i < line_list.length; i++) {
      const c = line_list[i].split(",");
      const byte = +c[1], key_id = c[2] === "1";
      dec.decode(new EncodedVideoChunk({ type: key_id ? "key" : "delta", timestamp: i * 16667,
                                         data: data_v.subarray(at, at + byte) }));
      at += byte;
    }
    console.log("F18 sent", line_list.length, "queue", dec.decodeQueueSize);
    await dec.flush();
    console.log("F18 flushed, outputs", outcome.outputs);
    const r = await Promise.allSettled(waits);
    const no = r.filter((x) => x.status !== "fulfilled");
    if (no.length) outcome.errors.push("copyTo failed: " + no.length + " — " + no[0].reason);
    console.log("F18 fingerprints done", r.length - no.length);
    outcome.chunk = line_list.length;
  } catch (e) {
    outcome.errors.push("exception: " + e);
  }
  fine();
})();
</script>
</body>
</html>
