<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>S7 — which way the wheel turns</title>
<!--
  ⛔ THIS PAGE IS THE MEASURING INSTRUMENT, NOT A DEMONSTRATION.

  It runs inside the GNOME session without a screen, and nobody looks at it: what
  it does not send to the collector did not happen for anybody.

  It measures TWO things on the same click, with two different instruments:

    1. `deltaY` of the `wheel` event  — the convention the browser declares.
       ⭐ It is the same quantity the RCP CLIENT reads when the user really
       turns the wheel, so the comparison is between two uses of the SAME
       convention, not between two worlds.
    2. how much and where `scrollY` moved — what really happened.

  ⛔ Why two and not one: `deltaY` can arrive without the page moving
     (document already at the bottom), and the page can move without `wheel`
     (scrollbar, keyboard).  Taken alone, each of the two has a way of saying
     something false; together they do not.

  ⛔ AND THE PAGE IS BORN HALFWAY DOWN THE DOCUMENT, not at the top.  With
     `scrollY = 0` a click upwards moves nothing — and «it did not move» would
     look the same as «the sign is the opposite one».  It is 20 000 pixels of
     document and it always starts again from 8 000.
-->
<style>
  html, body { margin: 0; background: #101014; color: #d8d8e0;
               font: 16px/1.5 system-ui, sans-serif; }
  #alto   { height: 20000px;
            background: repeating-linear-gradient(#1a1a22 0 40px, #202029 40px 80px); }
  #banner  { position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px;
            background: #000; border-bottom: 1px solid #444; white-space: pre; }
</style>
</head>
<body>
<div id="banner">S7 — waiting</div>
<div id="alto"></div>
<script>
"use strict";

const CENTER = 8000;        // where it starts again at every round
const WAIT_READ = 250; // ms between the click and the reading of scrollY

let nr = 0;             // grows inside THIS page load
let inProgress = false;

// ⛔ THE MARK OF THE ROUND, and it is born from a real defect.
//
//    `[M]` 10 Aug 2026: the counter above starts again from 1 at every
//    load, and the bench looked for «the line with n greater than the placeholder».
//    At the second round the log already contained a line n=1, the placeholder
//    was 1, and the NEW line — also n=1 — was never found: the
//    bench printed «the page did not say PRONTA in 45 s» **while the
//    collector was writing it**.  Two different things, a single symptom.
//
//    The number alone is not enough to recognise a round: something that does
//    not repeat is needed.  This.
const ROUND = Math.random().toString(36).slice(2, 10);

function ship(data_v) {
  data_v.n = ++nr;
  data_v.lap = ROUND;
  data_v.motore = navigator.userAgent;     // ⛔ B0.6: the version, always
  data_v.display_screen = screen.width + "x" + screen.height;
  data_v.win = innerWidth + "x" + innerHeight;
  data_v.dpr = devicePixelRatio;
  navigator.sendBeacon("/outcome", new Blob([JSON.stringify(data_v)],
                                          {type: "application/json"}));
  banner(data_v);
}

function banner(data_v) {
  document.getElementById("banner").textContent =
    "S7 n." + data_v.n + "  " + data_v.kind +
    "  deltaY=" + data_v.deltaY + "  scroll=" + data_v.scroll;
}

// ⛔ The `wheel` is listened to in capture and WITHOUT preventDefault: one wants
//    the scrolling to really happen, because it is the second instrument.
// ⛔ THE REFERENCE IS `base`, NOT `scrollY` READ IN THE HANDLER.
//
//    `[M]` 10 Aug 2026: with a passive listener Firefox scrolls **before**
//    the handler runs (the compositor thread does it, not the JavaScript
//    one).  Reading `scrollY` inside the handler and again 250 ms
//    later, the two values are equal and the difference is **zero**: the bench
//    wrote «the page did not move» while it had moved by 114 pixels, and
//    the right number was already in the log under another name.
//
//    The right reference is where the page was BEFORE the click, that is
//    the last recentred position — which the page knows because it is the one
//    putting it there.  This way the measurement holds both where scrolling is
//    asynchronous and where it is not.
let base = CENTER;

addEventListener("wheel", (e) => {
  if (inProgress) return;      // one click at a time: the rounds do not mix
  inProgress = true;
  const before = Math.round(scrollY);
  setTimeout(() => {
    const after = Math.round(scrollY);
    ship({
      kind: "SCATTO",
      deltaY: e.deltaY, deltaX: e.deltaX, deltaMode: e.deltaMode,
      wheelDeltaY: e.wheelDeltaY,
      base: base, before: before, after: after, scroll: after - base
    });
    // Back to the centre for the next round, and the reference is redone there.
    scrollTo(0, CENTER);
    setTimeout(() => { base = Math.round(scrollY); inProgress = false; }, 150);
  }, WAIT_READ);
}, {capture: true, passive: true});

// ⛔ THE DENOMINATOR OF THE MEASUREMENT, and it was not there at the first round.
//
//    «The page did not see the click» has at least three causes with the same
//    look: the injection does not leave · it leaves and reaches no window ·
//    it arrives and scrolling is the only thing that gets lost.  The movement of
//    the pointer separates them: if the page sees the pointer move, the road
//    to it is open and the silence on the click means something.
//
//    ⭐ It is `LEZIONI.md` §1.9 rule 2 — the positive control on the same
//    instrument — put where it is needed instead of in words.
let lastPointer = 0;
addEventListener("pointermove", (e) => {
  const now = performance.now();
  if (now - lastPointer < 400) return;   // the log is not flooded
  lastPointer = now;
  ship({kind: "POINTER", x: Math.round(e.clientX), y: Math.round(e.clientY),
            deltaY: null, scroll: null});
}, {passive: true});

addEventListener("mousedown", (e) => {
  ship({kind: "BOTTONE", button_code: e.button, x: Math.round(e.clientX),
            y: Math.round(e.clientY), deltaY: null, scroll: null});
}, {passive: true});

addEventListener("load", () => {
  scrollTo(0, CENTER);
  setTimeout(() => {
    base = Math.round(scrollY);
    ship({kind: "READY", deltaY: null, scroll: null, departure: base});
  }, 200);
});
</script>
</body>
</html>
