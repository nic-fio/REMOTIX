# remotix-niente-sospensione.conf — la terza cintura di `DECISIONI.md` §4.7.
# ⛔ La cintura piu' forte delle tre: qui rifiuta SYSTEMD, non polkit, e vale
#    anche per root — `[M]` 15 ago 2026, `CanSuspend="no"` anche da root.
# ⭐ `DECISIONI.md` §10.12: il pacchetto la porta SPENTA in
#   /usr/share/remotix/cinture/; il motore la monta, col consenso, nel percorso
#   del FORNITORE (/usr/lib/systemd/sleep.conf.d): un file dell'amministratore in
#   /etc/systemd/sleep.conf.d con lo stesso nome la spegne.
# ⚠ DECISIONE D4 APERTA (`fasi/17-l-installatore.md` §10): di serie, o scelta?
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
