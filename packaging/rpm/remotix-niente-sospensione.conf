# remotix-niente-sospensione.conf — the third belt of `DECISIONI.md` §4.7.
# ⛔ The strongest belt of the three: here SYSTEMD refuses, not polkit, and it holds
#    for root too — `[M]` 15 Aug 2026, `CanSuspend="no"` even as root.
# ⭐ `DECISIONI.md` §10.12: the package ships it OFF in
#   /usr/share/remotix/cinture/; the engine mounts it, with consent, in the
#   VENDOR path (/usr/lib/systemd/sleep.conf.d): an administrator's file in
#   /etc/systemd/sleep.conf.d with the same name switches it off.
# ⚠ DECISION D4 OPEN (`fasi/17-l-installatore.md` §10): by default, or a choice?
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
