# remotix-no-suspend.conf — the third belt of `DECISIONS.md` §4.7.
# ⛔ The strongest belt of the three: here SYSTEMD refuses, not polkit, and it holds
#    for root too — `[M]` 15 Aug 2026, `CanSuspend="no"` even as root.
# ⭐ `DECISIONS.md` §10.12: the package ships it OFF in
#   /usr/share/remotix/belts/; the engine does not mount it (DECISIONS §10.36):
#   the administrator can, in the VENDOR path (/usr/lib/systemd/sleep.conf.d); an
#   administrator's file in /etc/systemd/sleep.conf.d with the same name switches it off.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
