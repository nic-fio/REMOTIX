# /usr/share/remotix/remotix.conf — the REMOTIX DEFAULTS (fasi/17 §6.4).
#
# ⛔ Do not edit: it belongs to the package, and an upgrade rewrites it.  The
#    administrator's choices go in /etc/remotix/remotix.conf.d/*.conf, with the
#    same lines: they win over these.
# ⚠ PROVISIONAL format (VARIABLE=value lines, read by remotix.service as
#   EnvironmentFile): the real configuration belongs to the engine, step T4.

# The port, TCP (the page) and UDP (QUIC).
REMOTIX_PORTA=7447

# Extra options for the server, for example «--nome 192.168.1.10» if you connect
# with the IP address instead of the machine name.
REMOTIX_OPZIONI=
