# remotix-niente-sospensione.conf — the third of the three belts of
# `DECISIONI.md` §4.7 (the same one src/provisiona.sh writes).
#
# ⛔ DECISIONI.md §10.12: the package ships it OFF in
#   /usr/share/remotix/cinture/; the engine mounts it with consent (D4) in
#   a sleep.conf.d folder, and unmounts it from its log.
#
# ⛔ The strongest belt of the three: here SYSTEMD refuses, not polkit, and it holds
#    for root too — `[M]` 15 Aug 2026, `CanSuspend="no"` even as root.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
