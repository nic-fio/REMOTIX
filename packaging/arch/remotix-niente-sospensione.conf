# remotix-niente-sospensione.conf — la terza delle tre cinture di
# `DECISIONI.md` §4.7 (la stessa che scrive src/provisiona.sh).
#
# ⚠ DECISIONE D4 APERTA (fasi/17 §10): le cinture sulle macchine degli altri.
#   Qui nel percorso del FORNITORE (/usr/lib/systemd/sleep.conf.d/): chi non le
#   vuole mette un file con lo stesso nome in /etc/systemd/sleep.conf.d/
#   (anche vuoto) e vince il suo.
#
# ⛔ La cintura piu' forte delle tre: qui rifiuta SYSTEMD, non polkit, e vale
#    anche per root — `[M]` 15 ago 2026, `CanSuspend="no"` anche da root.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
