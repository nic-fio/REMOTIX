# /usr/share/remotix/remotix.conf — i PREDEFINITI di REMOTIX (fasi/17 §6.4).
#
# ⛔ Non si modifica: e' del pacchetto, e un aggiornamento lo riscrive.  Le scelte
#    dell'amministratore vanno in /etc/remotix/remotix.conf.d/*.conf, con le
#    stesse righe: vincono su queste.
# ⚠ Formato PROVVISORIO (righe VARIABILE=valore, lette da remotix.service come
#   EnvironmentFile): la configurazione vera e' del motore, tappa T4.

# La porta, TCP (la pagina) e UDP (QUIC).
REMOTIX_PORTA=7447

# Opzioni in piu' per il server, per esempio «--nome 192.168.1.10» se si entra
# con l'indirizzo IP invece che col nome della macchina.
REMOTIX_OPZIONI=
