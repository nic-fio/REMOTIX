# remotix-no-suspend.conf — the third belt of DECISIONS.md §4.7.
#
# ⛔ The strongest of the three: here SYSTEMD refuses, not polkit, and it applies to
#    root too — `[M]` 15 Aug 2026, `CanSuspend="no"` even as root.
# ⚠ The package carries it SWITCHED OFF in /usr/share/remotix/belts/ (DECISIONI
#   §10.12); the engine does not put it into force (DECISIONS §10.36): the
#   administrator does, if wanted.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
