# remotix-niente-sospensione.conf — the third belt of DECISIONI.md §4.7.
#
# ⛔ The strongest of the three: here SYSTEMD refuses, not polkit, and it applies to
#    root too — `[M]` 15 Aug 2026, `CanSuspend="no"` even as root.
# ⚠ The package carries it SWITCHED OFF in /usr/share/remotix/cinture/ (DECISIONI
#   §10.12): the engine puts it into force, with consent (D4, fasi/17 §10).
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
