# remotix-niente-sospensione.conf — la terza cintura di DECISIONI.md §4.7.
#
# ⛔ La piu' forte delle tre: qui rifiuta SYSTEMD, non polkit, e vale anche per
#    root — `[M]` 15 ago 2026, `CanSuspend="no"` anche da root.
# ⚠ Nel percorso del FORNITORE (/usr/lib/systemd/sleep.conf.d/): un file
#   dell'amministratore in /etc/systemd/sleep.conf.d/ con lo stesso nome la
#   sostituisce, uno con un nome che viene dopo la scavalca.  Se sulle macchine
#   degli altri debba esserci di serie e' la decisione D4 (fasi/17 §10), IN ATTESA.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
