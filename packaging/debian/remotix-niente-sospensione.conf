# remotix-niente-sospensione.conf — la terza cintura di DECISIONI.md §4.7.
#
# ⛔ La piu' forte delle tre: qui rifiuta SYSTEMD, non polkit, e vale anche per
#    root — `[M]` 15 ago 2026, `CanSuspend="no"` anche da root.
# ⚠ Il pacchetto la porta SPENTA in /usr/share/remotix/cinture/ (DECISIONI
#   §10.12): la mette in vigore il motore, col consenso (D4, fasi/17 §10).
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
