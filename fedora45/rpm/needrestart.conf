# needrestart: never restart remotix.service by itself.
#
# Restarting REMOTIX closes every remote desktop (the service stops its users' sessions, DECISIONS-11 §11.56), and
# needrestart (dnf-automatic with needrestart, or `needrestart -r a`) would restart it without asking after any update of a
# library it uses (glibc, openssl-libs, pam...).  The display managers and xrdp are exempted in needrestart.conf for the same
# reason.  With this line the service is only listed under «Services to be restarted manually»: the administrator
# restarts it when no remote desktop is open.  (The old library stays loaded until then.)
$nrconf{override_rc}{qr(^remotix\.service$)} = 0;
