class Scrittore {
  constructor() { this.b = []; }
  u8(v)  { this.b.push(v & 0xff); return this; }
  u16(v) { this.b.push((v >> 8) & 0xff, v & 0xff); return this; }
  u32(v) { this.b.push((v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff); return this; }
  /* stringa = u16 lunghezza + i byte UTF-8, SENZA terminatore (§6.0) */
  str(t)  { const d = new TextEncoder().encode(t); this.u16(d.length); for (const x of d) this.b.push(x); return this; }
  byte()  { return new Uint8Array(this.b); }
}

/* L'inquadratura di §6.1: u16 tipo, u32 lunghezza, corpo. */
function inquadra(tipo, corpo) {
  const m = new Uint8Array(6 + corpo.length);
  const v = new DataView(m.buffer);
  v.setUint16(0, tipo);
  v.setUint32(2, corpo.length);
  m.set(corpo, 6);
  return m;
}

class Lettore {
  constructor(d) { this.v = new DataView(d.buffer, d.byteOffset, d.byteLength); this.o = 0; }
  u8()  { return this.v.getUint8(this.o++); }
  u16() { const x = this.v.getUint16(this.o); this.o += 2; return x; }
  u32() { const x = this.v.getUint32(this.o); this.o += 4; return x; }
  str() { const n = this.u16(); const d = new Uint8Array(this.v.buffer, this.v.byteOffset + this.o, n); this.o += n; return new TextDecoder().decode(d); }
  resta() { return this.v.byteLength - this.o; }
}

/* Il lettore del canale di controllo: accumula e restituisce un messaggio alla
   volta.  ⛔ La lunghezza si controlla PRIMA di allocare (§6.1). */
class Canale {
  constructor(stream) {
    this.lettore = stream.readable.getReader();
    this.scrittore = stream.writable.getWriter();
    this.buf = new Uint8Array(0);
  }
  async manda(tipo, corpo) { await this.scrittore.write(inquadra(tipo, corpo)); }
  async ricevi() {
    for (;;) {
      if (this.buf.length >= 6) {
        const v = new DataView(this.buf.buffer, this.buf.byteOffset, this.buf.byteLength);
        const tipo = v.getUint16(0), lung = v.getUint32(2);
        if (lung > 1024 * 1024) throw new Error("messaggio oltre 1 MiB: il server viola §6.1");
        if (this.buf.length >= 6 + lung) {
          const corpo = this.buf.slice(6, 6 + lung);
          this.buf = this.buf.slice(6 + lung);
          return { tipo, corpo };
        }
      }
      const { value, done } = await this.lettore.read();
      if (done) return null;
      const n = new Uint8Array(this.buf.length + value.length);
      n.set(this.buf); n.set(value, this.buf.length);
      this.buf = n;
    }
  }
}

function base64ABytes(b64) {
  const s = atob(b64);
  const d = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) d[i] = s.charCodeAt(i);
  return d;
}

/* ⛔ LE STRINGHE DI CODEC, E PERCHE' SONO UNA SCALA E NON UNA.
 *
 * `[M]` 12 agosto 2026: `hev1.` e `hvc1.` vanno tutti e due in Annex-B puro —
 * Chromium decide la forma del flusso dalla PRESENZA della `description`, non
 * dal prefisso (F2-5 §3).  Qui non si manda nessuna `description`, per HEVC e
 * per AV1: `fasi/02-primo-fotogramma.md` D1.
 *
 * ⚠ `seq_level_idx` di AV1 NON e' il livello in chiaro: `4` vuol dire 3.0.  E'
 *   il tipo di campo su cui si sbaglia in silenzio, e per questo il conto sta
 *   qui con la tabella accanto invece che dentro una costante.
 *
 * ⛔ La prima stringa e' quella col livello DICHIARATO da questa pagina; la
 *    seconda e' il ripiego con un livello basso, e serve al caso — non
 *    misurato — di un motore che rifiuti un livello piu' alto del flusso.  La
 *    sonda dice QUALE delle due ha dipinto, e la sessione usa quella. */
function stringhe_codec(nome, profondita, livello) {
  const pezzi = String(livello).split(".");
  const maggiore = parseInt(pezzi[0], 10) || 5;
  const minore = parseInt(pezzi[1], 10) || 0;
  const due = (n) => (n < 10 ? "0" : "") + n;
  if (nome === "hevc") {
    /* general_profile_idc 1 = Main (8 bit), 2 = Main10; il campo dopo e' la
       maschera di compatibilita' rovesciata, 6 per Main e 4 per Main10.
       `L<level_idc>` e' il livello per trenta.  `B0`: nessun vincolo. */
    const profilo = profondita >= 10 ? "2.4" : "1.6";
    const idc = Math.max(30, Math.round((maggiore + minore / 10) * 30));
    return ["hev1." + profilo + ".L" + idc + ".B0",
            "hev1." + profilo + ".L93.B0"];
  }
  if (nome === "av1") {
    /* seq_level_idx = (maggiore − 2) × 4 + minore.  5.1 → 13, 3.0 → 4. */
    const idx = Math.min(23, Math.max(0, (maggiore - 2) * 4 + minore));
    return ["av01.0." + due(idx) + "M." + due(profondita),
            "av01.0.04M." + due(profondita)];
  }
  return [];
}

/* Il colore medio di un rettangolo, saltando un bordo: il sottocampionamento
   della crominanza sporca il confine fra le due meta', e li' il colore non e'
   ne' l'uno ne' l'altro. */
function colore_medio(pixel, larghezza, x0, y0, x1, y1) {
  let r = 0, g = 0, b = 0, n = 0;
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const i = (y * larghezza + x) * 4;
      r += pixel[i]; g += pixel[i + 1]; b += pixel[i + 2]; n++;
    }
  }
  return n ? [Math.round(r / n), Math.round(g / n), Math.round(b / n)] : null;
}

function lontananza(a, b) {
  return Math.round(Math.sqrt((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 +
                              (a[2] - b[2]) ** 2));
}

/* Dipinge UNA sonda e rilegge i pixel.  ⛔ Ritorna «arriva» solo se le due
   meta' si classificano ciascuna sulla PROPRIA tinta: nessun riempimento
   uniforme — nero, magenta, o una delle due tinte — supera questa prova. */
function dipingi_sonda(config, sonda) {
  return new Promise((risolvi) => {
    /* ⛔ LA TELA DELLA RILETTURA NON E' LA MISURA DEL FOTOGRAMMA, e la
       differenza e' nata con la scala delle misure: `getImageData` su
       3840x2160 sono **33 milioni di pixel** riportati indietro, per gradino e
       per codec — cioe' il costo all'avvio non sarebbe piu' quello della
       decodifica ma quello della rilettura.  ⇒ Il fotogramma si dipinge
       RIDOTTO (`drawImage` scala) e si rilegge una tela di 64x48: le due meta'
       restano due meta' anche ridotte.
       ⚠ Le quattro sonde del CODEC non portano `rl`/`ra`, e per loro la
         rilettura resta 1:1 esattamente come prima. */
    const rl = sonda.rl || sonda.l, ra = sonda.ra || sonda.a;
    const tela = document.createElement("canvas");
    tela.width = rl; tela.height = ra;
    const p = tela.getContext("2d", { willReadFrequently: true, alpha: false });
    if (!p) { risolvi({ arriva: false, perche: "niente contesto 2d" }); return; }
    /* Magenta: non e' nessuna delle due tinte, e non e' nero. */
    p.fillStyle = "#7a007a";
    p.fillRect(0, 0, rl, ra);

    let finito = false;
    let dec = null;
    const orologio = setTimeout(() => chiudi({
      arriva: false, perche: "nessun fotogramma entro 2,5 s" }), 2500);
    function chiudi(esito) {
      if (finito) return;
      finito = true;
      clearTimeout(orologio);
      try { if (dec && dec.state !== "closed") dec.close(); } catch (e) { /* gia' chiusa */ }
      risolvi(esito);
    }
    function giudica(formato, misura) {
      let dati;
      try { dati = p.getImageData(0, 0, rl, ra).data; }
      catch (e) { return { arriva: false, perche: "getImageData: " + e }; }
      const b = 4;
      const sx = colore_medio(dati, rl, b, b, rl / 2 - b, ra - b);
      const dx = colore_medio(dati, rl, rl / 2 + b, b, rl - b, ra - b);
      const bene = sx && dx &&
        lontananza(sx, sonda.sinistra) < lontananza(sx, sonda.destra) &&
        lontananza(dx, sonda.destra) < lontananza(dx, sonda.sinistra);
      return { arriva: !!bene, formato: formato, misura: misura,
               letture: { sinistra: sx, destra: dx },
               perche: bene ? null : "il fotogramma e' uscito ma i pixel non "
                      + "sono quelli della sonda (sinistra " + sx
                      + ", destra " + dx + ")" };
    }
    try {
      dec = new VideoDecoder({
        output: (f) => {
          const formato = (f.format === undefined) ? "assente" : f.format;
          /* ⛔⭐ LA MISURA SI LEGGE DAL FOTOGRAMMA, E NON DALLA CONFIGURAZIONE.
             Per la scala delle misure e' la meta' della prova: un
             decodificatore che accettasse `codedWidth: 3840` e producesse un
             fotogramma piu' piccolo — o che dipingesse due tinte perche' il
             flusso di prima era ancora in coda — passerebbe la prova dei pixel
             e mentirebbe sulla misura.  ⚠ Si legge PRIMA di `close()`: dopo,
             i campi non ci sono piu'. */
          const misura = [f.displayWidth || f.codedWidth,
                          f.displayHeight || f.codedHeight];
          try { p.drawImage(f, 0, 0, rl, ra); }
          catch (e) { try { f.close(); } catch (e2) { /* gia' chiuso */ }
                      chiudi({ arriva: false, perche: "drawImage: " + e }); return; }
          try { f.close(); } catch (e) { /* gia' chiuso */ }
          chiudi(giudica(formato, misura));
        },
        /* ⛔ Il richiamo d'errore e' l'unico posto in cui il decodificatore puo'
           dire «sono fallito».  Buttarlo renderebbe ogni fallimento
           indistinguibile da uno zero (`REVIEWER.md` §1 punto 4). */
        error: (e) => chiudi({ arriva: false, perche: String(e) }),
      });
      dec.configure(config);
      dec.decode(new EncodedVideoChunk({
        type: "key", timestamp: 0, data: base64ABytes(sonda.dati) }));
    } catch (e) {
      chiudi({ arriva: false, perche: String(e) });
    }
  });
}

/* Sonda UN codec a UNA profondita', e ritorna che cosa ha detto ciascuno dei
   due testimoni: l'API e il pixel. */
async function sonda_una(nome, profondita) {
  const esito = { codec: nome, profondita: profondita, arriva: false,
                  stringa: null, api: [], formato: null, letture: null,
                  perche: null };
  const sonda = SONDE[nome + "-" + profondita];
  if (!sonda) { esito.perche = "questa pagina non porta una sonda per "
                             + nome + " a " + profondita + " bit"; return esito; }
  if (typeof VideoDecoder === "undefined") {
    esito.perche = "questo browser non ha WebCodecs"; return esito;
  }
  for (const stringa of stringhe_codec(nome, profondita, LIVELLO_DICHIARATO)) {
    const config = { codec: stringa, codedWidth: sonda.l, codedHeight: sonda.a,
                     optimizeForLatency: true };
    let dichiarata;
    try { dichiarata = (await VideoDecoder.isConfigSupported(config)).supported; }
    catch (e) { dichiarata = "eccezione: " + e; }
    esito.api.push({ stringa: stringa, isConfigSupported: dichiarata });
    /* ⛔ `isConfigSupported` si usa come FILTRO e non come verdetto: quando dice
       no, il pixel non arriva mai (`[M]` su tutte e quattro le caselle di
       F2-5); quando dice si', non dice niente — e' la forma E1. */
    if (dichiarata !== true) continue;
    const r = await dipingi_sonda(config, sonda);
    esito.letture = r.letture || esito.letture;
    if (r.arriva) {
      esito.arriva = true; esito.stringa = stringa; esito.formato = r.formato;
      return esito;
    }
    esito.perche = r.perche;
  }
  if (!esito.perche)
    esito.perche = "isConfigSupported ha detto no a tutte le stringhe provate";
  return esito;
}

/* ⛔ LA TELA MINIMA DI §4.5.  Non e' una preferenza: sotto 320x240 non esiste
   nessuna tela che il protocollo permetta di chiedere, quindi non esiste
   nessun tetto piu' basso che valga la pena di dichiarare. */
const TELA_MINIMA_L = 320, TELA_MINIMA_A = 240;

/* ⭐ UN GRADINO DELLA SCALA: si prova a decodificare alla misura del gradino, e
   si pretendono DUE cose insieme —
     1. i pixel sono quelli della sonda (le due tinte, come per il codec);
     2. ⛔ e il fotogramma che ne e' uscito ha DAVVERO quella misura.
   ⚠ La seconda senza la prima non basterebbe (un fotogramma nero della misura
     giusta e' un fotogramma che non e' arrivato), e la prima senza la seconda
     nemmeno (un fotogramma piu' piccolo, ridotto sulla tela di rilettura,
     porterebbe le due tinte lo stesso).  ⇒ E' la stessa coppia di pretese che
     `banchi/02-pagina-sonda-misura.py` certifica dal lato del costruttore. */
async function misura_un_gradino(stringa, gradino) {
  const esito = { misura: gradino.l + "x" + gradino.a, arriva: false,
                  isConfigSupported: null, ms: 0, perche: null };
  const config = { codec: stringa, codedWidth: gradino.l,
                   codedHeight: gradino.a, optimizeForLatency: true };
  const t0 = performance.now();
  try { esito.isConfigSupported =
          (await VideoDecoder.isConfigSupported(config)).supported; }
  catch (e) { esito.isConfigSupported = "eccezione: " + e; }
  /* ⛔ Filtro, non verdetto — la forma E1, la stessa di `sonda_una`. */
  if (esito.isConfigSupported !== true) {
    esito.ms = Math.round(performance.now() - t0);
    esito.perche = "isConfigSupported: " + esito.isConfigSupported;
    return esito;
  }
  const r = await dipingi_sonda(config, gradino);
  esito.ms = Math.round(performance.now() - t0);
  if (!r.arriva) { esito.perche = r.perche; return esito; }
  const m = r.misura || [0, 0];
  if (m[0] !== gradino.l || m[1] !== gradino.a) {
    esito.perche = "ha dipinto, ma il fotogramma misura " + m[0] + "x" + m[1]
                 + " invece di " + gradino.l + "x" + gradino.a;
    return esito;
  }
  esito.arriva = true;
  return esito;
}

/* La scala per UN codec: si sale finche' si dipinge, e ⛔ ci si ferma al primo
   gradino che non arriva.  ⚠ Fermarsi e' una SCELTA e non una scorciatoia: un
   decodificatore che rifiuta 2560x1440 e accettasse 3840x2160 sarebbe un
   fenomeno di cui questo progetto non ha nessuna misura, e continuare a salire
   costerebbe a ogni avvio su ogni dispositivo per coprirlo.  ⇒ Si dichiara
   l'ipotesi (la capacita' e' monotona nella misura) invece di pagarla in
   silenzio, e il registro porta il gradino su cui ci si e' fermati. */
async function scala_di(nome, stringa) {
  const fuori = { codec: nome, stringa: stringa, gradini: [],
                  massima: null, fermato: null, ms: 0 };
  const t0 = performance.now();
  for (const gradino of (SONDE_MISURA[nome] || [])) {
    const r = await misura_un_gradino(stringa, gradino);
    fuori.gradini.push(r);
    if (!r.arriva) { fuori.fermato = r.misura + " — " + r.perche; break; }
    fuori.massima = [gradino.l, gradino.a];
  }
  fuori.ms = Math.round(performance.now() - t0);
  return fuori;
}

/* ⛔⭐ `video.misura_massima` DI §4.3, MISURATA SUL PIXEL.
 *
 * ⚠ Il tetto si prende al MINIMO fra i codec che questa pagina dichiarera',
 *   e la ragione e' §4.3: **chi sceglie il codec e' il server**, dopo.  Un
 *   tetto che valesse per uno solo dei due codec dichiarati sarebbe un tetto
 *   che non regge — e il rosso arriverebbe a sessione aperta, non qui.
 *
 * ⚠ E si misura a 8 bit: `8` e' la profondita' che §4.3 impone a tutti e due i
 *   lati, quindi e' l'unica che si sa che verra' usata.  `[?]` Un
 *   decodificatore che regga il 4K a 8 bit e si fermi a 1080p a 10 bit non e'
 *   misurato: sarebbero dodici gradini invece di sei all'avvio di ogni pagina,
 *   e il caso non ha ancora un numero che lo giustifichi. */
async function misura_massima(sondaggio) {
  const fuori = { per_codec: {}, massima: null, ms: 0, perche: null };
  const t0 = performance.now();
  for (const nome of PREFERENZA) {
    const c = sondaggio.codec[nome] || {};
    /* ⛔ Un codec che non arriva al pixel non entra nel `CIAO`, quindi non ha
       nessun tetto da far rispettare: misurarne la scala sarebbe pagare
       sei decodifiche per un codec che non si dichiara. */
    const provata = (c[8] && c[8].arriva) ? c[8]
                  : ((c[10] && c[10].arriva) ? c[10] : null);
    if (!provata) continue;
    const s = await scala_di(nome, provata.stringa);
    fuori.per_codec[nome] = s;
    if (!s.massima) {
      /* ⛔ Il codec dipinge a 64x48 ma non alla tela minima del protocollo.
         Non c'e' niente di piu' basso da dichiarare — 320x240 e' il fondo di
         §4.5 — e dichiarare piu' in alto sarebbe la bugia che rompe il
         telefono.  ⇒ Si dichiara il fondo, E si dice che nemmeno quello ha
         dipinto: il tetto e' onesto, la frase avverte. */
      fuori.massima = [TELA_MINIMA_L, TELA_MINIMA_A];
      fuori.perche = "⛔ " + nome + " non ha dipinto nemmeno alla tela minima "
                   + "di §4.5 (" + TELA_MINIMA_L + "x" + TELA_MINIMA_A + "): "
                   + s.fermato;
    } else if (!fuori.massima ||
               s.massima[0] * s.massima[1] < fuori.massima[0] * fuori.massima[1]) {
      fuori.massima = s.massima;
    }
  }
  fuori.ms = Math.round(performance.now() - t0);
  return fuori;
}

/* ⛔ IL SONDAGGIO PARTE AL CARICAMENTO, non alla connessione: le quattro sonde
   costano qualche decina di millisecondi su un motore che decodifica e fino a
   dieci secondi su uno che rifiuta tutto con un tempo scaduto.  Farlo qui
   significa che quando l'utente preme «Collegati» la risposta c'e' gia'.
   ⭐ E da qui passa anche la scala delle misure: e' la stessa domanda — «che
   cosa arriva al pixel su QUESTO dispositivo» — posta un'altra volta, e il suo
   costo si legge in `sondaggio.misura.ms`, che il registro scrive. */
const SONDAGGIO = (async function () {
  const fuori = { codec: {}, webcodecs: typeof VideoDecoder !== "undefined",
                  misura: null };
  for (const nome of PREFERENZA) {
    fuori.codec[nome] = {};
    for (const profondita of [8, 10])
      fuori.codec[nome][profondita] = await sonda_una(nome, profondita);
  }
  fuori.misura = await misura_massima(fuori);
  return fuori;
})();

/* ⛔ LA DEGRADAZIONE SI DICHIARA — `CODER.md` §4.2.  Questa funzione e' il posto
 *    in cui il ripiego smette di essere silenzioso, e scrive DUE cose diverse:
 *    la frase per l'utente (nel riquadro) e i numeri per il registro.
 *
 * ⚠ E dichiara anche quel che NON sa: se il decodificatore sia hardware o
 *   software **da JavaScript non e' osservabile** (`web.md` §4.1: il dato
 *   esiste dentro Chromium, `IsPlatformDecoder()`, e non compare in nessuna
 *   interfaccia).  ⛔ Scrivere «software» perche' `powerEfficient` e' falso
 *   sarebbe inventare: `[M]` 12 agosto 2026 quello stesso campo risponde
 *   `true` su Firefox per un codec che il browser non decodifica affatto. */
/* ⛔ IL RIQUADRO PORTA DUE DICHIARAZIONI, E SI TENGONO SEPARATE.
 *
 * Prima di oggi ce n'era una sola — quella del codec — e chi ne avesse scritta
 * una seconda avrebbe cancellato la prima con un `textContent =`.  ⛔ E' la
 * forma piu' facile da non vedere: il ripiego dichiarato che sparisce perche'
 * ne e' arrivato un altro, cioe' `CODER.md` §4.2 rotto proprio dal secondo
 * ripiego.  ⇒ Due caselle, e una funzione sola che le compone. */
const DICHIARAZIONI = { codec: "", video: "" };
function dichiarazione_scrivi() {
  $("dichiarazione").textContent =
    [DICHIARAZIONI.codec, DICHIARAZIONI.video].filter((t) => t).join("\n\n");
}

function dichiara(sondaggio, scelto) {
  const righe = [];
  for (const nome of PREFERENZA) {
    const c = sondaggio.codec[nome] || {};
    const otto = c[8] || {}, dieci = c[10] || {};
    if (otto.arriva || dieci.arriva) {
      righe.push(nome.toUpperCase() + ": arriva al pixel ("
        + [8, 10].filter((p) => c[p] && c[p].arriva).join(" e ") + " bit, «"
        + (otto.stringa || dieci.stringa) + "»)");
    } else {
      righe.push("⛔ " + nome.toUpperCase() + ": NON arriva al pixel su questo "
                 + "browser — " + (otto.perche || "non provato"));
    }
  }
  /* ⭐ E la scala delle misure scrive le SUE righe: il gradino piu' alto che ha
     dipinto per ciascun codec, quello su cui si e' fermata, e ⛔ QUANTO E'
     COSTATA — perche' e' un prezzo che si paga al caricamento di ogni pagina,
     e un prezzo che nessuno scrive e' un prezzo che nessuno puo' discutere. */
  const mm = sondaggio.misura || {};
  for (const nome of PREFERENZA) {
    const s = (mm.per_codec || {})[nome];
    if (!s) continue;
    righe.push("misura " + nome.toUpperCase() + ": fino a "
      + (s.massima ? s.massima[0] + "x" + s.massima[1] : "NIENTE")
      + " (" + s.gradini.length + " gradini, " + s.ms + " ms"
      + (s.fermato ? "; fermata a " + s.fermato : "; scala finita") + ")");
  }
  righe.push("⭐ video.misura_massima MISURATA: "
    + (mm.massima ? mm.massima[0] + "x" + mm.massima[1] : "nessuna — la "
       + "capacita' si OMETTE (§4.3 vieta il valore vuoto)")
    + " — e' il tetto del DECODIFICATORE (§4.3), non la misura dello schermo, "
    + "che vale " + Math.max(1, Math.floor(screen.width * devicePixelRatio))
    + "x" + Math.max(1, Math.floor(screen.height * devicePixelRatio))
    + " e viaggia in ATTACCA come «vista» · scala in " + (mm.ms || 0) + " ms");
  if (mm.perche) righe.push(mm.perche);
  for (const r of righe) nota("sonda video · " + r);

  const hevc = sondaggio.codec.hevc || {};
  const av1 = sondaggio.codec.av1 || {};
  const hevc_c = !!(hevc[8] && hevc[8].arriva) || !!(hevc[10] && hevc[10].arriva);
  const av1_c = !!(av1[8] && av1[8].arriva) || !!(av1[10] && av1[10].arriva);
  if (!hevc_c && !av1_c) {
    DICHIARAZIONI.codec = "Questo browser non porta nessuno dei due codec video "
      + "fino ai pixel: né HEVC né AV1. La sessione può aprirsi, ma non ci sarà "
      + "immagine. Su Linux il decodificatore HEVC di Chrome è quello della "
      + "scheda grafica, e senza scheda grafica non c'è; Firefox non fa HEVC "
      + "affatto.";
  } else if (!hevc_c && av1_c) {
    /* ⭐ Il ripiego negoziato di `DECISIONI.md` §1.13, dichiarato all'utente. */
    DICHIARAZIONI.codec = "Questo browser non decodifica HEVC: si usa AV1, che è "
      + "il ripiego previsto. L'immagine c'è; il consumo di banda a parità di "
      + "qualità può essere diverso.";
  } else if (scelto && scelto.codec === "av1" && hevc_c) {
    DICHIARAZIONI.codec = "Il server ha scelto AV1 anche se questo browser "
      + "decodifica HEVC.";
  } else {
    DICHIARAZIONI.codec = "";
  }
  /* ⛔ E se nemmeno la tela minima ha dipinto, l'utente lo legge: e' il caso in
     cui il tetto dichiarato e' onesto ma non basta a nessuna tela legale. */
  if ((sondaggio.misura || {}).perche)
    DICHIARAZIONI.codec = (DICHIARAZIONI.codec ? DICHIARAZIONI.codec + " " : "")
      + "E questo browser non ha dipinto nemmeno alla misura minima prevista "
      + "dal protocollo (320×240): l'immagine potrebbe non arrivare affatto.";
  dichiarazione_scrivi();
  return { hevc: hevc_c, av1: av1_c };
}

/* ⛔⭐ LA DICHIARAZIONE DI QUEL CHE NON ARRIVA — `CODER.md` §4.2, e il difetto
 *     dell'utente del 13 agosto 2026.
 *
 * Quel giorno l'utente ha aperto il prodotto sul proprio schermo e **non ha
 * visto niente**.  ⛔ E il prodotto SAPEVA: il server aveva scritto nel proprio
 * registro *«tela in vigore 1794x1010 ma il fotogramma catturato e' 1920x1080 —
 * NON lo spedisco»*.  Lo sapeva il server, non lo sapeva l'utente, e la pagina
 * mostrava un riquadro vuoto sotto un modulo che aveva detto «Ammesso».
 *
 * ⇒ §4.2: *«il ripiego SI DICHIARA»*.  Una pagina che apre una sessione e non
 *   riceve un pixel deve dirlo — in italiano, nel riquadro, con dentro i numeri
 *   e la causa piu' probabile.  ⚠ E deve dirlo **anche quando la causa sta
 *   dall'altra parte del filo**: «non lo so» detto con i numeri in mano vale
 *   piu' del silenzio.
 *
 * ⛔ E la soglia e' un FATTO, non un'impressione: il primo fotogramma e' una
 *    chiave che §5.2 impone al server di spedire subito dopo `SESSIONE`.  Sei
 *    secondi sono venti volte il tempo che ha impiegato l'unico giro misurato
 *    (`P2-6` §3: dall'accensione al deposito ~330 ms), e restano sotto la
 *    pazienza di chi guarda uno schermo bianco. */
const ATTESA_PRIMO_FOTOGRAMMA_S = 6;
function veglia_primo_fotogramma(schermo, chiesta, concessa, codec) {
  const t0 = performance.now();
  const id = setInterval(() => {
    if (schermo.conti.dipinti > 0) {
      clearInterval(id);
      /* ⭐ E quando arriva, la dichiarazione si TOGLIE: un avviso che resta
         dopo che il fatto e' passato insegna a non leggerlo. */
      if (DICHIARAZIONI.video.indexOf("Nessun fotogramma") === 0) {
        DICHIARAZIONI.video = "";
        dichiarazione_scrivi();
      }
      return;
    }
    const s = Math.round((performance.now() - t0) / 1000);
    if (s < ATTESA_PRIMO_FOTOGRAMMA_S) return;
    const ridotta = (concessa[0] !== chiesta[0] || concessa[1] !== chiesta[1]);
    DICHIARAZIONI.video = "Nessun fotogramma è arrivato in " + s + " secondi. "
      + "La sessione è aperta e il codec video negoziato è " + codec.toUpperCase()
      + ", ma il server non ha ancora spedito nessuna immagine.\n"
      + (ridotta
         ? "La causa più probabile è la tela: ne sono stati chiesti "
           + chiesta[0] + "×" + chiesta[1] + " e il server ne ha concessi "
           + concessa[0] + "×" + concessa[1] + ". Un server che cattura lo "
           + "schermo a una misura fissa non può spedire un fotogramma che non "
           + "corrisponda alla tela in vigore, e non lo spedisce: lo scrive nel "
           + "proprio registro. ⇒ Quel che manca è l'immagine, e quel che la "
           + "trattiene è la differenza fra queste due misure."
         : "La tela concessa è quella chiesta (" + concessa[0] + "×"
           + concessa[1] + "), quindi non è la tela a trattenerla: il motivo è "
           + "dalla parte del server, e sta nel suo registro. Questa pagina non "
           + "lo può leggere, e non lo indovina.");
    dichiarazione_scrivi();
  }, 1000);
  return id;
}

/* ⛔ Il confronto fra due `numero` di §6.2 e' MODULO 2³², con le differenze
   prese col segno: a 60 fotogrammi al secondo il contatore gira dopo due anni e
   due mesi, e una sessione puo' durare di piu'.  Un confronto `a > b` nudo
   farebbe scartare tutto per un anno dopo il giro. */
function differenza(a, b) {
  let d = (a - b) % 4294967296;
  if (d >= 2147483648) d -= 4294967296;
  if (d < -2147483648) d += 4294967296;
  return d;
}

/* Il numero che ci si aspetta dopo `n`.  ⛔ Al giro del contatore lo ZERO si
   salta: e' riservato e vuol dire «nessun fotogramma» (§6.2). */
function dopo(n) { return n === 0xFFFFFFFF ? 1 : (n + 1) >>> 0; }

/* ⛔⭐ LA VISTA, MISURATA — `RCP.md` §4.5: «la misura in cui il client
 *     disegnera'», in pixel FISICI.
 *
 * ⚠ `documentElement.clientWidth` e non `innerWidth`, e la differenza e' la
 *   BARRA DI SCORRIMENTO: `innerWidth` la conta, e disegnarci dentro vuol dire
 *   dichiarare al server una vista che sul vetro non c'e'.  Sono una quindicina
 *   di pixel — cioe' abbastanza per far comparire la barra orizzontale, e non
 *   abbastanza perche' qualcuno se ne accorga leggendo il codice.
 *
 * ⚠ E il fattore di scala si moltiplica UNA volta sola, qui: `RCP.md` §4.5 e
 *   `SPECIFICHE.md` §6.1-bis parlano di pixel fisici, il foglio di stile parla
 *   di pixel logici, e la conversione fra i due e' l'unico posto in cui questa
 *   pagina puo' sbagliare di un fattore 2 su un telefono. */
function misura_vista() {
  const r = devicePixelRatio || 1;
  const d = document.documentElement;
  const l = d.clientWidth || innerWidth || 1;
  const a = d.clientHeight || innerHeight || 1;
  /* ⛔ Qualunque misura da 1×1 in su e' legale per la vista (§7.1): niente
     arrotondamenti ai numeri pari, che sono un vincolo della TELA e che qui
     sarebbero la forma E2 — «mentire arrotondando a 320». */
  return [Math.max(1, Math.round(l * r)), Math.max(1, Math.round(a * r))];
}

/* ══════════════════════════════════════════════════════════════════════════
   `Schermo` — riceve gli stream del video, applica le regole di RCP e DIPINGE.

   ⛔ IL LETTORE DEI 28 BYTE E' SCRITTO QUI, DALLA TABELLA DI `RCP.md` §6.2, e
      non e' copiato da nessuna parte — ne' da `banchi/02-filo-fotogramma.py`
      (l'arbitro del filo), ne' dalla pagina di prova di F2.5.  ⭐ E' il pezzo di
      arbitro che `PIANO.md` §0.4 dice di aver comprato: due implementazioni
      indipendenti degli stessi 28 byte.  Se un giorno non andranno d'accordo,
      **quel disaccordo e' il regalo** — e copiare il lettore lo farebbe sparire
      senza che nessuno se ne accorga.
   ══════════════════════════════════════════════════════════════════════════ */
class Schermo {
  constructor(tela) {
    this.tela = tela;
    this.pennello = tela.getContext("2d", {
      alpha: false, willReadFrequently: true,
      desynchronized: DESINCRONIZZATA });
    this.codec = null;          /* il numero di §6.2: 1 o 2 */
    this.stringa = null;        /* la stringa di WebCodecs che la sonda ha provato */
    this.profondita = 8;
    this.tela_l = 0; this.tela_a = 0;          /* la tela IN VIGORE */
    this.tollerate = new Map();                /* "LxA" → perche' e' tollerata */
    /* ⛔⭐ Le tele che sono state IN VIGORE in questa sessione, e la riga e' nata
       da un rosso del banco il 12 agosto 2026 (caso T4).  Senza, una misura
       VECCHIA arrivata dopo che la tolleranza si e' chiusa finiva nello stesso
       ramo di una misura MAI ANNUNCIATA — cioe' veniva trattenuta invece di
       chiudere la sessione, e §6.2 dice il contrario: «da quel fotogramma in poi
       una misura vecchia e' ERRORE_PROTOCOLLO».  ⚠ Le due cose si somigliano e
       hanno cure opposte: la vecchia e' un server che sbaglia, la mai annunciata
       e' una corsa fra due stream in cui nessuno ha sbagliato. */
    this.storiche = new Set();
    this.finestra = false;                     /* la finestra del cambio di tela */
    this.dec = null; this.dec_l = 0; this.dec_a = 0;
    this.vista_l = 0; this.vista_a = 0;        /* §4.5: la misura in cui si disegna */
    /* ⛔⭐ IL DEPOSITO — l'ultimo fotogramma dipinto, tenuto alla sua misura
     * nativa.  Nasce con la cura del 13 agosto 2026, e non e' un'ottimizzazione:
     * e' quel che rende POSSIBILE seguire la vista.
     *
     * ⚠ Scrivere `canvas.width` **svuota la tela**, sempre, anche col valore di
     *   prima.  Ridimensionare la vista senza un deposito vorrebbe dire nero
     *   fino al fotogramma dopo — ⛔ e alla fase 2 il fotogramma dopo NON
     *   ESISTE: ne arriva uno solo.  Il sintomo sarebbe «ridimensiono la
     *   finestra e l'immagine sparisce», cioe' una cura peggiore del male.
     *
     * ⛔⭐ E ALLA FASE 3 QUELLA RAGIONE CADE — RIVALUTATO E TENUTO, COL NUMERO
     *     ACCANTO.  `[M]` 13 agosto 2026, banco `03-b16-dipinti.py`, caso
     *     `V3d`, Chrome 151 su Xvfb (tela 2D e AV1 tutti e due in SOFTWARE,
     *     cioe' il caso peggiore).
     *
     *   Alla fase 3 i fotogrammi sono sessanta al secondo, quindi «il
     *   fotogramma dopo» arriva fra 16 ms e il nero non si vedrebbe.  ⛔ Ma ne
     *   subentra una piu' forte, ed e' della fase 3 e non della 2: **durante un
     *   BUCO il fotogramma dopo non esiste lo stesso**.  §5.2 impone di non
     *   mostrare quel che si sa incompleto e di tenere l'ultimo buono finche'
     *   non arriva una chiave, e quella chiave arriva dopo un giro di rete piu'
     *   fino a 200 ms di smorzatore del server.  Un ridimensionamento in quella
     *   finestra, senza deposito, e' NERO per tutto quel tempo.
     *
     *   | | col deposito | senza |
     *   |---|---|---|
     *   | tela dopo un ridimensionamento a buco aperto | ⭐ **frazione nera 0,03** — l'immagine c'e' | ⛔ **frazione nera 1,00** — nero pieno |
     *   | dipinti al secondo con 60 offerti, 1920×1080 | **60,0** (100 % degli offerti) | 60,0 (100 %) |
     *   | tetto a saturazione, 1920×1080 (tre giri) | **71,3 · 71,5 · 72,3** al secondo | 75,5 · 75,6 · 75,7 al secondo |
     *
     *   ⇒ Il disegno in piu' costa circa il **5 % del tetto** (4 fotogrammi su
     *   75, cioe' **~0,7 ms per fotogramma**) e ⛔ **zero al ritmo che la fase
     *   insegue**: a 60 offerti al secondo le due strade dipingono lo stesso
     *   numero, perche' l'avanzo c'e'.  ⚠ Tre giri per lato e non uno: la
     *   dispersione fra giri (un fotogramma al secondo) e' piu' piccola della
     *   differenza fra le due strade (quattro), e senza i tre giri non si
     *   saprebbe.
     *
     * ⚠ E LE DUE MISURE NON VANNO D'ACCORDO, il che e' l'informazione: la copia
     *   1:1 cronometrata DA SOLA costa **15 µs** (0,09 % di un quadro), la
     *   catena intera ne perde **~600**.  ⛔ Vince la seconda — `LEZIONI.md`
     *   §3.1, «misura la consegna, non solo l'elaborazione» — e la differenza e'
     *   quel che il cronometro isolato non vede: `drawImage(VideoFrame)` non e'
     *   una copia di tela, e' una conversione di colore e un trasferimento.
     *
     * ⚠ E `LEZIONI.md` §6.2 vuole tutt'e due le grandezze: qui il guadagno non
     *   si paga in fluidita' finche' si sta sotto ai 72 al secondo — sopra, si
     *   paga, e allora questa riga va riletta.
     *
     * ⚠ Costa un `drawImage` in piu' per fotogramma (dal fotogramma al
     *   deposito, e dal deposito alla vista).  ⭐ L'altra strada era tenere
     *   aperto il `VideoFrame` invece di copiarlo — zero copie — e non e'
     *   stata presa: un fotogramma trattenuto e' un posto in meno nella riserva
     *   del decodificatore, e dopo un `close()` del decodificatore quel
     *   fotogramma non si sa se sia ancora disegnabile.  Il prezzo del deposito
     *   e' noto e si paga; quello dell'altra strada e' un `[?]`. */
    this.deposito = null; this.deposito_p = null;
    this.dipinta = null;                       /* l'ultimo rettangolo dipinto, per il registro */
    this.formato = null;                       /* `VideoFrame.format`, per il registro */
    this.ultimo_consegnato = null;             /* §6.2: «l'ultimo GIA' CONSEGNATO» */
    this.atteso = null;
    this.sospeso = false;                      /* c'e' un buco aperto (§5.2) */
    this.trattenuti = [];                      /* misure non ancora annunciate */
    /* ⛔⭐ LE `ADATTA_TELA` SPEDITE E SENZA RISPOSTA — §6.2, rilievo P21 del
     * 13 agosto 2026.  E' la GRANDEZZA su cui si regge il trattenimento, e
     * non e' un numero di fotogrammi: «fino a quando lo trattiene non e' un
     * numero: e' una CONDIZIONE — finche' resta una `ADATTA_TELA` che il
     * client ha spedito e a cui nessun `TELA` ha ancora risposto».
     *
     * ⚠ E' «quel che il client ha spedito LUI»: locale, monotona, indipendente
     *   dalla consegna (§6.2 la chiama la stessa grandezza di P20).  ⛔ NON e'
     *   «la misura che il client ha chiesto»: §4.5 permette al server di
     *   concedere una tela DIVERSA da quella chiesta — su KWin < 6.8 e' la
     *   strada normale — e un client che trattenesse solo i numeri che ha
     *   nominato chiuderebbe una sessione in cui il server ha fatto
     *   esattamente quel che §7.1 gli permette. */
    this.attese_tela = 0;
    this.sessione = false;                     /* §2.5: niente video prima di SESSIONE */
    this.errori = [];
    this.conti = { stream: 0, completi: 0, azzerati: 0, consegnati: 0,
                   dipinti: 0, scartati_ordine: 0, scartati_misura: 0,
                   tollerati: 0, buchi: 0, chiavi_chieste: 0,
                   riconfigurazioni: 0, trattenuti: 0, corti: 0,
                   /* ⭐ ancora `F4-CODA-DEL-DECODIFICATORE`: quanti fotogrammi
                      si sono decodificati e NON disegnati perche' ne stavano
                      gia' arrivando altri.  ⛔ Un ritmo che cala si dichiara. */
                   saltati_coda: 0,
                   /* ⚠ Contato a parte da `dipinti`, e non insieme: `dipinti`
                      vuol dire «fotogrammi arrivati fino al vetro» ed e' il
                      metro della fase (I8) — la veglia del primo fotogramma lo
                      legge.  Un ridimensionamento che lo facesse salire direbbe
                      «e' arrivata un'immagine» tirando una finestra. */
                   ricomposizioni: 0, viste: 0 };
    /* I richiami verso il canale di controllo, messi da `collega()`. */
    this.su_chiave = null;
    this.su_errore_protocollo = null;
    this.su_riga = (t) => nota("video · " + t);
  }

  riga(t) { if (this.su_riga) this.su_riga(t); }

  /* ⛔ Un tentativo nuovo riparte da zero.  ⚠ Senza, `ultimo_consegnato` del
     tentativo di prima farebbe scartare per ORDINE tutti i fotogrammi del
     tentativo nuovo — che ricomincia da `numero = 1` (§6.2) — e il sintomo
     sarebbe «alla seconda connessione lo schermo resta nero». */
  riparti() {
    try { if (this.dec && this.dec.state !== "closed") this.dec.close(); }
    catch (e) { /* gia' chiusa */ }
    this.dec = null; this.dec_l = 0; this.dec_a = 0;
    this.formato = null;
    /* ⛔ Il deposito e' di QUESTA sessione.  Senza questa riga, un tentativo
       nuovo ricomporrebbe il desktop del tentativo di prima appena la finestra
       cambia misura — un'immagine vecchia sotto una sessione nuova, che e'
       peggio del nero perche' sembra viva. */
    this.deposito = null; this.deposito_p = null; this.dipinta = null;
    this.codec = null; this.stringa = null;
    this.tollerate = new Map(); this.storiche = new Set(); this.finestra = false;
    this.ultimo_consegnato = null; this.atteso = null;
    this.sospeso = false; this.trattenuti = []; this.sessione = false;
    /* ⛔ Anche le attese di `TELA` sono di QUESTA sessione: un contatore
       ereditato dal tentativo di prima farebbe TRATTENERE — invece di chiudere
       — una misura mai annunciata nel tentativo nuovo, cioe' l'indulgenza che
       §6.2 toglie proprio quando nessuna `ADATTA_TELA` e' in volo. */
    this.attese_tela = 0;
    this.errori = [];
    for (const k of Object.keys(this.conti)) this.conti[k] = 0;
  }

  /* ⛔ Un ERRORE_PROTOCOLLO si scrive nel registro E si porta sul filo (§3):
     «chi riceve qualcosa che non capisce DEVE chiudere la connessione con
     ERRORE_PROTOCOLLO e scrivere nel registro che cosa non ha capito». */
  errore_protocollo(perche) {
    this.errori.push(perche);
    this.riga("⛔ ERRORE_PROTOCOLLO: " + perche);
    if (this.su_errore_protocollo) this.su_errore_protocollo(perche);
    return false;
  }

  /* Un buco: §5.2 impone di chiedere una chiave e di NON mostrare quel che si
     sa incompleto — si tiene l'ultimo fotogramma buono. */
  buco(perche) {
    /* ⛔⭐ UN BUCO APERTO NON SE NE FA UN SECONDO, e questa riga e' nata da un
     *     rosso del banco il 12 agosto 2026 (caso T11).
     *
     * Con un buco aperto, OGNI delta successivo rientrava qui — perche' `atteso`
     * non avanza sui fotogrammi che non si consegnano — e faceva partire una
     * `RICHIEDI_CHIAVE` per fotogramma.  ⛔ E' esattamente la spirale che §5.2
     * descrive: «durante una raffica di perdite le richieste arrivano a decine,
     * e ogni chiave costa dieci volte un delta: assecondarle peggiorerebbe la
     * condizione che le ha provocate».  ⚠ Il server ha il suo smorzatore (§5.2:
     * puo' ignorare una richiesta entro 200 ms dall'ultima chiave spedita), ma
     * appoggiarsi allo smorzatore dell'altro lato e' chiedere all'altro di
     * curare un difetto nostro. */
    if (this.sospeso) {
      this.riga("buco: " + perche + " — e ce n'e' gia' uno aperto: la chiave e' "
                + "gia' stata chiesta, non se ne chiede una seconda (§5.2)");
      return;
    }
    this.conti.buchi++;
    this.sospeso = true;
    this.riga("buco: " + perche + " ⇒ RICHIEDI_CHIAVE, e fino alla chiave si "
              + "tiene l'ultimo fotogramma buono (§5.2)");
    if (this.su_chiave) {
      this.conti.chiavi_chieste++;
      this.su_chiave(this.ultimo_consegnato === null ? 0 : this.ultimo_consegnato);
    }
  }

  /* La tela concessa in `SESSIONE` (§4.5) e il codec negoziato in `ECCOMI`. */
  negozia(codec, profondita, stringa, tela_l, tela_a) {
    this.codec = codec; this.profondita = profondita; this.stringa = stringa;
    this.tela_l = tela_l; this.tela_a = tela_a;
    this.tollerate = new Map([[tela_l + "x" + tela_a, "la tela concessa"]]);
    this.storiche = new Set([tela_l + "x" + tela_a]);
    this.sessione = true;
    this.riga("negoziato: codec " + NOME_DEL_CODEC[codec] + " («" + stringa
              + "»), " + profondita + " bit, tela " + tela_l + "×" + tela_a);
  }

  /* ⛔⭐ LA VISTA — quanti pixel FISICI ha la finestra, e le DUE misure che
   *     devono valere lo stesso numero.
   *
   * ⛔ LA TELA NON CAMBIA, e la riga qui sotto non la tocca.  §7.1: «`VISTA`
   *    NON DEVE far cambiare la tela, e in RCP/1 non cambia nemmeno la misura
   *    di quel che si codifica».  ⚠ Cambiare la tela e' un'ALTRA cosa, si
   *    chiama `ADATTA_TELA` (§7.1), viaggia sul filo, la decide l'utente
   *    (`SPECIFICHE.md` §6.4) e a RCP/1 non la manda nessuno.  Qui non parte
   *    nessun messaggio: si decide **come si dipinge quel che e' gia'
   *    arrivato**, e `this.tela_l`/`this.tela_a` — la tela in vigore, quella
   *    che le regole di §6.2 confrontano coi fotogrammi — non compaiono.
   *
   * ⛔ E le misure sono DUE, che e' il difetto del 13 agosto 2026:
   *
   *     `this.tela.width`        il buffer: quanti pixel si dipingono
   *     `this.tela.style.width`  la cornice: quanto e' grande sul vetro
   *
   *   Il buffer era gia' la vista.  La cornice era `width: 100%` di una colonna
   *   di 34rem — e un buffer di 2560 px dentro una cornice di 544 non da'
   *   nessun errore: da' l'immagine piccola.  ⇒ Si mettono qui tutt'e due, uno
   *   accanto all'altra, divise per `devicePixelRatio` — che e' esattamente il
   *   fattore fra le due unita'.  Cosi' un pixel del buffer e' un pixel del
   *   vetro, e `image-rendering` non ha piu' niente da decidere. */
  vista(l, a) {
    if (this.vista_l === l && this.vista_a === a) return false;
    const prima = this.vista_l ? this.vista_l + "×" + this.vista_a : "nessuna";
    this.vista_l = l; this.vista_a = a;
    this.conti.viste++;
    /* ⚠ Questo svuota la tela — sempre, anche se il numero non cambiasse.
       Per questo subito sotto si ricompone dal deposito. */
    this.tela.width = l; this.tela.height = a;
    const r = devicePixelRatio || 1;
    this.tela.style.width = (l / r) + "px";
    this.tela.style.height = (a / r) + "px";
    this.pennello.fillStyle = "#000";
    this.pennello.fillRect(0, 0, l, a);
    this.riga("vista " + prima + " → " + l + "×" + a + " pixel fisici ("
              + Math.round(l / r) + "×" + Math.round(a / r) + " CSS, fattore "
              + r + "): la TELA resta " + this.tela_l + "×" + this.tela_a
              + " — §7.1, qui si riscala e non si cambia la tela");
    this.componi();
    return true;
  }

  /* ⭐ La vista, misurata dalla finestra e applicata.  ⛔ E' UN PUNTO SOLO: la
     stretta di mano (§4.5, il campo `vista` di `ATTACCA`), il ridimensionamento
     della finestra e il banco passano tutti di qui.  Due strade per lo stesso
     numero sono due numeri che possono divergere (rilievo B-5).

     ⛔⭐ E SI MISURA DUE VOLTE — `[M]` 13 agosto 2026, primo giro del banco
     `02-pagina-vista-lancia.sh`, scena «ridimensiona»: finestra da 1400×900 a
     900×700, e la tela e' finita a **885×685** invece di 885×700.  Quindici
     pixel, ed erano la BARRA ORIZZONTALE.

     ⚠ La vista dipende dall'impaginazione, e la tela FA PARTE
       dell'impaginazione: e' un anello.  Nell'istante del `resize` la tela e'
       ancora larga 1385 dentro una finestra da 885 ⇒ compare la barra
       orizzontale ⇒ `clientHeight` vale 685.  Si misura li', si stringe la
       tela, la barra sparisce — e adesso il numero misurato e' vecchio di un
       istante.  ⛔ E nessun altro `resize` arriva a correggerlo: il difetto
       resta finche' l'utente non tocca di nuovo la finestra.

     ⇒ La seconda passata si fa DOPO aver stretto la tela, cioe' quando la tela
       non puo' piu' far comparire nessuna barra.  ⛔ Due e non un ciclo: se
       dopo la seconda cambiasse ancora, non sarebbe piu' l'anello della barra e
       un ciclo lo nasconderebbe girando.  ⚠ L'altra cura era un
       `max-width: 100%` sulla tela — piu' corta, e SILENZIOSA: taglierebbe da
       sola qualunque tela troppo larga, compresa una larga per un difetto. */
  adatta_vista() {
    let ultimo = misura_vista();
    if (this.vista(ultimo[0], ultimo[1])) {
      const secondo = misura_vista();
      if (secondo[0] !== ultimo[0] || secondo[1] !== ultimo[1]) {
        this.riga("⚠ la vista misurata e' cambiata fra la prima e la seconda "
                  + "passata (" + ultimo[0] + "×" + ultimo[1] + " → "
                  + secondo[0] + "×" + secondo[1] + "): era una barra di "
                  + "scorrimento che la tela stessa faceva comparire");
        ultimo = secondo;
        this.vista(secondo[0], secondo[1]);
      }
    }
    return ultimo;
  }

  /* ⛔⭐ IL RISCALAMENTO ALLA VISTA — §6.2: «il client riscala alla **vista**,
   *     non alla tela», e `SPECIFICHE.md` §6.2: «si impagina, non si stira».
   *
   * ⚠ LE BANDE SONO CORRETTE, e sono la ragione del `Math.min`.  §7.1: «la
   *   vista non ha nessun vincolo di proporzione con la tela: se le proporzioni
   *   non combaciano, si impagina con le bande».  Una tela 16:9 dentro una
   *   finestra piu' larga che alta lascia due bande verticali, ed e' giusto:
   *   ⛔ riempire deformerebbe, e `SPECIFICHE.md` §6.2 dice perche' —
   *   «allungare deforma il testo e lo rende illeggibile».  Un desktop remoto
   *   e' quasi tutto testo.
   *
   * ⭐ E il fattore non ha un tetto a 1: se la vista e' PIU' GRANDE della tela
   *    l'immagine si INGRANDISCE fino a riempirla.  ⚠ Un `Math.min(1, …)`
   *    sarebbe la stessa famiglia del difetto curato oggi — l'immagine piccola
   *    in un angolo di una finestra grande — e sarebbe piu' difficile da
   *    vedere, perche' su una finestra piccola sembrerebbe giusto. */
  componi() {
    if (!this.deposito) return false;
    const cl = this.tela.width, ca = this.tela.height;
    const fl = this.deposito.width, fa = this.deposito.height;
    if (!cl || !ca || !fl || !fa) return false;
    const s = Math.min(cl / fl, ca / fa);
    const dl = Math.max(1, Math.round(fl * s)), da = Math.max(1, Math.round(fa * s));
    const dx = Math.floor((cl - dl) / 2), dy = Math.floor((ca - da) / 2);
    try {
      /* Le bande: si ridipingono a ogni giro, o quella di prima resterebbe
         accesa sotto un'immagine diventata piu' grande. */
      if (dl !== cl || da !== ca) {
        this.pennello.fillStyle = "#000";
        this.pennello.fillRect(0, 0, cl, ca);
      }
      this.pennello.drawImage(this.deposito, dx, dy, dl, da);
    } catch (e) {
      this.errori.push("drawImage: " + e);
      this.riga("⛔ drawImage ha lanciato: " + e);
      return false;
    }
    this.conti.ricomposizioni++;
    this.dipinta = { l: dl, a: da, x: dx, y: dy, vista: [cl, ca],
                     fotogramma: [fl, fa], scala: Math.round(s * 1000) / 1000 };
    document.body.dataset.schermo = "acceso";
    return true;
  }

  /* ⛔⭐ `TELA(ADATTATA)` — §7.1, e QUI NON SI RICONFIGURA NIENTE.
   *
   * §5.2: «il client riconfigura il decodificatore sulla prima CHIAVE alla
   * misura nuova, NON sul `TELA`».  ⚠ Non e' una sfumatura: riconfigurare qui
   * — che e' la lettura naturale di §7.1, «la tela in vigore DOPO questo
   * messaggio» — metterebbe le due regole a comandare il contrario sullo stesso
   * fotogramma, perche' §6.2 impone di ACCETTARE E DIPINGERE i fotogrammi in
   * volo alla misura precedente, e un decodificatore gia' riconfigurato non
   * saprebbe piu' decodificarli (rilievo P10).
   *
   * ⇒ Qui si apre soltanto la FINESTRA della tolleranza, e la si chiude sulla
   *   prima chiave alla misura nuova — che e' un fatto osservabile sul filo, non
   *   un orologio (rilievo P13). */
  tela_adattata(l, a) {
    /* ⛔ Prima di tutto: questo `TELA` CHIUDE un'attesa (§7.1).  Va fatto qui
       e non in fondo, perche' i fotogrammi trattenuti si rigiudicano poche
       righe piu' sotto e devono trovare il conto gia' aggiornato: se ne resta
       un'altra senza risposta si ritrattengono, se non ne resta nessuna la
       misura mai annunciata chiude — ed e' la stessa decisione di `trattieni`. */
    this.tela_risposta();
    const vecchia = this.tela_l + "x" + this.tela_a;
    if (!this.finestra) {
      /* La finestra si apre adesso: da qui in poi si tollera quel che e' stato
         in vigore, e §6.2 dice «da quando la coda ha cominciato a svuotarsi».
         ⚠ Chi trascina una finestra manda DUE `TELA` di fila (1920×1080 →
           1600×900 → 1280×720) e la chiave aperta prima di tutto porta la
           PRIMA delle tre: per questo la finestra si apre una volta sola e
           accumula, invece di ricordare «la precedente» al singolare (P11). */
      this.tollerate = new Map([[vecchia, "in vigore quando la coda ha "
                                        + "cominciato a svuotarsi"]]);
      this.finestra = true;
    } else {
      this.tollerate.set(vecchia, "in vigore dentro la finestra del cambio");
    }
    this.tela_l = l; this.tela_a = a;
    this.tollerate.set(l + "x" + a, "la tela in vigore");
    this.storiche.add(l + "x" + a);
    this.riga("TELA(ADATTATA) " + vecchia + " → " + l + "×" + a
              + ": il decodificatore NON si tocca; si riconfigurera' sulla prima "
              + "CHIAVE alla misura nuova (§5.2).  Tollerate adesso: "
              + [...this.tollerate.keys()].join(", "));
    /* I fotogrammi trattenuti perche' portavano una misura mai annunciata
       possono essere diventati legittimi proprio adesso — vedi `trattieni`. */
    const in_attesa = this.trattenuti;
    this.trattenuti = [];
    for (const t of in_attesa) this.consegna(t.i, t.dati);
  }

  /* ── IL LETTORE DEI 28 BYTE, DA `RCP.md` §6.2 ──────────────────────────
       0  u16 tipo · 2 u16 codec · 4 u32 largh. · 8 u32 altezza ·
      12  u32 numero · 16 u64 istante · 24 u32 input · 28 i dati
     ⛔ Nessun campo allineato, nessun riempimento: 28 byte esatti. */
  leggi_intestazione(byte) {
    if (byte.length < 28)
      return { guaio: "uno stream video chiuso con FIN dopo " + byte.length
             + " byte: §6.2 vuole 28 byte d'intestazione, e questo non e' un "
             + "fotogramma corto — e' una lunghezza che non torna" };
    const v = new DataView(byte.buffer, byte.byteOffset, byte.byteLength);
    return { tipo: v.getUint16(0), codec: v.getUint16(2),
             larghezza: v.getUint32(4), altezza: v.getUint32(8),
             numero: v.getUint32(12),
             /* ⚠ `istante` e' un orologio MONOTONO del server: non si confronta
                col nostro, solo con altri `istante` dello stesso server (§6.2). */
             istante: Number(v.getBigUint64(16)),
             input: v.getUint32(24) };
  }

  /* Uno stream del video, per intero.  `completo` e' falso quando lo stream e'
     stato AZZERATO (`RESET_STREAM`). */
  stream_video(byte, completo) {
    this.conti.stream++;
    if (!this.sessione)
      return this.errore_protocollo("uno stream video prima di SESSIONE: §2.5 "
        + "lo vieta, ed e' l'invariante I3 sul filo — chi non passa dal "
        + "validatore non riceve un pixel");
    if (!completo) {
      /* ⛔ §6.2: uno stream AZZERATO porta un fotogramma INCOMPLETO.  Il client
         DEVE buttare quel che ha ricevuto e NON DEVE consegnarlo al
         decodificatore: consegnare mezzo fotogramma e' la forma E8 — un
         fotogramma abbandonato e uno completo avrebbero lo stesso aspetto. */
      this.conti.azzerati++;
      this.riga("stream azzerato (RESET_STREAM) dopo " + byte.length
                + " byte: buttato, NON consegnato al decodificatore (§6.2)");
      this.buco("un fotogramma abbandonato dal server");
      return;
    }
    this.conti.completi++;
    const i = this.leggi_intestazione(byte);
    if (i.guaio) { this.conti.corti++; return this.errore_protocollo(i.guaio); }
    return this.consegna(i, byte.subarray(28));
  }

  consegna(i, dati) {
    /* 1. il tipo (§6.2): altri valori sono ERRORE_PROTOCOLLO. */
    if (i.tipo !== 0x0301 && i.tipo !== 0x0302)
      return this.errore_protocollo("tipo di fotogramma 0x" + i.tipo.toString(16)
        + ": §6.2 ammette 0x0301 (chiave) e 0x0302 (delta)");
    const chiave = i.tipo === 0x0301;

    /* 2. il codec: «DEVE essere quello negoziato in §4.3». */
    if (i.codec !== this.codec)
      return this.errore_protocollo("il fotogramma porta codec " + i.codec
        + " e il negoziato e' " + this.codec + " (" + NOME_DEL_CODEC[this.codec] + ")");

    /* 3. lo zero e' riservato (§6.2): vuol dire «nessun fotogramma». */
    if (i.numero === 0)
      return this.errore_protocollo("un fotogramma con numero 0, che §6.2 "
        + "riserva al significato «nessun fotogramma»");

    /* ⛔⭐ 4. L'ORDINE SI APPLICA PRIMA DELLA MISURA — §6.2, rilievo P14.
     *
     * «Un fotogramma il cui numero e' precedente all'ultimo gia' consegnato si
     * scarta, e la sua misura non si guarda nemmeno.»  ⚠ Senza questa
     * precedenza le due righe di §6.2 si contraddicono su una scena in cui
     * nessuno ha sbagliato: la chiave che chiude la tolleranza SCAVALCA i
     * fotogrammi in volo — perche' quello vecchio e' il piu' grosso (§5.2 vieta
     * al server di abbandonare una chiave) e quello nuovo e' piu' piccolo — e
     * la regola della misura, applicata per prima, chiuderebbe la sessione. */
    if (this.ultimo_consegnato !== null &&
        differenza(i.numero, this.ultimo_consegnato) <= 0) {
      this.conti.scartati_ordine++;
      this.riga("fotogramma " + i.numero + " scartato per ORDINE (l'ultimo "
                + "consegnato e' " + this.ultimo_consegnato + "): la sua misura "
                + i.larghezza + "×" + i.altezza + " non si guarda nemmeno (§6.2)");
      return;
    }

    /* 5. la misura. */
    const m = i.larghezza + "x" + i.altezza;
    const in_vigore = this.tela_l + "x" + this.tela_a;
    if (m !== in_vigore && !this.tollerate.has(m)) {
      /* ⛔ Le due strade, e sono opposte: una misura GIA' STATA IN VIGORE dopo
         che la tolleranza si e' chiusa e' un server che sbaglia (§6.2, «da quel
         fotogramma in poi una misura vecchia e' ERRORE_PROTOCOLLO»); una misura
         MAI IN VIGORE puo' essere il `TELA` ancora in volo — vedi `trattieni`. */
      if (this.storiche.has(m))
        return this.errore_protocollo("fotogramma " + i.numero + " alla misura "
          + m + ", che e' stata in vigore ma non lo e' piu': la tolleranza si e' "
          + "chiusa sulla prima chiave alla misura nuova, e la tela in vigore e' "
          + in_vigore + " (§6.2)");
      return this.trattieni(i, dati);
    }
    if (m !== in_vigore) {
      this.conti.tollerati++;
      this.riga("fotogramma " + i.numero + " alla misura " + m
                + ", che non e' la tela in vigore (" + in_vigore + ") ma e' "
                + this.tollerate.get(m) + ": accettato e dipinto riscalato "
                + "alla vista (§6.2)");
    }

    /* 6. il buco.  ⚠ `numero` conta i fotogrammi CATTURATI che il server ha
       deciso di spedire, compresi quelli che poi abbandona: un salto e' quindi
       un fotogramma che non arrivera' mai — chi arriva dopo cade sulla regola
       dell'ordine — e va trattato come un buco. */
    if (this.atteso !== null && differenza(i.numero, this.atteso) > 0)
      this.buco("mancano i fotogrammi da " + this.atteso + " a "
                + ((i.numero - 1) >>> 0));

    /* 7. §5.2: «finche' non arriva una chiave, il client NON DEVE mostrare
       fotogrammi che sa incompleti: tiene l'ultimo buono».  ⛔ E non li
       consegna nemmeno: un delta che riferisce un fotogramma mai arrivato non
       produce nessun errore dal decodificatore — solo un'immagine via via piu'
       sfasciata, che e' precisamente il sintomo che non nomina la causa. */
    if (this.sospeso && !chiave) {
      this.riga("delta " + i.numero + " non consegnato: c'e' un buco aperto e "
                + "si aspetta una chiave (§5.2)");
      return;
    }

    /* 8. la misura per cui il decodificatore E' configurato. */
    const dec_m = this.dec_l + "x" + this.dec_a;
    if (!this.dec || m !== dec_m) {
      if (chiave && m === in_vigore) {
        if (!this.riconfigura(i.larghezza, i.altezza)) return;
      } else {
        /* ⛔ §5.2: «il client NON DEVE consegnare al decodificatore un
           fotogramma la cui misura non e' quella per cui il decodificatore e'
           configurato: lo butta e lo tratta come un buco».  `[M]` 12 agosto
           2026: un delta alla misura nuova dato a un decodificatore configurato
           alla vecchia dipinge SPAZZATURA IN SILENZIO su HEVC. */
        this.conti.scartati_misura++;
        this.riga("fotogramma " + i.numero + " alla misura " + m
                  + " buttato: il decodificatore e' configurato per " + dec_m
                  + " e questo non e' una chiave alla tela in vigore (§5.2)");
        this.buco("una misura che il decodificatore non puo' decodificare");
        return;
      }
    }

    /* 9. la consegna. */
    try {
      this.dec.decode(new EncodedVideoChunk({
        type: chiave ? "key" : "delta", timestamp: i.istante, data: dati }));
    } catch (e) {
      this.errori.push("decode: " + e);
      this.riga("⛔ decode ha rifiutato il fotogramma " + i.numero + ": " + e);
      this.buco("il decodificatore ha rifiutato un fotogramma");
      return;
    }
    this.conti.consegnati++;
    this.ultimo_consegnato = i.numero;
    this.atteso = dopo(i.numero);
    if (chiave) {
      this.sospeso = false;
      /* ⭐ La tolleranza finisce QUI: sulla prima chiave alla misura nuova, che
         §5.2 garantisce esistere.  Da questo fotogramma in poi una misura
         vecchia e' ERRORE_PROTOCOLLO. */
      if (this.finestra && m === in_vigore) {
        this.finestra = false;
        this.tollerate = new Map([[in_vigore, "la tela in vigore"]]);
        this.riga("prima CHIAVE alla misura nuova (" + m + "): la finestra "
                  + "della tolleranza si chiude, e da qui una misura vecchia e' "
                  + "ERRORE_PROTOCOLLO (§6.2)");
      }
    }
    return true;
  }

  /* ⛔⭐ IL FOTOGRAMMA A UNA MISURA MAI ANNUNCIATA — E QUESTA E' UNA RIGA CHE
   *     `RCP.md` NON HA, scritta il 12 agosto 2026 applicando §6.2.
   *
   * §6.2 dice: «chi ne riceve altre chiude con ERRORE_PROTOCOLLO», e la
   * tolleranza che segue copre le misure VECCHIE — quelle in volo quando il
   * `TELA` e' partito.  ⛔ Non copre il caso simmetrico: il `TELA` viaggia sul
   * canale di CONTROLLO e il fotogramma su uno stream unidirezionale suo, e i
   * due sono stream QUIC indipendenti — **niente ne ordina la consegna**.  Un
   * fotogramma alla misura NUOVA puo' quindi arrivare PRIMA del `TELA` che la
   * annuncia, e applicando §6.2 alla lettera il client chiuderebbe una sessione
   * in cui nessuno ha sbagliato.  E' la stessa famiglia di P11/P13/P14, un
   * passo piu' in la'.
   *
   * ⇒ Qui il fotogramma si TRATTIENE invece di uccidere la sessione, e diventa
   *   legittimo se il `TELA` arriva subito dopo (`tela_adattata` lo ripassa).
   *
   * ⛔⭐ E IL FONDO NON E' PIU' UN NUMERO — corretto il 13 agosto 2026, rilievo
   *     P21, e questa riga qui dentro diceva **OTTO FOTOGRAMMI**.
   *
   *   `RCP.md` §6.2 e' stato riscritto quel giorno e adesso dice: «fino a
   *   quando lo trattiene non e' un numero: e' una CONDIZIONE — finche' resta
   *   una `ADATTA_TELA` che il client ha spedito e a cui nessun `TELA` ha
   *   ancora risposto.  ⛔ E se nessuna `ADATTA_TELA` e' senza risposta non si
   *   trattiene niente: una misura che il client non ha nessun motivo di
   *   aspettarsi e' `ERRORE_PROTOCOLLO` subito».
   *
   * ⛔ Otto era una GRANDEZZA SOSTITUTIVA — un fondo osservabile al posto di un
   *   orologio, che era gia' la lezione di P13, ma pur sempre un numero preso
   *   perche' sembrava largo abbastanza.  ⚠ E costava in tutt'e due i versi:
   *   con nove fotogrammi in volo dentro una corsa legittima chiudeva una
   *   sessione sana; e senza nessuna `ADATTA_TELA` in volo — cioe' SEMPRE, in
   *   RCP/1, perche' questa pagina non ne manda nessuna — teneva in vita per
   *   otto fotogrammi un server che manda una misura che non ha mai annunciato,
   *   invece di chiudere subito come §6.2 impone.
   *
   * ⚠ E il tetto in BYTE di quel che si trattiene NON c'e', ed e' dichiarato:
   *   `RCP.md` §6.2 non ne da' uno, §7.1 obbliga il server a rispondere a ogni
   *   `ADATTA_TELA` e §6.2 tetta il singolo fotogramma a 16 MiB.  ⛔ Rimetterne
   *   uno qui sarebbe rifare P21 in un'altra unita'.  `[?]` Sta al
   *   coordinatore: un server che non risponde mai al `TELA` fa crescere questa
   *   coda, e la cura vera e' una riga di `RCP.md`, non una di qui. */
  trattieni(i, dati) {
    /* ⛔ LA CONDIZIONE, PRIMA DI TUTTO: senza una `ADATTA_TELA` senza risposta
       il client non ha NESSUN motivo di aspettarsi quella misura. */
    if (this.attese_tela <= 0)
      return this.errore_protocollo("fotogramma " + i.numero + " alla misura "
        + i.larghezza + "×" + i.altezza + ", che non e' mai stata in vigore, "
        + "mentre la tela in vigore e' " + this.tela_l + "×" + this.tela_a
        + " e nessuna ADATTA_TELA e' senza risposta: non c'e' nessun TELA che "
        + "possa concederla, quindi non e' una corsa fra due stream (§6.2)");
    /* ⚠ Un fotogramma RIGIUDICATO che torna qui — perche' una seconda
       `ADATTA_TELA` e' ancora senza risposta — non si conta due volte: il
       contatore dice quanti FOTOGRAMMI sono stati trattenuti, non quante volte
       ci si e' passati. */
    if (!i.gia_trattenuto) { i.gia_trattenuto = true; this.conti.trattenuti++; }
    this.trattenuti.push({ i: i, dati: dati });
    this.riga("fotogramma " + i.numero + " alla misura " + i.larghezza + "×"
              + i.altezza + ", che non e' mai stata annunciata: TRATTENUTO ("
              + this.trattenuti.length + " in mano, " + this.attese_tela
              + " ADATTA_TELA senza risposta) invece di chiudere la sessione — "
              + "il TELA che la annuncia puo' essere ancora in volo sul canale "
              + "di controllo (§6.2)");
    return false;
  }

  /* ⛔⭐ L'`ADATTA_TELA` E' PARTITA — §6.2, e la grandezza e' «quel che il
   * client ha spedito LUI».  Chi manda il messaggio sul canale di controllo
   * chiama questa, e da qui in poi una misura mai annunciata si TRATTIENE
   * invece di chiudere.
   *
   * ⚠ In RCP/1 non la chiama nessuno, ed e' detto invece che taciuto: la voce
   *   «adatta il desktop a questa finestra» e' di `SPECIFICHE.md` §6.4 e questa
   *   pagina non ce l'ha ancora.  ⛔ Finche' non c'e', `attese_tela` vale zero
   *   sempre, e il ramo giusto e' quello che chiude — che e' esattamente quel
   *   che §6.2 vuole.  La riga sta qui perche' il giorno in cui la voce si
   *   accende il contatore non venga dimenticato: senza, il primo utente che
   *   trascina la finestra si vedrebbe chiudere la sessione. */
  adatta_tela_chiesta() {
    this.attese_tela++;
    this.riga("ADATTA_TELA spedita: le richieste senza risposta sono adesso "
              + this.attese_tela + " — da qui una misura mai annunciata si "
              + "trattiene invece di chiudere (§6.2)");
  }

  /* ⛔ Una `TELA` RISPONDE a un'`ADATTA_TELA`, riuscita o no (§7.1: «a ogni
     `ADATTA_TELA` il server DEVE rispondere con un `TELA`»), e il canale di
     controllo e' uno solo, affidabile e ordinato (§4.2) ⇒ l'n-esimo `TELA`
     risponde all'n-esima `ADATTA_TELA`.  ⚠ Il conto non scende sotto zero: un
     `TELA` non richiesto e' un difetto del server, e sottrarre lo farebbe
     diventare un CREDITO per il prossimo trattenimento. */
  tela_risposta() {
    if (this.attese_tela > 0) this.attese_tela--;
    else this.riga("⚠ un TELA senza nessuna ADATTA_TELA in attesa: il conto "
                   + "resta a zero (§7.1 dice che ogni TELA risponde a una "
                   + "ADATTA_TELA, e questa non c'e' mai stata)");
  }

  /* ⛔⭐ `TELA(RIFIUTATA)` — §6.2: «un `TELA(RIFIUTATA)` chiude l'attesa quanto
   * un `TELA(ADATTATA)`: il trattenuto si rigiudica contro la tela rimasta in
   * vigore, e di norma e' `ERRORE_PROTOCOLLO` — il server ha spedito una misura
   * che non ha mai avuto».
   *
   * ⚠ Prima di oggi questo ramo non esisteva: la pagina scriveva la riga nel
   *   registro e basta, e i fotogrammi trattenuti restavano in mano PER SEMPRE
   *   — l'attesa non si chiudeva piu' e la memoria non si liberava piu'.  ⛔ Il
   *   sintomo sarebbe stato «ho chiesto di adattare il desktop, il server ha
   *   detto di no, e da quel momento lo schermo non si e' piu' mosso». */
  tela_rifiutata() {
    this.tela_risposta();
    if (!this.trattenuti.length) return;
    const in_attesa = this.trattenuti;
    this.trattenuti = [];
    this.riga("TELA(RIFIUTATA): l'attesa si chiude lo stesso, e i "
              + in_attesa.length + " fotogrammi trattenuti si rigiudicano "
              + "contro la tela rimasta in vigore (" + this.tela_l + "×"
              + this.tela_a + ") — §6.2");
    for (const t of in_attesa) this.consegna(t.i, t.dati);
  }

  riconfigura(l, a) {
    const config = { codec: this.stringa, codedWidth: l, codedHeight: a,
                     optimizeForLatency: true };
    try {
      /* ⛔⭐ E UN DECODIFICATORE CHIUSO NON SI RICONFIGURA — 12 agosto 2026.
       * Dopo un errore, `VideoDecoder` passa a `closed` e ogni `configure()`
       * lancia `InvalidStateError`.  ⚠ Senza questa riga, il primo errore del
       * decodificatore rendeva la sessione irrecuperabile IN SILENZIO: la
       * chiave chiesta a §5.2 arrivava e non poteva piu' essere consegnata, e il
       * sintomo era «lo schermo si e' fermato e nessuno dice perche'». */
      if (this.dec && this.dec.state === "closed") {
        this.riga("il decodificatore era chiuso (un errore lo ha chiuso): se ne "
                  + "fa uno nuovo, invece di riconfigurare quello morto");
        this.dec = null;
      }
      if (!this.dec) {
        this.dec = new VideoDecoder({
          output: (f) => this.dipingi(f),
          error: (e) => {
            this.errori.push(String(e));
            this.riga("⛔ il decodificatore ha detto: " + e);
            this.buco("il decodificatore ha fallito");
          },
        });
      }
      this.dec.configure(config);
    } catch (e) {
      this.errori.push("configure: " + e);
      this.riga("⛔ configure(«" + this.stringa + "», " + l + "×" + a
                + ") ha lanciato: " + e);
      return false;
    }
    this.conti.riconfigurazioni++;
    this.dec_l = l; this.dec_a = a;
    this.riga("decodificatore configurato per " + l + "×" + a + " con «"
              + this.stringa + "» (riconfigurazione n. "
              + this.conti.riconfigurazioni + ")");
    return true;
  }

  /* ⛔ Si dipinge DENTRO il richiamo del decodificatore e non su
     `requestAnimationFrame`: `web.md` §6.1.  Un giro di rAF in mezzo aggiunge
     fino a un intervallo di quadro a un tetto che ne vale due e mezzo. */
  dipingi(f) {
    /* ⛔⭐⭐ ANCORA `F4-CODA-DEL-DECODIFICATORE` — INIZIO.
     *
     * ⛔⛔ IL DIFETTO, MISURATO: **niente butta il di piu', e il ritardo cresce
     *     senza limite.**  `[M]` 14 agosto 2026, anello O2, banco `04-b30`,
     *     scena in movimento a 58 disegni/s:
     *
     *       il server CONSEGNA          39,6 fotogrammi/s
     *       la pagina DIPINGE           34,7 fotogrammi/s
     *       ⇒ avanzo                     ~5/s, e **nessuno lo butta**
     *       `scartati_ordine` 0 · `trattenuti` 0 · `corti` 0
     *
     *     ⇒ Il ritardo fra `decode()` e il richiamo del decodificatore sale di
     *       **~108 ms al secondo**: `[M]` 31,6 ms dopo 1 s · 1 461 ms dopo 11 s
     *       · 2 787 dopo 22 s · **4 650 ms dopo 43 s**.  ⛔ Dopo un minuto
     *       l'utente comanda un desktop che ha visto sei secondi fa, e nessun
     *       registro lo dice: i conti dei fotogrammi sono tutti verdi.
     *
     * ⛔ E IL COSTO CHE LO PRODUCE STA PROPRIO IN QUESTA FUNZIONE: `[M]` il
     *    primo `drawImage` — quello che porta il `VideoFrame` nel deposito —
     *    costa **34,03 ms** di mediana, e il secondo (`componi`, deposito →
     *    tela visibile) **0,08 ms**.  ⇒ 425 volte tanto: il tratto che la
     *    fase 3 chiamava «il disegno» e' per il 99,8 % **attesa**, e a 34 ms
     *    per fotogramma questa pagina non puo' superare i 29/s.
     *
     * ⭐ LA CURA, e non chiede una chiave: **si salta il DISEGNO, non la
     *    decodifica.**  Se dietro a questo fotogramma ce ne sono gia' altri in
     *    coda, disegnarlo vuol dire spendere 34 ms per mostrare un'immagine
     *    che e' gia' vecchia.  ⇒ Si chiude e si passa al successivo: il
     *    decodificatore continua a decodificare tutto (la catena dei delta
     *    NON si rompe, nessun buco, nessuna `RICHIEDI_CHIAVE`) e l'utente vede
     *    sempre **l'ultimo** fotogramma invece del primo di una coda.
     *
     * ⚠ E la soglia e' 2, non 0: `[M]` in regime sano la coda vale ~1
     *   fotogramma (31,6 ms a 33/s) perche' il decodificatore hardware tiene
     *   una pipeline sua.  Con la soglia a 0 si butterebbe meta' del ritmo per
     *   un'attesa che non e' un ritardo.
     * ⛔ E il conto si tiene: un fotogramma buttato in silenzio e' un ritmo che
     *   cala senza che nessuno sappia perche' (`I1` vuole che ogni discesa sia
     *   dichiarata). */
    if (this.dec && this.dec.decodeQueueSize > 2) {
      this.conti.saltati_coda++;
      try { f.close(); } catch (e) { /* gia' chiuso */ }
      return;
    }
    /* ⬆⬆ ANCORA `F4-CODA-DEL-DECODIFICATORE` — FINE. */
    /* ⚠ `VideoFrame.format` si registra e NON si interpreta.  `[M]` 12 agosto
       2026: su Chrome con VA-API un fotogramma HEVC esce `BGRA` — che non dice
       che i 10 bit siano persi, dice come Chrome PRESENTA una tessitura di GPU;
       su Firefox e' `BGRX` per tutto; su Chrome un AV1 a 10 bit veri esce
       `I420P10`, ed e' l'unico percorso in cui i 10 bit si vedono da
       JavaScript.  ⇒ La domanda ha risposta MOTORE PER MOTORE, e questa riga
       serve a chi diagnostica, non a chi decide. */
    if (this.formato === null || this.formato === undefined)
      this.formato = (f.format === undefined) ? "assente" : f.format;
    /* ⛔ Il fotogramma si DEPOSITA alla sua misura nativa, e il riscalamento
       alla vista lo fa `componi()` — che e' la stessa funzione che gira quando
       l'utente ridimensiona la finestra.  ⚠ Riscalare qui e ricomporre la'
       sarebbero due riscalamenti sotto la stessa etichetta, e il giorno in cui
       divergessero il sintomo sarebbe «l'immagine cambia misura quando tocco la
       finestra» — la forma E2 di `REVIEWER.md`. */
    const fl = f.displayWidth || f.codedWidth;
    const fa = f.displayHeight || f.codedHeight;
    try {
      if (!this.deposito) this.deposito = document.createElement("canvas");
      if (this.deposito.width !== fl || this.deposito.height !== fa) {
        this.deposito.width = fl; this.deposito.height = fa;
        this.deposito_p = this.deposito.getContext("2d", { alpha: false });
      }
      this.deposito_p.drawImage(f, 0, 0);
    } catch (e) {
      this.errori.push("deposito: " + e);
      this.riga("⛔ il fotogramma non e' entrato nel deposito: " + e);
      try { f.close(); } catch (e2) { /* gia' chiuso */ }
      return;
    }
    try { f.close(); } catch (e) { /* gia' chiuso */ }
    /* ⚠ La vista si misura QUI SOLO SE non c'e' ancora — cioe' quasi mai, e mai
       due volte.  ⛔ Misurarla a ogni fotogramma sarebbe leggere `clientWidth`
       dentro il richiamo del decodificatore: una riorganizzazione del foglio
       forzata sessanta volte al secondo, dentro il percorso che `web.md` §6.1
       tiene corto apposta.  ⇒ Dopo la prima, a rimisurarla e' l'unico fatto che
       la cambia: il ridimensionamento della finestra, in fondo al file. */
    if (this.sessione && !this.vista_l) this.adatta_vista();
    if (this.componi()) this.conti.dipinti++;
  }
}

/* ⛔⭐ LA DISPOSIZIONE DI TASTIERA, E PERCHE' NON E' `navigator.language`.
 *
 *    `[M]` 10 agosto 2026, primo giro con Firefox vero: questa riga diceva
 *    `navigator.language.slice(0,2)`, e su un browser in inglese mandava `en`.
 *    ⛔ `en` NON E' un nome di disposizione XKB — quella si chiama `us` — e
 *    `RCP.md` §4.5 impone al server di congedare con `SESSIONE_NON_SERVIBILE`
 *    una disposizione ben formata che il sistema non conosce.  Il server ha
 *    fatto esattamente quel che deve; era la PAGINA a chiedere una tastiera che
 *    non esiste, e ogni utente con un browser in inglese avrebbe visto «quella
 *    sessione non si puo' servire» senza che niente nominasse la tastiera.
 *
 * ⚠ E resta una `[?]` dichiarata: una pagina NON PUO' sapere la disposizione
 *   FISICA della tastiera di chi la guarda — la lingua dell'interfaccia e' un
 *   indizio, non un dato.  Questa tabella e' un ripiego onesto; la cura vera e'
 *   lasciar scegliere all'utente, e `SPECIFICHE.md` §7.3 e' il posto dove
 *   quella decisione andra' presa. */
function disposizione() {
  const l = (navigator.language || "it-IT").toLowerCase();
  const lingua = l.slice(0, 2);
  const regione = l.length > 3 ? l.slice(3, 5) : "";
  if (lingua === "en") {
    const per_regione = {gb: "gb", au: "us", ca: "us", nz: "us", ie: "ie", in: "us", za: "us"};
    return per_regione[regione] || "us";
  }
  /* Le lingue in cui il nome XKB coincide con il codice ISO.  ⛔ Fuori da qui
     si ripiega su `us` invece di indovinare: una disposizione sbagliata non da'
     un errore, fa uscire le lettere sbagliate. */
  const note = ["it", "de", "fr", "es", "pt", "nl", "se", "no", "dk", "fi",
                "pl", "cz", "sk", "hu", "ro", "ru", "ua", "gr", "tr", "il",
                "jp", "kr", "br", "ch", "be", "at", "si", "hr", "rs", "bg"];
  if (note.includes(lingua)) return lingua;
  if (lingua === "sv") return "se";
  if (lingua === "da") return "dk";
  if (lingua === "cs") return "cz";
  if (lingua === "el") return "gr";
  if (lingua === "he") return "il";
  if (lingua === "ja") return "jp";
  if (lingua === "ko") return "kr";
  if (lingua === "uk") return "ua";
  return "us";
}

/* ⛔ L'impronta si RITIRA prima di ogni tentativo (§4.1-bis). Se il ritiro
   fallisce si usa quella servita con la pagina, e LO SI DICE: un ripiego
   silenzioso produce due comportamenti sotto la stessa etichetta. */
async function impronta() {
  try {
    const r = await fetch("/impronta", { cache: "no-store" });
    if (!r.ok) throw new Error("stato " + r.status);
    const j = await r.json();
    if (j.impronta && j.impronta !== IMPRONTA_SERVITA) {
      nota("impronta: il certificato e' stato ruotato da quando questa pagina e' stata servita — si usa quella nuova");
    }
    return j.impronta || IMPRONTA_SERVITA;
  } catch (e) {
    nota("impronta: /impronta non risponde (" + e.message + "): si usa quella servita con la pagina");
    return IMPRONTA_SERVITA;
  }
}

/* ⛔ Il congedo della sessione in corso, visibile a chi raccoglie le eccezioni:
   un'eccezione a meta' stretta di mano — «messaggio oltre 1 MiB», un corpo
   troncato — e' «qualcosa che non capisco», e §3 impone di chiudere con
   `ERRORE_PROTOCOLLO` invece di tacere.  ⚠ Prima di stanotte quel ramo era un
   `esito(...)` e basta (rilievo B-4). */
let congeda_corrente = null;

/* ⛔⭐ E QUANDO L'UTENTE CHIUDE LA SCHEDA, LA PAGINA SI CONGEDA — §8.1, §8.2
 *     `CHIUSO_DALL_UTENTE` 0x01.  Misurato mancante l'11 agosto 2026, banco P5,
 *     su TUTT'E DUE i motori.
 *
 * ⛔ Prima di questa riga non c'era NESSUN gestore di `pagehide`: chiudendo la
 *    scheda — che e' il modo piu' comune di andarsene — la pagina spariva senza
 *    dire niente, e a liberare il posto era il tetto d'inattivita' di 30 s.
 *    ⚠ Il sintomo, per chi usa il prodotto, non e' un errore: e' che per mezzo
 *    minuto un altro dispositivo si sente rispondere «sei gia' collegato» — ed
 *    e' esattamente il difetto 6 di B11, che li' era stato curato per la sola
 *    chiusura VOLONTARIA dentro la pagina.
 *
 * ⚠ `pagehide` e non `beforeunload`: il secondo puo' essere ignorato, puo'
 *   fermare la chiusura con una domanda all'utente, e su mobile spesso non
 *   arriva.  `pagehide` arriva anche quando la scheda finisce nella cache
 *   avanti/indietro.
 *
 * ⛔ E NON si aspetta: dentro `pagehide` il tempo e' quello che il browser
 *    concede, non quello che chiediamo.  `congeda()` spedisce il `CONGEDO` e
 *    poi chiude la sessione col codice — e sono le DUE strade di §3.1, di cui
 *    la seconda arriva anche quando la prima viene buttata via.  `[M]` 10
 *    agosto, difetto 2 di B11: Chrome butta un messaggio spedito subito prima
 *    di chiudere, quindi qui la strada che regge e' il codice di chiusura. */
window.addEventListener("pagehide", function () {
  if (congeda_corrente)
    congeda_corrente(MOT.CHIUSO_DALL_UTENTE, "la scheda e' stata chiusa");
});

/* ⛔⭐ LO SCHERMO ESISTE PRIMA DELLA SESSIONE, ed e' la forma che il banco
 *     pretende: `banchi/02-pagina-prodotto.html` guida QUESTO oggetto — cioe'
 *     il percorso del prodotto — invece di riscriversene uno che gli somiglia.
 *     ⚠ Un banco che misurasse una copia della catena misurerebbe la copia
 *       (forma E10), e il verde non direbbe niente del prodotto.
