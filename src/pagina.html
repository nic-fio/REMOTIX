<!doctype html>
<!--
  pagina.html — la pagina di REMOTIX_V2 alla fase 1.

  ⛔ IL SERVER CI SCRIVE DENTRO DUE COSE, MENTRE LA SERVE:

      __IMPRONTA__   l'impronta SHA-256 (base64, del DER) del certificato di
                     SESSIONE corrente — `RCP.md` §4.1-bis,
                     `serverCertificateHashes`.  E' il modello di fiducia del
                     prodotto, non un aggiramento: e' la leva che i browser
                     espongono proprio per i server senza dominio.
      __AVVISO__     vuoto quasi sempre.  ⛔ Quando l'indirizzo e' bannato
                     (§4.4-bis) porta la frase che lo dice: «la pagina si carica
                     lo stesso e dice che i tentativi sono esauriti.  Mai un
                     silenzio: chi e' bannato per errore e' quasi sempre il
                     proprietario».
      __BANNATO__    `si` oppure `no`, sul `<body>`.
      __RESTANO_MS__ i millisecondi che mancano alla scadenza del ban, `0` se
                     non c'e'.

  ⛔⭐ I DUE ULTIMI SONO DEL 10 AGOSTO 2026 NOTTE, rilievo R12.2, e non sono un
      ornamento: sono la forma in cui l'altra meta' del progetto scrive gia'
      questo stesso fatto, e che `banchi/01-b8-cronometro.py` legge per giudicare
      §4.4-bis.  ⛔ Questa pagina non ne aveva nessuno: puntato qui, il banco
      avrebbe dato tre rossi su un server che il ban lo fa.  ⚠ Averne due forme
      sarebbe la forma E2 di `REVIEWER.md` — due comportamenti sotto la stessa
      etichetta.

  ⛔ E LA FRASE DEL BAN SI LEGGE SENZA JAVASCRIPT.  §4.4-bis vuole che chi e'
     bannato LEGGA perche'; prima di stanotte l'avviso stava in un `<div hidden>`
     e a togliergli `hidden` era uno script.  Adesso lo scopre il CSS, guardando
     `body[data-bannato]` — e il testo del server non entra piu' in nessuna
     stringa JavaScript (rilievo B-9).

  ⚠ E la pagina RITIRA l'impronta aggiornata da `/impronta` prima di ogni
    tentativo: una scheda lasciata aperta due settimane ha in mano l'impronta di
    un certificato gia' ruotato, e il sintomo sarebbe «non si collega piu' e non
    dice perche'» (§4.1-bis, e delle due cure e' quella scelta).

  ⛔ NIENTE RISORSE ESTERNE.  La pagina e' servita isolata fra origini
     (`SPECIFICHE.md` §11.5) con `Cross-Origin-Embedder-Policy: require-corp`:
     ogni sotto-risorsa dovrebbe dichiarare a sua volta la sua politica, e la
     cura piu' semplice e' non averne.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem;
         display: flex; justify-content: center; }
  main { width: 100%; max-width: 34rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; }
  label { display: block; margin: .8rem 0 .2rem; font-size: .9rem; }
  input { width: 100%; padding: .55rem; font-size: 1rem; box-sizing: border-box; }
  button { margin-top: 1.2rem; padding: .6rem 1.4rem; font-size: 1rem; }
  #esito { margin-top: 1.5rem; font-size: 1.05rem; min-height: 1.5em; }
  #esito.bene { color: #1a7f37; }
  #esito.male { color: #b3261e; }
  /* ⛔ Lo scopre il CSS e non JavaScript: §4.4-bis vuole che chi e' bannato
     LEGGA perche', e una pagina che dipende da uno script per mostrare il
     rifiuto lo dice solo a chi lo script lo esegue.
     ⛔⭐ E si guarda se il riquadro e' VUOTO, invece di scrivere un selettore
         d'attributo sul `data-bannato` del `<body>`.  `[M]` 10 agosto 2026
         notte, primo giro sul server intero: quel selettore metterebbe nel
         documento — dentro il `<style>`, cioe' PRIMA del `<body>` — la stessa
         stringa che il misuratore di §4.4-bis cerca, e il misuratore legge la
         PRIMA che trova: diceva «bannato» anche su un indirizzo libero.
         ⚠ Un difetto che la cura di R12.2 si era portata dietro da sola, e che
           si e' visto solo accendendo il server.  ⛔ Per la stessa ragione qui
           dentro la stringa non si scrive nemmeno per spiegarla: un commento e'
           byte serviti al browser quanto il resto. */
  #avviso { padding: .8rem; border: 1px solid currentColor;
            color: #b3261e; margin-bottom: 1.2rem; font-size: .95rem; }
  #avviso:empty { display: none; }
  #registro { margin-top: 1.5rem; font-family: ui-monospace, monospace;
              font-size: .8rem; white-space: pre-wrap; opacity: .8; }
  .nota { font-size: .8rem; opacity: .7; margin-top: 2rem; }
</style>
</head>
<body data-bannato="__BANNATO__" data-restano-ms="__RESTANO_MS__">
<main>
  <h1>REMOTIX</h1>
  <div id="avviso">__AVVISO__</div>

  <form id="modulo">
    <label for="utente">Utente</label>
    <input id="utente" name="utente" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="parola">Parola d'ordine</label>
    <input id="parola" name="parola" type="password" autocomplete="current-password" required>
    <button type="submit" id="vai">Collegati</button>
  </form>

  <div id="esito"></div>
  <div id="registro"></div>
  <p class="nota">Fase 1: la stretta di mano. Niente schermo, niente tastiera — ancora.</p>
</main>

<script>
"use strict";

/* ⛔ L'impronta che il SERVER ha scritto qui dentro mentre serviva la pagina.
   ⚠ E' l'UNICO testo del server che entra in una stringa JavaScript, ed e' un
     base64 che scriviamo noi.  ⛔ La frase del ban invece NON entra piu': prima
     del 10 agosto 2026 notte ci finiva dentro senza nessuna neutralizzazione
     (rilievo B-9), e finche' il testo lo decidevamo noi era solo fragile.  Il
     giorno in cui ci fosse finito un dato che non decidiamo noi, quella riga
     era un'iniezione.  Adesso lo stato del ban si legge dal `<body>`. */
const IMPRONTA_SERVITA = "__IMPRONTA__";
const BANNATO = document.body.dataset.bannato === "si";

const $ = (i) => document.getElementById(i);
const righe = [];
function nota(t) { righe.push(t); $("registro").textContent = righe.join("\n"); }
function esito(t, bene) { const e = $("esito"); e.textContent = t; e.className = bene ? "bene" : "male"; }

/* ⚠ La frase del ban la mostra gia' il CSS, senza di noi.  Questa riga aggiunge
   solo l'esito in cima al modulo, per chi guarda li' e non piu' su. */
if (BANNATO) esito("Da questo indirizzo i tentativi di accesso sono esauriti: vedi l'avviso qui sopra.", false);

/* ── I byte di RCP (RCP.md §6.0 e §6.1) ────────────────────────────────────
   ⛔ Ordine dei byte: rete (big-endian).  Nessun campo allineato, nessun
      riempimento: «un byte in piu' che fa tornare i conti in una struttura C e'
      la forma esatta del difetto corretto in §6.2».                          */

const TIPO = {
  CIAO: 0x0001, ECCOMI: 0x0002, CREDENZIALI: 0x0003, AMMESSO: 0x0004,
  RESPINTO: 0x0005, ATTACCA: 0x0006, SESSIONE: 0x0007, CONGEDO: 0x000C,
};

/* La versione maggiore di RCP che questa pagina sa parlare — §9.  ⛔ Si scrive
   UNA volta: e' quella che va nel `CIAO` ed e' quella che si pretende
   nell'`ECCOMI`, e due numeri per la stessa cosa sono due numeri che possono
   divergere (rilievo B-5). */
const VERSIONE = 1;

/* ⛔ I motivi di §8.2 che QUESTA PAGINA emette.  Sono i codici della tabella
   `MOTIVO` qui sotto, dati per nome: un numero scritto a mano in un ramo
   d'errore e' un numero che nessuno rilegge (rilievo B-4). */
const MOT = {
  CHIUSO_DALL_UTENTE: 0x01,
  VERSIONE_INCOMPATIBILE: 0x0A,
  ERRORE_PROTOCOLLO: 0x0B,
};

/* I motivi di §8.2, in parole.  ⛔ `RCP.md` §8.2 e `SPECIFICHE.md`: all'utente
   si dice PERCHE', con una frase e non con un numero. */
const MOTIVO = {
  0x01: "la sessione e' stata chiusa dall'utente",
  0x02: "silenzio troppo lungo: la sessione e' scaduta",
  0x03: "la sessione e' stata abbandonata",
  0x04: "ha prevalso la sessione locale su quella macchina",
  0x05: "quell'utente e' gia' collegato localmente",
  0x06: "il server e' pieno",
  0x07: "utente o parola d'ordine non corretti",
  /* ⛔ Niente numeri qui dentro — rilievo R12.9b, 10 agosto 2026 notte.  Questa
     riga diceva «riprova fra dodici ore», ed era FALSA per chiunque non fosse
     stato bannato in quell'istante: a chi ne restano due dice dodici.  ⚠ E le
     due frasi convivevano nella STESSA pagina, perche' l'avviso del `<div>` le
     ore residue le porta davvero — due comportamenti sotto la stessa etichetta,
     dentro un solo documento.  ⭐ Le ore che mancano le sa il server e le
     scrive nell'avviso; qui si dice solo il fatto. */
  0x08: "i tentativi da questo indirizzo sono esauriti: ricarica la pagina per sapere quanto manca, o sblocca l'indirizzo dal server",
  0x09: "il server e questa pagina non hanno niente in comune da parlare",
  0x0A: "versione del protocollo incompatibile",
  0x0B: "errore di protocollo",
  0x0C: "il server si sta spegnendo",
  0x0D: "tempo scaduto durante la stretta di mano",
  0x0E: "quella sessione non si puo' servire",
  0x0F: "quell'utente e' gia' collegato da un altro dispositivo",
};

class Scrittore {
  constructor() { this.b = []; }
  u8(v)  { this.b.push(v & 0xff); return this; }
  u16(v) { this.b.push((v >> 8) & 0xff, v & 0xff); return this; }
  u32(v) { this.b.push((v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff); return this; }
  /* stringa = u16 lunghezza + i byte UTF-8, SENZA terminatore (§6.0) */
  str(t)  { const d = new TextEncoder().encode(t); this.u16(d.length); for (const x of d) this.b.push(x); return this; }
  byte()  { return new Uint8Array(this.b); }
}

/* L'inquadratura di §6.1: u16 tipo, u32 lunghezza, corpo. */
function inquadra(tipo, corpo) {
  const m = new Uint8Array(6 + corpo.length);
  const v = new DataView(m.buffer);
  v.setUint16(0, tipo);
  v.setUint32(2, corpo.length);
  m.set(corpo, 6);
  return m;
}

class Lettore {
  constructor(d) { this.v = new DataView(d.buffer, d.byteOffset, d.byteLength); this.o = 0; }
  u8()  { return this.v.getUint8(this.o++); }
  u16() { const x = this.v.getUint16(this.o); this.o += 2; return x; }
  u32() { const x = this.v.getUint32(this.o); this.o += 4; return x; }
  str() { const n = this.u16(); const d = new Uint8Array(this.v.buffer, this.v.byteOffset + this.o, n); this.o += n; return new TextDecoder().decode(d); }
  resta() { return this.v.byteLength - this.o; }
}

/* Il lettore del canale di controllo: accumula e restituisce un messaggio alla
   volta.  ⛔ La lunghezza si controlla PRIMA di allocare (§6.1). */
class Canale {
  constructor(stream) {
    this.lettore = stream.readable.getReader();
    this.scrittore = stream.writable.getWriter();
    this.buf = new Uint8Array(0);
  }
  async manda(tipo, corpo) { await this.scrittore.write(inquadra(tipo, corpo)); }
  async ricevi() {
    for (;;) {
      if (this.buf.length >= 6) {
        const v = new DataView(this.buf.buffer, this.buf.byteOffset, this.buf.byteLength);
        const tipo = v.getUint16(0), lung = v.getUint32(2);
        if (lung > 1024 * 1024) throw new Error("messaggio oltre 1 MiB: il server viola §6.1");
        if (this.buf.length >= 6 + lung) {
          const corpo = this.buf.slice(6, 6 + lung);
          this.buf = this.buf.slice(6 + lung);
          return { tipo, corpo };
        }
      }
      const { value, done } = await this.lettore.read();
      if (done) return null;
      const n = new Uint8Array(this.buf.length + value.length);
      n.set(this.buf); n.set(value, this.buf.length);
      this.buf = n;
    }
  }
}

function base64ABytes(b64) {
  const s = atob(b64);
  const d = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) d[i] = s.charCodeAt(i);
  return d;
}

/* ⛔⭐ LA DISPOSIZIONE DI TASTIERA, E PERCHE' NON E' `navigator.language`.
 *
 *    `[M]` 10 agosto 2026, primo giro con Firefox vero: questa riga diceva
 *    `navigator.language.slice(0,2)`, e su un browser in inglese mandava `en`.
 *    ⛔ `en` NON E' un nome di disposizione XKB — quella si chiama `us` — e
 *    `RCP.md` §4.5 impone al server di congedare con `SESSIONE_NON_SERVIBILE`
 *    una disposizione ben formata che il sistema non conosce.  Il server ha
 *    fatto esattamente quel che deve; era la PAGINA a chiedere una tastiera che
 *    non esiste, e ogni utente con un browser in inglese avrebbe visto «quella
 *    sessione non si puo' servire» senza che niente nominasse la tastiera.
 *
 * ⚠ E resta una `[?]` dichiarata: una pagina NON PUO' sapere la disposizione
 *   FISICA della tastiera di chi la guarda — la lingua dell'interfaccia e' un
 *   indizio, non un dato.  Questa tabella e' un ripiego onesto; la cura vera e'
 *   lasciar scegliere all'utente, e `SPECIFICHE.md` §7.3 e' il posto dove
 *   quella decisione andra' presa. */
function disposizione() {
  const l = (navigator.language || "it-IT").toLowerCase();
  const lingua = l.slice(0, 2);
  const regione = l.length > 3 ? l.slice(3, 5) : "";
  if (lingua === "en") {
    const per_regione = {gb: "gb", au: "us", ca: "us", nz: "us", ie: "ie", in: "us", za: "us"};
    return per_regione[regione] || "us";
  }
  /* Le lingue in cui il nome XKB coincide con il codice ISO.  ⛔ Fuori da qui
     si ripiega su `us` invece di indovinare: una disposizione sbagliata non da'
     un errore, fa uscire le lettere sbagliate. */
  const note = ["it", "de", "fr", "es", "pt", "nl", "se", "no", "dk", "fi",
                "pl", "cz", "sk", "hu", "ro", "ru", "ua", "gr", "tr", "il",
                "jp", "kr", "br", "ch", "be", "at", "si", "hr", "rs", "bg"];
  if (note.includes(lingua)) return lingua;
  if (lingua === "sv") return "se";
  if (lingua === "da") return "dk";
  if (lingua === "cs") return "cz";
  if (lingua === "el") return "gr";
  if (lingua === "he") return "il";
  if (lingua === "ja") return "jp";
  if (lingua === "ko") return "kr";
  if (lingua === "uk") return "ua";
  return "us";
}

/* ⛔ L'impronta si RITIRA prima di ogni tentativo (§4.1-bis). Se il ritiro
   fallisce si usa quella servita con la pagina, e LO SI DICE: un ripiego
   silenzioso produce due comportamenti sotto la stessa etichetta. */
async function impronta() {
  try {
    const r = await fetch("/impronta", { cache: "no-store" });
    if (!r.ok) throw new Error("stato " + r.status);
    const j = await r.json();
    if (j.impronta && j.impronta !== IMPRONTA_SERVITA) {
      nota("impronta: il certificato e' stato ruotato da quando questa pagina e' stata servita — si usa quella nuova");
    }
    return j.impronta || IMPRONTA_SERVITA;
  } catch (e) {
    nota("impronta: /impronta non risponde (" + e.message + "): si usa quella servita con la pagina");
    return IMPRONTA_SERVITA;
  }
}

/* ⛔ Il congedo della sessione in corso, visibile a chi raccoglie le eccezioni:
   un'eccezione a meta' stretta di mano — «messaggio oltre 1 MiB», un corpo
   troncato — e' «qualcosa che non capisco», e §3 impone di chiudere con
   `ERRORE_PROTOCOLLO` invece di tacere.  ⚠ Prima di stanotte quel ramo era un
   `esito(...)` e basta (rilievo B-4). */
let congeda_corrente = null;

async function collega(utente, parola) {
  if (!("WebTransport" in window)) {
    esito("Questo browser non ha WebTransport: serve Chrome/Edge, Firefox o Safari 26+.", false);
    return;
  }

  const b64 = await impronta();
  const url = "https://" + location.host + "/rcp/1";
  nota("apro " + url);

  /* ⛔ `allowPooling: false` e l'impronta: `RCP.md` §4.1-bis.  Con
     `serverCertificateHashes` il browser NON guarda l'eccezione — guarda
     l'impronta — ed e' l'unico meccanismo che i browser espongono per un
     server senza dominio. */
  /* Dichiarato qui e non piu' sotto: lo legge anche il gestore di `wt.closed`,
     che si registra due righe piu' avanti. */
  let congedato = false;

  const wt = new WebTransport(url, {
    allowPooling: false,
    serverCertificateHashes: [{ algorithm: "sha-256", value: base64ABytes(b64) }],
  });

  wt.closed.then((info) => {
    const c = info && info.closeCode;
    /* ⚠ Se a chiudere siamo stati NOI, il codice che torna e' il nostro e la
       frase giusta l'ha gia' scritta chi ha deciso di chiudere: sovrascriverla
       col nome generico del motivo direbbe all'utente meno di quel che gia'
       sapeva (rilievo B-4, meta' visibile). */
    if (congedato) {
      nota("sessione chiusa da questa pagina: codice 0x" + (c === undefined ? "?" : c.toString(16)));
      return;
    }
    if (c && MOTIVO[c]) esito(MOTIVO[c], false);
    nota("sessione chiusa dal server: codice " + (c === undefined ? "?" : c));
  }).catch((e) => nota("sessione chiusa con errore: " + e));

  await wt.ready;
  nota("sessione WebTransport aperta");

  /* ⛔ §4.2: il client apre il PRIMO stream bidirezionale della sessione.
     Quello e' il canale di controllo, e il suo chiudersi E' la fine della
     sessione. */
  const canale = new Canale(await wt.createBidirectionalStream());

  /* ⛔⭐ IL CONGEDO DEL CLIENT — §8.1 e §3.1, e sono DUE strade, non una.
   *     Rilievo B-4, 10 agosto 2026 notte.
   *
   * §8.1: «⛔ Chi chiude DEVE mandare `CONGEDO` con un motivo PRIMA di chiudere
   * la sessione WebTransport, e DEVE ripetere il motivo nel codice d'errore
   * applicativo della chiusura (§3.1).»  E §3: «un'implementazione RCP che
   * riceve qualcosa che non capisce DEVE chiudere la connessione con
   * `ERRORE_PROTOCOLLO` e scrivere nel registro che cosa non ha capito».
   *
   * ⛔ Prima di stanotte ogni ramo d'errore di questa funzione era un
   *    `esito(...); return;` — e sul filo non usciva NIENTE.  Nessun `CONGEDO`,
   *    nessun codice nella chiusura: la sessione restava aperta, e a chiuderla
   *    era il server dopo trenta secondi, per silenzio, con un motivo che non
   *    aveva niente a che vedere con quel che era successo.
   *
   * ⚠ Il condizionale di §3.1 punto 2 — «se il canale di controllo e' ancora
   *   utilizzabile» — non scusava niente: in tutti quei rami il canale e'
   *   aperto e la pagina ci ha appena letto sopra.
   *
   * ⭐ E i byte si fanno USCIRE prima di chiudere: si aspetta la scrittura, poi
   *    si chiude la parte scrivente del canale (il FIN, che §4.2 riconosce), e
   *    solo allora si chiude la sessione col codice.  ⛔ Chiudere subito
   *    farebbe buttare al browser i byte appena scritti — e' lo stesso difetto
   *    che il server ha pagato dal suo lato (`webtransport.c`,
   *    `chiudi_sessione`: la capsula si RIMANDA). */
  congeda_corrente = congeda;
  async function congeda(motivo, perche) {
    if (congedato) return;
    congedato = true;
    nota("CONGEDO 0x" + motivo.toString(16) + " — " + perche);
    try {
      const s = new Scrittore().u8(motivo).str(perche);
      await canale.manda(TIPO.CONGEDO, s.byte());
      await canale.scrittore.close();
    } catch (e) {
      /* ⚠ Il canale poteva essere gia' morto: e' esattamente il caso per cui
         §3.1 ha voluto DUE strade, e la seconda parte lo stesso. */
      nota("il CONGEDO non e' potuto uscire sul canale (" + e + "): il motivo "
           + "viaggia solo nel codice di chiusura (§3.1, seconda strada)");
    }
    try {
      wt.close({ closeCode: motivo, reason: perche.slice(0, 100) });
    } catch (e) {
      nota("la sessione non si e' chiusa col codice: " + e);
    }
  }

  /* ── CIAO (§4.3) ────────────────────────────────────────────────────── */
  const cap = [
    ["video.codec", "hevc,av1"],
    ["video.profondita", "8,10"],
    ["video.livello", "5.1"],
    /* ⛔ PIXEL INTERI — rilievo B-6, 10 agosto 2026 notte.  §4.3 definisce
       `video.misura_massima` come `LARGHEZZAxALTEZZA`, e sono pixel.  Questa
       riga non aveva l'arrotondamento, e su un telefono a fattore di scala 2,75
       — l'esempio che questo progetto cita due volte — `screen.width` vale 393
       e sul filo partiva «1080.75x2340.25», che non e' `LARGHEZZAxALTEZZA`.
       ⚠ Non se ne accorgeva nessuno perche' il server quel campo non lo
         leggeva affatto (rilievo B-1): due difetti che si coprivano a vicenda,
         ed e' per questo che nessun banco funzionale li vedeva.
       ⭐ Si arrotonda per DIFETTO: e' un tetto di quel che il decodificatore
          sa fare, e un tetto arrotondato per eccesso e' un tetto piu' alto del
          vero. */
    ["video.misura_massima", Math.max(1, Math.floor(screen.width * devicePixelRatio)) + "x" +
                             Math.max(1, Math.floor(screen.height * devicePixelRatio))],
    ["audio.codec", "opus,pcm"],
    ["input.tocco", "no"],
    ["appunti.testo", "si"],
    ["client.nome", "remotix-pagina 0.1.0"],
  ];
  const s = new Scrittore();
  s.u16(VERSIONE);       /* §9: la stessa che si pretende nell'ECCOMI */
  s.u16(cap.length);
  for (const [n, v] of cap) s.str(n).str(v);
  await canale.manda(TIPO.CIAO, s.byte());
  nota("CIAO mandato (" + cap.length + " capacita')");

  let m = await canale.ricevi();
  if (!m) {
    esito("Il server ha chiuso il canale senza rispondere.", false);
    await congeda(MOT.ERRORE_PROTOCOLLO, "il canale di controllo si e' chiuso senza un ECCOMI");
    return;
  }
  if (m.tipo === TIPO.CONGEDO) { const l = new Lettore(m.corpo); esito(MOTIVO[l.u8()] || "congedato", false); return; }
  if (m.tipo !== TIPO.ECCOMI) {
    esito("Il server ha risposto 0x" + m.tipo.toString(16) + " invece di ECCOMI.", false);
    await congeda(MOT.ERRORE_PROTOCOLLO, "atteso ECCOMI, arrivato il tipo 0x" + m.tipo.toString(16));
    return;
  }
  {
    const l = new Lettore(m.corpo);
    const ver = l.u16(), quante = l.u16();
    /* ⛔⭐ LA VERSIONE DI `ECCOMI` SI VERIFICA — §9, ed e' un DEVE DEL CLIENT.
     *     Rilievo B-5, 10 agosto 2026 notte.
     *
     * §9: «Il client DEVE verificare che la versione di `ECCOMI` sia una che sa
     * parlare, e congedare con `VERSIONE_INCOMPATIBILE` se non lo e' — un
     * server che risponde con una versione piu' alta di quella chiesta sta
     * sbagliando, e accettarla in silenzio e' l'indulgenza che §3 vieta.»
     *
     * ⛔ Fino a stanotte `ver` finiva in una nota diagnostica e non veniva mai
     *    confrontato con 1.  Un `ECCOMI` che dichiara la versione 2 faceva
     *    proseguire la pagina, che al messaggio dopo mandava **la parola
     *    d'ordine dell'utente** a un server che parla un protocollo che lei non
     *    conosce.
     *
     * ⚠ E' il caso SIMMETRICO di quello che il banco aveva gia' trovato nel
     *   server, dove la prima stesura accettava un `CIAO(2)` e rispondeva
     *   `ECCOMI(1)`: la cura era stata applicata a un lato solo del filo — «la
     *   forma che questo progetto paga piu' spesso» (§4.4-bis). */
    if (ver !== VERSIONE) {
      esito("Il server parla la versione " + ver + " di RCP, questa pagina la " + VERSIONE + ".", false);
      await congeda(MOT.VERSIONE_INCOMPATIBILE,
                    "ECCOMI dichiara la versione " + ver + ", il CIAO chiedeva la " + VERSIONE);
      return;
    }
    const scelte = [];
    for (let i = 0; i < quante; i++) scelte.push(l.str() + "=" + l.str());
    nota("ECCOMI: versione " + ver + " — " + scelte.join(" · "));
  }

  /* ── CREDENZIALI (§4.4) ─────────────────────────────────────────────── */
  await canale.manda(TIPO.CREDENZIALI, new Scrittore().str(utente).str(parola).byte());
  nota("CREDENZIALI mandate (la parola non compare in nessun registro)");

  m = await canale.ricevi();
  if (!m) {
    esito("Il server ha chiuso il canale senza rispondere alle credenziali.", false);
    await congeda(MOT.ERRORE_PROTOCOLLO, "il canale si e' chiuso senza rispondere a CREDENZIALI");
    return;
  }
  if (m.tipo === TIPO.RESPINTO) {
    const l = new Lettore(m.corpo);
    const mot = l.u8();
    esito(MOTIVO[mot] || ("respinto, motivo 0x" + mot.toString(16)), false);
    /* ⛔ §4.4: «il client NON DEVE riprovare sulla stessa connessione: per un
       secondo tentativo se ne apre una nuova».  E l'unica cosa che gli resta
       da dire e' CONGEDO — che §8.1 gli IMPONE quando e' lui a chiudere; qui
       chiude il server, quindi si tace. */
    return;
  }
  if (m.tipo === TIPO.CONGEDO) { const l = new Lettore(m.corpo); esito(MOTIVO[l.u8()] || "congedato", false); return; }
  if (m.tipo !== TIPO.AMMESSO) {
    esito("Il server ha risposto 0x" + m.tipo.toString(16) + " invece di AMMESSO.", false);
    await congeda(MOT.ERRORE_PROTOCOLLO, "atteso AMMESSO o RESPINTO, arrivato il tipo 0x" + m.tipo.toString(16));
    return;
  }
  nota("AMMESSO");

  /* ── ATTACCA (§4.5) ─────────────────────────────────────────────────── */
  /* ⛔ I limiti sono normativi: fra 320×240 e 7680×4320, ed entrambe PARI. */
  const pari = (n, min, max) => Math.max(min, Math.min(max, n - (n % 2)));
  const tela_l = pari(1920, 320, 7680), tela_a = pari(1080, 240, 4320);
  const vista_l = Math.max(1, Math.round(innerWidth * devicePixelRatio));
  const vista_a = Math.max(1, Math.round(innerHeight * devicePixelRatio));
  const disp = disposizione();
  await canale.manda(TIPO.ATTACCA,
    new Scrittore().u32(tela_l).u32(tela_a).u32(vista_l).u32(vista_a).str(disp).byte());
  nota("ATTACCA: tela " + tela_l + "×" + tela_a + ", vista " + vista_l + "×" + vista_a + ", disposizione «" + disp + "»");

  m = await canale.ricevi();
  if (!m) {
    esito("Il server ha chiuso il canale senza rispondere ad ATTACCA.", false);
    await congeda(MOT.ERRORE_PROTOCOLLO, "il canale si e' chiuso senza rispondere ad ATTACCA");
    return;
  }
  if (m.tipo === TIPO.CONGEDO) { const l = new Lettore(m.corpo); esito(MOTIVO[l.u8()] || "congedato", false); return; }
  if (m.tipo !== TIPO.SESSIONE) {
    esito("Il server ha risposto 0x" + m.tipo.toString(16) + " invece di SESSIONE.", false);
    await congeda(MOT.ERRORE_PROTOCOLLO, "attesa SESSIONE, arrivato il tipo 0x" + m.tipo.toString(16));
    return;
  }
  {
    const l = new Lettore(m.corpo);
    const stato = l.u8(), tl = l.u32(), ta = l.u32(), desktop = l.str();
    /* ⛔ §4.5: «la tela concessa puo' essere diversa da quella chiesta […] il
       client DEVE adattarsi riscalando».  Alla fase 1 non c'e' niente da
       riscalare — non arriva un pixel — ma la differenza si DICE: e' la sola
       riga che, alla fase 2, spieghera' perche' l'immagine non e' quella
       chiesta.  ⚠ E il caso concreto e' gia' vivo: un telefono che dichiara
       `video.misura_massima` piu' piccola di 1920×1080 riceve una tela
       ridotta (rilievo B-1). */
    if (tl !== tela_l || ta !== tela_a)
      nota("⚠ la tela CONCESSA (" + tl + "×" + ta + ") non e' quella chiesta ("
           + tela_l + "×" + tela_a + "): §4.5 lo permette, e il motivo sta nel "
           + "registro del server — di solito e' video.misura_massima");
    esito("Ammesso, sessione " + (stato === 1 ? "nuova" : "ripresa") +
          ", tela " + tl + "×" + ta + ", desktop " + desktop, true);
  }
}

$("modulo").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("vai").disabled = true;
  righe.length = 0;
  esito("", true);
  congeda_corrente = null;
  try {
    await collega($("utente").value, $("parola").value);
  } catch (e) {
    esito("Non si collega: " + (e && e.message ? e.message : e), false);
    nota("eccezione: " + e);
    /* ⛔ §3: quel che non si capisce si chiude con `ERRORE_PROTOCOLLO` e si
       scrive che cosa non si e' capito — non si lascia la sessione aperta ad
       aspettare i trenta secondi del silenzio (rilievo B-4). */
    if (congeda_corrente) {
      try { await congeda_corrente(MOT.ERRORE_PROTOCOLLO, (e && e.message) ? e.message : String(e)); }
      catch (e2) { nota("nemmeno il congedo e' potuto uscire: " + e2); }
    }
  } finally {
    congeda_corrente = null;
    $("vai").disabled = false;
    /* ⛔ La parola non resta nel campo: e' la stessa regola per cui non entra
       in nessun registro (§4.4). */
    $("parola").value = "";
  }
});
</script>
