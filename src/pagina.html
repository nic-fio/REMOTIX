     *
     * §9: «Il client DEVE verificare che la versione di `ECCOMI` sia una che sa
     * parlare, e congedare con `VERSIONE_INCOMPATIBILE` se non lo e' — un
     * server che risponde con una versione piu' alta di quella chiesta sta
     * sbagliando, e accettarla in silenzio e' l'indulgenza che §3 vieta.»
     *
     * ⛔ Fino a stanotte `ver` finiva in una nota diagnostica e non veniva mai
     *    confrontato con 1.  Un `ECCOMI` che dichiara la versione 2 faceva
     *    proseguire la pagina, che al messaggio dopo mandava **la parola
     *    d'ordine dell'utente** a un server che parla un protocollo che lei non
     *    conosce.
     *
     * ⚠ E' il caso SIMMETRICO di quello che il banco aveva gia' trovato nel
     *   server, dove la prima stesura accettava un `CIAO(2)` e rispondeva
     *   `ECCOMI(1)`: la cura era stata applicata a un lato solo del filo — «la
     *   forma che questo progetto paga piu' spesso» (§4.4-bis). */
    if (ver !== VERSIONE) {
      esito("Il server parla la versione " + ver + " di RCP, questa pagina la " + VERSIONE + ".", false);
      await congeda(MOT.VERSIONE_INCOMPATIBILE,
                    "ECCOMI dichiara la versione " + ver + ", il CIAO chiedeva la " + VERSIONE);
      return;
    }
    const scelte = [];
    for (let i = 0; i < quante; i++) {
      const nome = l.str(), valore = l.str();
      scelte.push(nome + "=" + valore);
      /* ⛔ La scelta del server e' quella che conta: §4.3 — «chi sceglie e' il
         server, dentro l'intersezione, seguendo l'ordine di preferenza del
         client».  ⚠ Se ne mandasse piu' d'uno si prende il primo che questa
         pagina ha DIPINTO, e non il primo e basta: un elenco lasciato aperto
         dal server non e' un permesso di indovinare. */
      if (nome === "video.codec") scelta_codec = valore;
      if (nome === "video.profondita") scelta_profondita = valore;
    }
    nota("ECCOMI: versione " + ver + " — " + scelte.join(" · "));
  }

  /* ── CREDENZIALI (§4.4) ─────────────────────────────────────────────── */
  await canale.manda(TIPO.CREDENZIALI, new Scrittore().str(utente).str(parola).byte());
  nota("CREDENZIALI mandate (la parola non compare in nessun registro)");

  m = await canale.ricevi();
  if (!m) {
    esito("Il server ha chiuso il canale senza rispondere alle credenziali.", false);
    /* ⛔ MUTO — §4.2 e DECISIONI.md §7.14: il canale l'ha chiuso il server. */
    await congeda(MOT.ERRORE_PROTOCOLLO, "il canale si e' chiuso senza rispondere a CREDENZIALI", true);
    return;
  }
  if (m.tipo === TIPO.RESPINTO) {
    const l = new Lettore(m.corpo);
    const mot = l.u8();
    esito(MOTIVO[mot] || ("respinto, motivo 0x" + mot.toString(16)), false);
    /* ⛔ §4.4: «il client NON DEVE riprovare sulla stessa connessione: per un
       secondo tentativo se ne apre una nuova».  E l'unica cosa che gli resta
       da dire e' CONGEDO — che §8.1 gli IMPONE quando e' lui a chiudere; qui
       chiude il server, quindi si tace. */
    return;
  }
  if (m.tipo === TIPO.CONGEDO) { const l = new Lettore(m.corpo); esito(MOTIVO[l.u8()] || "congedato", false); return; }
  if (m.tipo !== TIPO.AMMESSO) {
    esito("Il server ha risposto 0x" + m.tipo.toString(16) + " invece di AMMESSO.", false);
    await congeda(MOT.ERRORE_PROTOCOLLO, "atteso AMMESSO o RESPINTO, arrivato il tipo 0x" + m.tipo.toString(16));
    return;
  }
  nota("AMMESSO");

  /* ── ATTACCA (§4.5) ─────────────────────────────────────────────────── */
  /* ⛔ I limiti sono normativi: fra 320×240 e 7680×4320, ed entrambe PARI. */
  const pari = (n, min, max) => Math.max(min, Math.min(max, n - (n % 2)));
  const tela_l = pari(1920, 320, 7680), tela_a = pari(1080, 240, 4320);
  /* ⛔ La vista si misura in UN posto solo — `misura_vista()`, la stessa che
     usa il ridimensionamento.  ⚠ Qui c'era `innerWidth × devicePixelRatio`, che
     conta anche la barra di scorrimento: si dichiarava al server una vista piu'
     larga di quella in cui si disegna davvero. */
  const [vista_l, vista_a] = misura_vista();
  const disp = disposizione();
  await canale.manda(TIPO.ATTACCA,
    new Scrittore().u32(tela_l).u32(tela_a).u32(vista_l).u32(vista_a).str(disp).byte());
  nota("ATTACCA: tela " + tela_l + "×" + tela_a + ", vista " + vista_l + "×" + vista_a + ", disposizione «" + disp + "»");

  m = await canale.ricevi();
  if (!m) {
    esito("Il server ha chiuso il canale senza rispondere ad ATTACCA.", false);
    /* ⛔ MUTO — §4.2 e DECISIONI.md §7.14: il canale l'ha chiuso il server. */
    await congeda(MOT.ERRORE_PROTOCOLLO, "il canale si e' chiuso senza rispondere ad ATTACCA", true);
    return;
  }
  if (m.tipo === TIPO.CONGEDO) { const l = new Lettore(m.corpo); esito(MOTIVO[l.u8()] || "congedato", false); return; }
  if (m.tipo !== TIPO.SESSIONE) {
    esito("Il server ha risposto 0x" + m.tipo.toString(16) + " invece di SESSIONE.", false);
    await congeda(MOT.ERRORE_PROTOCOLLO, "attesa SESSIONE, arrivato il tipo 0x" + m.tipo.toString(16));
    return;
  }
  {
    const l = new Lettore(m.corpo);
    const stato = l.u8(), tl = l.u32(), ta = l.u32(), desktop = l.str();
    /* ⛔ §4.5: «la tela concessa puo' essere diversa da quella chiesta […] il
       client DEVE adattarsi riscalando».  Alla fase 1 non c'e' niente da
       riscalare — non arriva un pixel — ma la differenza si DICE: e' la sola
       riga che, alla fase 2, spieghera' perche' l'immagine non e' quella
       chiesta.  ⚠ E il caso concreto e' gia' vivo: un telefono che dichiara
       `video.misura_massima` piu' piccola di 1920×1080 riceve una tela
       ridotta (rilievo B-1). */
    if (tl !== tela_l || ta !== tela_a) {
      nota("⚠ la tela CONCESSA (" + tl + "×" + ta + ") non e' quella chiesta ("
           + tela_l + "×" + tela_a + "): §4.5 lo permette, e il motivo sta nel "
           + "registro del server — di solito e' video.misura_massima");
      /* ⛔ E LO LEGGE ANCHE L'UTENTE, non solo chi diagnostica.  §4.5 dice che
         il client «DEVE adattarsi riscalando», e finche' l'immagine arriva
         questa e' una nota; ⚠ quando NON arriva e' la prima cosa da guardare,
         e la veglia qui sotto la ripete con dentro il tempo passato. */
      DICHIARAZIONI.video = "Il server ha concesso una tela di " + tl + "×" + ta
        + " invece dei " + tela_l + "×" + tela_a + " chiesti: il protocollo "
        + "glielo permette (§4.5) e questa pagina si adatta riscalando.";
      dichiarazione_scrivi();
    }
    esito("Ammesso, sessione " + (stato === 1 ? "nuova" : "ripresa") +
          ", tela " + tl + "×" + ta + ", desktop " + desktop, true);

    /* ── DA QUI IN POI C'E' IL VIDEO (§2.5: non prima di SESSIONE) ──────── */
    if (!scelta_codec) {
      /* ⚠ Un server che non dichiara `video.codec` non sta sbagliando: alla
         fase 1 non ne aveva.  Si dice, e non si indovina un codec. */
      nota("il server non ha dichiarato video.codec: questa sessione non ha "
         + "video, e uno stream 0x03 che arrivasse sarebbe ERRORE_PROTOCOLLO");
    } else {
      const nome = scelta_codec.split(",").find((n) => codec_buoni.includes(n));
      if (!nome) {
        await congeda(MOT.NIENTE_IN_COMUNE,
          "il server ha scelto video.codec=«" + scelta_codec + "» e questa "
          + "pagina dipinge « " + (codec_buoni.join(",") || "niente") + "»");
        esito("Il server ha scelto un codec video che questo browser non porta "
            + "ai pixel: " + scelta_codec + ".", false);
        return;
      }
      const prof = Number(scelta_profondita.split(",")
        .find((p) => profondita_buone.includes(Number(p))) || profondita_buone[0] || 8);
      /* ⛔ La stringa e' quella che la SONDA ha visto dipingere, non una scritta
         a mano: e' l'unica di cui si sappia che su questo motore arriva al
         pixel (`web.md` §9 lezione 1 — una promessa di un'API va trattata come
         la dichiarazione di un compositore). */
      const provata = sondaggio.codec[nome][prof] || sondaggio.codec[nome][8];
      schermo.negozia(CODEC_RCP[nome], prof, provata.stringa, tl, ta);
      schermo.vista(vista_l, vista_a);
      dichiara(sondaggio, { codec: nome });
      /* ⛔ E da adesso si VEGLIA il primo fotogramma: se non arriva, l'utente
         legge che cosa non sta arrivando e perche' — `CODER.md` §4.2.  Prima
         di oggi la pagina restava bianca e il motivo stava solo nel registro
         del SERVER, cioe' dall'unica parte che l'utente non puo' guardare. */
      veglia_primo_fotogramma(schermo, [tela_l, tela_a], [tl, ta], nome);
      /* §5.2: il client CHIEDE una chiave quando si accorge di un buco. */
      schermo.su_chiave = (ultimo) => {
        canale.manda(TIPO.RICHIEDI_CHIAVE, new Scrittore().u32(ultimo).byte())
          .catch((e) => nota("la RICHIEDI_CHIAVE non e' potuta uscire: " + e));
      };
      schermo.su_errore_protocollo = (perche) => {
        esito("La sessione si è chiusa: il server ha mandato qualcosa che non "
            + "torna con RCP.", false);
        congeda(MOT.ERRORE_PROTOCOLLO, perche);
      };
      /* ⛔ E si continua ad ASCOLTARE il canale di controllo: dopo `SESSIONE`
         ci arrivano `TELA`, `CURSORE_FORMA` e il `CONGEDO`.  ⚠ Prima di oggi
         questa funzione ritornava e nessuno leggeva piu' niente: un `TELA` —
         che e' il messaggio da cui dipende tutta la regola del cambio di tela —
         non sarebbe mai stato letto.  Non si aspetta: la stretta di mano e'
         finita, e §4.4 vieta di bloccare il ciclo. */
      ascolta_controllo(canale, congeda);
    }
  }
}

/* ⛔ Il canale di controllo dopo la stretta di mano.  §3: quel che non si
   capisce si chiude con `ERRORE_PROTOCOLLO`, e si scrive che cosa non si e'
   capito. */
async function ascolta_controllo(canale, congeda) {
  for (;;) {
    let m;
    try { m = await canale.ricevi(); }
    catch (e) { nota("il canale di controllo si e' rotto: " + e); return; }
    if (!m) { nota("il server ha chiuso il canale di controllo (FIN)"); return; }
    const l = new Lettore(m.corpo);
    if (m.tipo === TIPO.CONGEDO) {
      const mot = l.u8();
      esito(MOTIVO[mot] || ("congedato, motivo 0x" + mot.toString(16)), false);
      return;
    }
    if (m.tipo === TIPO.TELA) {
      const esito_tela = l.u8(), motivo = l.u8(), tl = l.u32(), ta = l.u32();
      if (esito_tela === 1) {
        schermo.tela_adattata(tl, ta);
      } else {
        /* ⛔ §7.1: se il compositore non sa ridimensionare, il client DEVE
           mostrare la voce come spenta.  NON DEVE fingere che sia riuscito. */
        nota("TELA(RIFIUTATA, motivo " + motivo + "): la tela resta " + tl
           + "×" + ta + ", e la voce «adatta il desktop» va mostrata spenta");
        /* ⛔ E l'attesa si chiude LO STESSO (§6.2): un rifiuto risponde a
           un'`ADATTA_TELA` quanto un'adozione, e i fotogrammi trattenuti in
           attesa di questo `TELA` vanno rigiudicati adesso — o restano in mano
           per sempre. */
        schermo.tela_rifiutata();
      }
      continue;
    }
    if (m.tipo === TIPO.CURSORE_FORMA) {
      /* ⚠ Conosciuto e non ancora usato: alla fase 2 non c'e' puntatore.  Si
         DICE — un messaggio saltato in silenzio e uno mai arrivato hanno lo
         stesso aspetto (§5.5 e' della fase 4). */
      nota("CURSORE_FORMA ricevuto e non usato: la fase 2 non disegna il "
         + "puntatore");
      continue;
    }
    await congeda(MOT.ERRORE_PROTOCOLLO, "sul canale di controllo e' arrivato "
      + "il tipo 0x" + m.tipo.toString(16) + ", che questa pagina non aspetta "
      + "dopo SESSIONE");
    return;
  }
}

/* ⛔ GLI STREAM UNIDIREZIONALI DEL SERVER — §2.5, e il canale si riconosce dal
 * BYTE ALTO DEI PRIMI DUE BYTE, mai dal numero dello stream.
 *
 * ⭐ Ogni stream si legge nel SUO compito: §5.1 fa di ogni fotogramma uno
 *    stream apposta perche' uno lento non blocchi quelli dopo, e leggerli in
 *    fila dentro un `for await` unico rimetterebbe il blocco di testa che il
 *    protocollo e' stato disegnato per togliere.
 *
 * ⛔ E il FIN si distingue dal RESET: uno stream chiuso con FIN porta un
 *    fotogramma completo, uno AZZERATO porta un fotogramma incompleto e NON si
 *    consegna al decodificatore (§6.2).  In WebTransport la differenza si legge
 *    cosi': il `read()` che finisce con `done` e' un FIN, quello che LANCIA e'
 *    un `RESET_STREAM`. */
function avvia_video(wt, congeda) {
  (async function () {
    let lettore;
    try { lettore = wt.incomingUnidirectionalStreams.getReader(); }
    catch (e) { nota("niente stream unidirezionali: " + e); return; }
    for (;;) {
      let r;
      try { r = await lettore.read(); }
      catch (e) { nota("gli stream unidirezionali si sono fermati: " + e); return; }
      if (r.done) return;
      /* ⭐ Con il worker acceso lo stream CAMBIA PROPRIETARIO qui, e da questa
         riga in poi il fotogramma non tocca piu' il thread principale: i byte,
         le regole di §6.2, `decode()` e i due `drawImage` stanno di la'
         (`web.md` §6.1).  ⛔ Quel che resta di qua, per fotogramma, e' il
         `read()` qui sopra e questo trasferimento. */
      if (VW) { VW.manda_flusso(r.value); continue; }
      leggi_uno_stream(r.value, congeda);
    }
  })();
}

async function leggi_uno_stream(stream, congeda) {
  const lettore = stream.getReader();
  let pezzi = [], quanti = 0, completo = true;
  for (;;) {
    let r;
    try { r = await lettore.read(); }
    catch (e) {
      /* ⛔ Qui casca il `RESET_STREAM`: i byte gia' arrivati non sono un
         fotogramma corto, sono un fotogramma ABBANDONATO. */
      completo = false;
      break;
    }
    if (r.done) break;
    pezzi.push(r.value); quanti += r.value.length;
    /* Il tetto di §6.2: 16 MiB.  Chi ne riceve uno piu' lungo chiude, invece di
       continuare ad accumulare. */
    if (quanti > 16 * 1024 * 1024) {
      await congeda(MOT.ERRORE_PROTOCOLLO, "uno stream video oltre i 16 MiB "
        + "che §6.2 concede: si chiude invece di continuare ad accumulare");
      return;
    }
  }
  const byte = new Uint8Array(quanti);
  let o = 0;
  for (const p of pezzi) { byte.set(p, o); o += p.length; }
  if (quanti < 2) {
    /* ⚠ Meno di due byte: non c'e' nemmeno il `tipo`, quindi non si sa nemmeno
       di che canale sia.  §3: quel che non si capisce chiude. */
    if (!completo) { nota("uno stream unidirezionale azzerato prima dei due "
                        + "byte del tipo: buttato"); return; }
    await congeda(MOT.ERRORE_PROTOCOLLO, "uno stream unidirezionale chiuso con "
      + "FIN dopo " + quanti + " byte: non c'e' nemmeno il campo `tipo` di §2.5");
    return;
  }
  const alto = byte[0];
  if (alto === CANALE.VIDEO) { schermo.stream_video(byte, completo); return; }
  if (alto === CANALE.APPUNTI) {
    nota("uno stream di appunti (0x02) ricevuto e non usato: la fase 2 non ha "
       + "gli appunti (§5.4 e' della fase 5)");
    return;
  }
  await congeda(MOT.ERRORE_PROTOCOLLO, "uno stream unidirezionale del server "
    + "col byte alto 0x" + alto.toString(16) + ": §2.5 ammette 0x03 (video) e "
    + "0x02 (appunti), e il canale non si riconosce dal numero dello stream");
}

/* ══════════════════════════════════════════════════════════════════════════
   ⭐⭐ IL WORKER DEDICATO — `web.md` §6.1, attuata il 13 agosto 2026.

   ⛔ NON C'E' UN SECONDO FILE, e non e' una scorciatoia: `src/pagina.c` serve
      UNA pagina e basta (`componi(c, "200 OK", "text/html", …)`), quindi un
      `worker.js` accanto non sarebbe raggiungibile.  ⇒ Il worker nasce da un
      `Blob`, che eredita l'origine del documento — ⭐ e con lei
      COOP+COEP: `[M]` 13 agosto 2026, `crossOriginIsolated` e' **true** anche
      dentro il worker, e la grana del cronometro misurata li' e' **0,005 ms**,
      la stessa del thread principale (`src/pagina.c:32-35`, §11.5).

   ⛔ E IL CODICE NON SI DUPLICA: `Schermo` e `leggi_uno_stream` viaggiano con
      `Function.prototype.toString()`, cioe' il sorgente ESATTO che sta qui
      sopra — commenti compresi.  Quel che nel worker non esiste (`document`,
      `devicePixelRatio`, `misura_vista`) si mette a disposizione con un guscio,
      invece di riscrivere le regole di §6.2 una seconda volta.
   ══════════════════════════════════════════════════════════════════════════ */

/* ⛔ Il guscio, e ogni pezzo copre un uso PRECISO di `Schermo` — se un giorno
   la classe ne usasse uno in piu', il worker si romperebbe subito e a voce
   alta, che e' quel che deve fare. */
const GUSCIO_WORKER = `
/* ── quel che nel worker NON C'E', e che \`Schermo\` usa ─────────────────── */
let devicePixelRatio = 1;          /* ⛔ nel worker non esiste: lo manda il di la' */
let __vista = [1, 1];              /* la vista MISURATA dal thread principale */
let __oc = null, schermo = null;

function __posta(m) { self.postMessage(m); }

/* \`misura_vista()\` legge il foglio (\`documentElement.clientWidth\`): qui non
   c'e' nessun foglio.  ⛔ E NON si indovina — la misura, doppia passata della
   barra di scorrimento compresa, la fa il thread principale e la manda. */
function misura_vista() { return __vista.slice(); }

/* \`nota()\` scrive nel registro della pagina, che e' un nodo del DOM. */
function nota(t) { __posta({ t: "riga", riga: t }); }

/* \`document\`: \`Schermo\` ne usa DUE cose sole — il deposito e la marca
   «acceso».  ⛔ Il deposito diventa una \`OffscreenCanvas\`, che ha la stessa
   interfaccia (\`width\`, \`height\`, \`getContext("2d")\`, \`drawImage\`). */
const document = {
  createElement: function () { return new OffscreenCanvas(1, 1); },
  body: { dataset: { set schermo(v) { __posta({ t: "acceso", valore: v }); },
                     get schermo() { return null; } } },
};

/* ⛔ LA TELA, E PERCHE' NON E' LA \`OffscreenCanvas\` NUDA.  \`vista()\` scrive
   \`this.tela.style.width\` — la CORNICE in pixel CSS, che e' l'altra meta'
   della cura del 13 agosto (buffer e cornice devono valere lo stesso numero).
   ⚠ Una \`OffscreenCanvas\` non ha \`style\`: la cornice vive di la', sul nodo
   vero, e questo guscio ce la porta invece di lasciarla cadere in silenzio. */
function tela_finta(oc) {
  const stile = {};
  for (const k of ["width", "height"])
    Object.defineProperty(stile, k, { configurable: true,
      get: function () { return ""; },
      set: function (v) { __posta({ t: "stile", chiave: k, valore: v }); } });
  return {
    get width() { return oc.width; }, set width(v) { oc.width = v; },
    get height() { return oc.height; }, set height(v) { oc.height = v; },
    style: stile,
    getContext: function (t, o) { return oc.getContext(t, o); },
  };
}

/* \`leggi_uno_stream\` chiude la sessione passando da qui: il filo e' di la'. */
function congeda(motivo, perche) {
  __posta({ t: "congeda", motivo: motivo, perche: perche });
  return Promise.resolve();
}

/* ⛔ LO SPECCHIO DEI DODICI CONTATORI.  Il mandato li vuole «leggibili da
   fuori»: i banchi leggono \`REMOTIX.schermo.conti\` sul thread principale, e
   con il worker lo stato vero sta di qua.  ⇒ Si rimanda a fette, non a ogni
   fotogramma: un \`postMessage\` per fotogramma dentro il percorso che §6.1
   tiene corto sarebbe pagare la misura con la cosa misurata. */
function specchia() {
  if (!schermo) return;
  __posta({ t: "conti", conti: Object.assign({}, schermo.conti),
    stato: { vista_l: schermo.vista_l, vista_a: schermo.vista_a,
             dec_l: schermo.dec_l, dec_a: schermo.dec_a,
             tela_l: schermo.tela_l, tela_a: schermo.tela_a,
             ultimo_consegnato: schermo.ultimo_consegnato,
             atteso: schermo.atteso, sospeso: schermo.sospeso,
             attese_tela: schermo.attese_tela,
             trattenuti: schermo.trattenuti.length,
             formato: schermo.formato, dipinta: schermo.dipinta,
             errori: schermo.errori.slice(-8),
             tela: __oc ? [__oc.width, __oc.height] : null } });
}

self.onmessage = function (ev) {
  const m = ev.data;
  if (m.t === "accendi") {
    __oc = m.tela; devicePixelRatio = m.dpr || 1; __vista = m.vista || [1, 1];
    schermo = new Schermo(tela_finta(__oc));
    schermo.su_chiave = function (u) { __posta({ t: "chiave", ultimo: u }); };
    schermo.su_errore_protocollo = function (p) {
      __posta({ t: "errore_protocollo", perche: p }); };
    /* ⚠ Lo stesso nome globale di la', per la stessa ragione: un banco che
       debba guardare dentro guarda \`REMOTIX.schermo\`, non un nome nuovo. */
    self.REMOTIX = { schermo: schermo, leggi_uno_stream: leggi_uno_stream };
    setInterval(specchia, 100);
    __posta({ t: "pronto" });
    return;
  }
  if (!schermo) return;
  if (m.t === "vista") {
    devicePixelRatio = m.dpr || 1; __vista = m.vista;
    schermo.adatta_vista(); specchia(); return;
  }
  /* ⛔ Le chiamate che vengono da FUORI (\`riparti\`, \`negozia\`, \`vista\`,
     \`tela_adattata\`, \`tela_rifiutata\`): le fa la stretta di mano e il canale
     di controllo, che stanno di la'. */
  if (m.t === "chiama") {
    const f = schermo[m.metodo];
    if (typeof f === "function") f.apply(schermo, m.argomenti || []);
    specchia(); return;
  }
  /* ⭐ E QUI ENTRA IL VIDEO: uno stream TRASFERITO, letto di qua. */
  if (m.t === "flusso") { leggi_uno_stream(m.flusso, congeda); return; }
};
`;

/* ⛔ Il sorgente del worker si COMPONE, non si scrive: le costanti si
   serializzano e le funzioni si stampano da se'.  ⚠ Se una di queste sparisse
   o cambiasse nome, qui si romperebbe la composizione — e non il silenzio. */
function sorgente_worker() {
  return [
    "/* generato da pagina.html — `web.md` §6.1 */",
    "const DESINCRONIZZATA = " + JSON.stringify(DESINCRONIZZATA) + ";",
    "const NOME_DEL_CODEC = " + JSON.stringify(NOME_DEL_CODEC) + ";",
    "const CANALE = " + JSON.stringify(CANALE) + ";",
    "const MOT = " + JSON.stringify(MOT) + ";",
    differenza.toString(),
    dopo.toString(),
    GUSCIO_WORKER,
    /* ⭐ Il sorgente ESATTO della classe del prodotto — non una copia. */
    Schermo.toString(),
    leggi_uno_stream.toString(),
  ].join("\n\n");
}

/* Il worker, visto dal thread principale. */
function accendi_worker() {
  const V = { pronto: false, flussi: 0, w: null };
  const url = URL.createObjectURL(
    new Blob([sorgente_worker()], { type: "text/javascript" }));
  V.w = new Worker(url);
  V.chiama = function (metodo, argomenti) {
    V.w.postMessage({ t: "chiama", metodo: metodo, argomenti: argomenti || [] });
  };
  /* ⛔⭐ IL TRASFERIMENTO, ed e' il punto in cui §6.1 diventa byte.  Lo stream
     non si COPIA e non si legge di qua: cambia proprietario.  ⚠ Se un motore
     non lo permettesse, `postMessage` lancia — e allora si DICE, invece di
     ripiegare in silenzio sul thread principale e chiamarlo worker. */
  V.manda_flusso = function (f) {
    try { V.w.postMessage({ t: "flusso", flusso: f }, [f]); V.flussi++; }
    catch (e) {
      nota("⛔ lo stream del video non si e' potuto trasferire al worker ("
           + e + "): il video di questa sessione NON arriva.  ⚠ E non ripiego "
           + "sul thread principale: sarebbe misurare una cosa e chiamarla "
           + "un'altra.");
      V.rotto = true;
    }
  };
  V.vista = function () {
    /* ⛔ La vista si misura DI QUA — doppia passata compresa, che e' un fatto
       del foglio — e si manda gia' decisa. */
    const v = misura_vista();
    V.w.postMessage({ t: "vista", vista: v, dpr: devicePixelRatio || 1 });
  };
  V.w.onerror = function (e) {
    nota("⛔ il worker del video e' morto: " + (e.message || e));
    V.rotto = true;
  };
  V.w.onmessage = function (ev) {
    const m = ev.data;
    if (m.t === "pronto") { V.pronto = true; return; }
    if (m.t === "riga") { nota("video · " + m.riga); return; }
    if (m.t === "acceso") { document.body.dataset.schermo = m.valore; return; }
    if (m.t === "stile") { $("schermo").style[m.chiave] = m.valore; return; }
    if (m.t === "conti") {
      /* Lo specchio: da qui i banchi leggono `REMOTIX.schermo.conti`. */
      Object.assign(schermo.conti, m.conti);
      const s = m.stato || {};
      for (const k of ["vista_l", "vista_a", "dec_l", "dec_a", "tela_l",
                       "tela_a", "ultimo_consegnato", "atteso", "sospeso",
                       "attese_tela", "formato", "dipinta"])
        if (k in s) schermo[k] = s[k];
      if (s.errori) schermo.errori = s.errori;
      V.tela = s.tela || null;
      V.trattenuti = s.trattenuti;
      return;
    }
    /* ⭐ I due richiami che tornano sul FILO, e il filo e' di qua: la
       `RICHIEDI_CHIAVE` di §5.2 e la chiusura di §3.  ⚠ Si passa dalle stesse
       proprieta' che `collega()` riempie gia' — cosi' il percorso del
       messaggio e' quello di sempre, e non ce n'e' un secondo. */
    if (m.t === "chiave") {
      if (schermo.su_chiave) schermo.su_chiave(m.ultimo);
      return;
    }
    if (m.t === "errore_protocollo") {
      if (schermo.su_errore_protocollo) schermo.su_errore_protocollo(m.perche);
      return;
    }
    if (m.t === "congeda") {
      if (congeda_corrente) congeda_corrente(m.motivo, m.perche);
      return;
    }
  };
  const oc = $("schermo").transferControlToOffscreen();
  V.w.postMessage({ t: "accendi", tela: oc, dpr: devicePixelRatio || 1,
                    vista: misura_vista() }, [oc]);
  return V;
}

/* ⛔ Si accende AL CARICAMENTO e non alla connessione, e non e' anticipo
   inutile: cosi' il worker esiste — e un banco che debba guardarci dentro ha
   dove attaccarsi — PRIMA che esista un `VideoDecoder` da osservare.  ⚠ E a
   riposo non fa niente: aspetta un messaggio. */
const VW = VIDEO_WORKER ? accendi_worker() : null;

/* ⛔⭐ E QUI LE CHIAMATE DI FUORI SI DIROTTANO.  `collega()` e
 * `ascolta_controllo()` parlano a `schermo` come hanno sempre fatto: con
 * l'interruttore acceso, quelle stesse chiamate vanno al worker.
 *
 * ⚠ NON si esegue anche di qua: l'istanza di questo lato e' uno SPECCHIO, e
 *   farla dipingere davvero vorrebbe dire decodificare e disegnare due volte —
 *   cioe' misurare un worker mentre il thread principale fa lo stesso lavoro.
 *   ⛔ Sarebbe un «dopo» piu' lento del «prima» per colpa della misura. */
if (VW) {
  for (const metodo of ["riparti", "negozia", "vista", "tela_adattata",
                        "tela_rifiutata", "adatta_tela_chiesta",
                        "stream_video"]) {
    schermo[metodo] = (function (m) {
      return function () { VW.chiama(m, Array.prototype.slice.call(arguments)); };
    })(metodo);
  }
  /* `adatta_vista()` e' l'unica che deve MISURARE di qua prima di partire. */
  schermo.adatta_vista = function () { VW.vista(); return misura_vista(); };
}

$("modulo").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("vai").disabled = true;
  righe.length = 0;
  esito("", true);
  congeda_corrente = null;
  try {
    await collega($("utente").value, $("parola").value);
  } catch (e) {
    esito("Non si collega: " + (e && e.message ? e.message : e), false);
    nota("eccezione: " + e);
    /* ⛔ §3: quel che non si capisce si chiude con `ERRORE_PROTOCOLLO` e si
       scrive che cosa non si e' capito — non si lascia la sessione aperta ad
       aspettare i trenta secondi del silenzio (rilievo B-4). */
    if (congeda_corrente) {
      try { await congeda_corrente(MOT.ERRORE_PROTOCOLLO, (e && e.message) ? e.message : String(e)); }
      catch (e2) { nota("nemmeno il congedo e' potuto uscire: " + e2); }
    }
  } finally {
    /* ⛔ QUI NON SI AZZERA `congeda_corrente`, ed e' la cura dell'11 agosto 2026.
     *    `collega()` ritorna appena la stretta di mano e' arrivata a `SESSIONE`
     *    — cioe' quando la sessione COMINCIA — quindi azzerarlo qui rendeva
     *    codice morto il gestore di `pagehide` un millisecondo dopo, e la
     *    pagina non si congedava piu' chiudendo la scheda (§8.1).  ⭐ Adesso lo
     *    azzera `wt.closed`, dentro `collega()`, che e' l'unico punto che sa
     *    quando la sessione e' FINITA.
     * ⚠ Quello a inizio gestore (piu' sopra) resta: un tentativo nuovo deve
     *   buttare il riferimento vecchio prima di aprirne un altro. */
    $("vai").disabled = false;
    /* ⛔ La parola non resta nel campo: e' la stessa regola per cui non entra
       in nessun registro (§4.4). */
    $("parola").value = "";
  }
});
</script>
