/* ══════════════════════════════════════════════════════════════════════════
 * ⭐⭐ LA REGOLA CHE GOVERNA TUTTA QUESTA ANCORA
 *
 *     La pagina **DICHIARA** quali scorciatoie non puo' consegnare su questo
 *     motore.  ⛔ Non si finge che funzionino, e non si inventa una scorciatoia
 *     sostitutiva senza dirlo (`SPECIFICHE.md` §7.3-bis).
 *
 * ⛔⛔ E GLI STATI SONO TRE, NON DUE — il secondo e' il peggiore:
 *
 *       consegnata               arriva alla sessione remota, e basta
 *       consegnata E RISERVATA   arriva alla pagina **e** il browser esegue
 *                                anche il proprio comando
 *       non consegnata           il browser (o il compositore) se la tiene
 *
 *     ⚠ Il secondo e' il peggiore perche' e' quello che **sembra funzionare**:
 *       la sessione remota riceve la battuta, il banco che guarda solo di la'
 *       stampa verde, e intanto sotto le mani dell'utente il browser ha
 *       ricaricato la pagina o gli ha portato il fuoco nella barra degli
 *       indirizzi.  ⇒ La misura non e' «arriva?» ma **«arriva E BASTA?»**
 *
 * ── QUEL CHE E' MISURATO, E CON CHE COSA ───────────────────────────────────
 *
 * `banchi/04-b29-scorciatoie.py` (sonda **S3**), `[M]` 14 agosto 2026, su
 * GNOME/Wayland, iniettando dalla porta da cui entra una TASTIERA VERA
 * (`org.gnome.Mutter.RemoteDesktop`) — non da CDP, che salterebbe a pie' pari
 * lo strato degli acceleratori del browser, cioe' proprio quel che si misura.
 * Gli esiti riga per riga stanno in `banchi/04-b29-esiti.jsonl`, con il palco
 * scritto in ogni riga.
 *
 * ⛔ E IL FUOCO NON E' IL CONTORNO DELLA MISURA: E' UNA DELLE GRANDEZZE.
 *    La Keyboard Lock **si spegne da sola quando la pagina perde il fuoco**
 *    (O10) — percio' qui il fuoco si sorveglia, la lock si ricompra, e ogni
 *    passaggio si DICHIARA.  ⚠ Il rilascio di quel che e' rimasto premuto lo
 *    fa gia' l'ancora `F4-INPUT-CLASSICO` sul `blur`: qui non si duplica.
 * ══════════════════════════════════════════════════════════════════════════ */

const SC_RIPIEGHI = [];
const SC_REGISTRO = [];            /* l'anello per il banco (I6: da LEGGERE) */
const SC_REGISTRO_MAX = 256;

function sc_nota(testo) {
  SC_REGISTRO.push({ ms: Math.round(performance.now()), testo: testo });
  if (SC_REGISTRO.length > SC_REGISTRO_MAX) SC_REGISTRO.shift();
  nota(testo);
}
function sc_ripiego(nome, testo) {
  if (SC_RIPIEGHI.indexOf(nome) >= 0) return;
  SC_RIPIEGHI.push(nome);
  sc_nota("⚠ scorciatoie, RIPIEGO «" + nome + "»: " + testo);
}

/* ── CHI E' QUESTO MOTORE ──────────────────────────────────────────────────
 * ⛔ Si guarda una CAPACITA' quando c'e', e la stringa solo quando non c'e'
 *    altro — e in quel caso si dichiara che si e' tirato a indovinare.  ⚠ La
 *    famiglia serve a scegliere la riga del catalogo, non a decidere che cosa
 *    funziona: quello lo decide la misura. */
function sc_motore() {
  const ua = navigator.userAgent || "";
  let famiglia = "?", dedotta = true;
  if (navigator.userAgentData && navigator.userAgentData.brands) {
    famiglia = "blink"; dedotta = false;          /* solo Blink espone questo */
  } else if (ua.indexOf("Gecko/") >= 0 && ua.indexOf("Firefox/") >= 0) {
    famiglia = "gecko";
  } else if (ua.indexOf("AppleWebKit") >= 0 && ua.indexOf("Chrome") < 0) {
    famiglia = "webkit";
  }
  const versione = (ua.match(/(?:Chrome|Firefox|Version)\/(\d+)/) || [])[1] || null;
  /* ⭐ In una PWA installata la lista riservata di Chrome e' **vuota**
     (`web.md` §1.2 B) — cioe' un dominio fidato non compra solo l'assenza
     dell'avviso: compra la tastiera intera.  ⚠ `[?]` su Chrome per Android, e
     resta `[?]` finche' non c'e' un telefono su cui provarla. */
  let installata = false;
  try {
    installata = !!(matchMedia("(display-mode: standalone)").matches
                 || matchMedia("(display-mode: fullscreen)").matches
                 || navigator.standalone);
  } catch (e) { /* un motore che non conosce la richiesta: resta false */ }
  return { famiglia: famiglia, famiglia_dedotta: dedotta, versione: versione,
           installata: installata, ua: ua };
}
const SC_MOTORE = sc_motore();

/* ── LO SCHERMO INTERO E LA LOCK, NELLE DUE FORME ──────────────────────────
 * ⛔ La pagina deve saperle ENTRAMBE (`SPECIFICHE.md` §7.3-bis):
 *      la nuova   `requestFullscreen({ keyboardLock: "browser" })`  — WHATWG,
 *                 8 maggio 2026, spedita da Safari 26.4 e Firefox 151 `[S]`
 *      la vecchia `navigator.keyboard.lock()`                       — Chrome,
 *                 Edge, e i motori che non hanno ancora la nuova
 * ⚠ E si prova prima la NUOVA: e' quella che lo standard prescrive, e un
 *   motore che le ha tutte e due deve vedersi chiedere quella giusta.
 *
 * ⛔ E «riuscito» non e' «concesso»: un motore che non conosce l'opzione
 *    `keyboardLock` prende il dizionario, **ignora la chiave** e va a schermo
 *    intero senza dire niente — il ripiego silenzioso che `CODER.md` §4.2
 *    vieta.  ⇒ L'opzione si passa dentro un oggetto che REGISTRA se e' stata
 *    letta, ed e' l'unico modo di distinguere «me l'ha data» da «ha fatto
 *    finta di niente». */
let sc_lock_forma = null;         /* "nuova" | "vecchia" | null */
let sc_lock_viva = false;
let sc_lock_motivo = "non ancora chiesta";

function sc_intero_da_F11() {
  /* ⛔ LA TRAPPOLA O10, PRIMA META': lo schermo intero entrato con `F11` NON
     accende `document.fullscreenElement`, la lock **non esiste li' dentro**, e
     il browser **non lo dice**.  ⇒ Si riconosce dalla geometria: schermo pieno
     e nessun elemento a schermo intero. */
  const pieno = (innerWidth >= screen.width - 2 && innerHeight >= screen.height - 2);
  return pieno && !document.fullscreenElement;
}

async function sc_entra_a_schermo_intero(elemento) {
  const bersaglio = elemento || document.documentElement;
  if (sc_intero_da_F11()) {
    sc_lock_forma = null; sc_lock_viva = false;
    sc_lock_motivo = "lo schermo intero e' stato aperto con F11: la Keyboard "
                   + "Lock non esiste li' dentro, e il browser non lo dice";
    sc_ripiego("F11", sc_lock_motivo + " ⇒ le scorciatoie del browser restano "
             + "tutte sue.  Per riaverle: uscire con F11 e rientrare dal bottone.");
    return { schermo_intero: true, da: "F11", lock: false, motivo: sc_lock_motivo };
  }
  /* 1) la forma NUOVA */
  let letta = false;
  const opzioni = {};
  try {
    Object.defineProperty(opzioni, "keyboardLock",
      { enumerable: true, get: function () { letta = true; return "browser"; } });
  } catch (e) { /* un motore che non sa definire proprieta': si va di vecchia */ }
  try {
    await bersaglio.requestFullscreen(opzioni);
  } catch (e) {
    sc_nota("⛔ lo schermo intero e' stato rifiutato: " + e
          + " — senza schermo intero NON c'e' Keyboard Lock, e le scorciatoie "
          + "restano tutte del browser");
    sc_lock_forma = null; sc_lock_viva = false;
    sc_lock_motivo = "schermo intero rifiutato: " + e;
    return { schermo_intero: false, lock: false, motivo: sc_lock_motivo };
  }
  if (letta) {
    sc_lock_forma = "nuova"; sc_lock_viva = true;
    sc_lock_motivo = "requestFullscreen({keyboardLock:'browser'}) — la forma WHATWG";
    sc_nota("⭐ Keyboard Lock ottenuta nella forma nuova.");
    return { schermo_intero: true, da: "API", lock: true, forma: "nuova" };
  }
  /* 2) la forma VECCHIA */
  if (navigator.keyboard && navigator.keyboard.lock) {
    try {
      await navigator.keyboard.lock();
      sc_lock_forma = "vecchia"; sc_lock_viva = true;
      sc_lock_motivo = "navigator.keyboard.lock() — la forma di Chrome ed Edge";
      sc_nota("⭐ Keyboard Lock ottenuta nella forma vecchia.");
      return { schermo_intero: true, da: "API", lock: true, forma: "vecchia" };
    } catch (e) {
      sc_lock_forma = null; sc_lock_viva = false;
      sc_lock_motivo = "navigator.keyboard.lock() ha rifiutato: " + e;
    }
  } else {
    sc_lock_forma = null; sc_lock_viva = false;
    sc_lock_motivo = "questo motore non ha NESSUNA delle due forme della "
                   + "Keyboard Lock";
  }
  sc_ripiego("senza-lock", sc_lock_motivo + " ⇒ si va a schermo intero lo "
           + "stesso, e le scorciatoie che il browser si tiene restano sue. "
           + "Sono elencate qui sotto: non si finge che arrivino.");
  return { schermo_intero: true, da: "API", lock: false, motivo: sc_lock_motivo };
}

async function sc_esci_da_schermo_intero() {
  try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); }
  catch (e) { /* non c'era */ }
  sc_lock_viva = false; sc_lock_forma = null;
  sc_lock_motivo = "uscita dallo schermo intero";
  try { if (document.fullscreenElement) await document.exitFullscreen(); }
  catch (e) { /* gia' fuori */ }
}

/* ⛔⛔ LA TRAPPOLA O10, SECONDA META', E MORDE DOVE FA PIU' MALE:
 *     **la lock si spegne da sola quando la pagina perde il fuoco**, cioe'
 *     esattamente nell'istante in cui un modificatore resta premuto.
 *
 *     ⇒ Qui si fanno DUE cose, e sono di due anelli diversi:
 *        1. il rilascio di quel che e' premuto — lo fa gia' `F4-INPUT-CLASSICO`
 *           sul `blur` (e `F4-TOCCO` per il suo), e qui NON si duplica;
 *        2. la lock si segna per MORTA, e al ritorno del fuoco si RICOMPRA —
 *           perche' nessun evento annuncia che se n'e' andata, e una pagina che
 *           continuasse a crederla viva direbbe all'utente una bugia.
 *
 *     ⚠ E la ricompra puo' FALLIRE: `navigator.keyboard.lock()` non pretende
 *       un gesto, ma se lo schermo intero e' caduto nel frattempo non c'e'
 *       niente da ricomprare.  Il fallimento si DICHIARA, non si nasconde. */
addEventListener("blur", function () {
  if (!sc_lock_viva) return;
  sc_lock_viva = false;
  sc_lock_motivo = "la pagina ha perso il fuoco: la Keyboard Lock si e' spenta "
                 + "da sola (O10) — si ricompra al ritorno";
  sc_nota("⚠ " + sc_lock_motivo);
  sc_dipingi();
});
addEventListener("focus", function () {
  if (sc_lock_forma === null && !document.fullscreenElement) { sc_dipingi(); return; }
  if (sc_lock_viva) return;
  if (!document.fullscreenElement) {
    sc_lock_motivo = "il fuoco e' tornato ma lo schermo intero non c'e' piu': "
                   + "niente da ricomprare";
    sc_dipingi();
    return;
  }
  if (navigator.keyboard && navigator.keyboard.lock) {
    navigator.keyboard.lock().then(function () {
      sc_lock_viva = true; sc_lock_forma = "vecchia";
      sc_lock_motivo = "ricomprata al ritorno del fuoco";
      sc_nota("⭐ Keyboard Lock ricomprata al ritorno del fuoco.");
      sc_dipingi();
    }).catch(function (e) {
      sc_lock_motivo = "la ricompra della lock e' fallita: " + e;
      sc_nota("⛔ " + sc_lock_motivo);
      sc_dipingi();
    });
  } else {
    /* ⚠ La forma NUOVA sta dentro `requestFullscreen`, e non si puo' rifare
       senza uscire e rientrare — che vorrebbe dire sbattere lo schermo in
       faccia all'utente per una cosa che forse non gli serve.  ⇒ Si dichiara,
       e si lascia decidere a lui dal bottone. */
    sc_lock_motivo = "la lock era nella forma nuova: si ricompra solo uscendo e "
                   + "rientrando a schermo intero — e non lo si fa di nascosto";
    sc_dipingi();
  }
});
document.addEventListener("fullscreenchange", function () {
  if (!document.fullscreenElement && sc_lock_viva) {
    sc_lock_viva = false; sc_lock_forma = null;
    sc_lock_motivo = "lo schermo intero e' finito: con lui la lock";
  }
  sc_dipingi();
});

/* ── QUEL CHE SI PERDE, DETTO ALL'UTENTE ───────────────────────────────────
 * ⛔ Non un elenco generico: quel che si perde **su questo motore, in questo
 *    palco, adesso**.  Un avviso che dicesse sempre la stessa cosa sarebbe
 *    falso in tre casi su quattro. */
function sc_palco() {
  if (sc_intero_da_F11()) return "F11";
  if (!document.fullscreenElement) return "finestra";
  return sc_lock_viva ? "intero+lock" : "intero";
}

/* ⭐ La finestra d'applicazione e' una RIGA A PARTE del catalogo, non una
   sfumatura della sua: `[M]` 14 agosto 2026 su Chrome 151 in `--app` le
   riservate del browser sono **zero gia' in finestra**, contro **otto** in una
   scheda normale.  ⇒ Chiamarle con lo stesso nome vorrebbe dire dire all'utente
   che perde otto scorciatoie che non perde. */
function sc_famiglia() {
  return SC_MOTORE.famiglia + (SC_MOTORE.installata ? "-app" : "");
}

function sc_perdute() {
  const palco = sc_palco();
  const riga = (SC_CATALOGO[sc_famiglia()] || {})[palco];
  if (!riga) {
    return { palco: palco, marca: "[?]", misurato: false, voci: [],
             avviso: "su questo motore le scorciatoie NON sono state misurate: "
                   + "non si sa che cosa si perde, e non lo si deduce dagli altri" };
  }
  /* ⚠ Il catalogo porta SOLO quel che si perde: le consegnate non ci sono
     nemmeno.  Il filtro resta perche' costa zero e regge un catalogo scritto
     un domani con dentro tutto. */
  const voci = [];
  for (const k in riga) {
    if (riga[k] === "consegnata") continue;
    voci.push({ combinazione: k, stato: riga[k] });
  }
  /* ⛔ Le riservate-E-consegnate vanno in cima: sono il caso che l'utente non
     capirebbe da solo, perche' la sessione remota le riceve davvero. */
  voci.sort(function (a, b) {
    const p = function (v) { return v.stato === "consegnata-E-RISERVATA" ? 0 : 1; };
    return p(a) - p(b) || (a.combinazione < b.combinazione ? -1 : 1);
  });
  return { palco: palco, marca: "[M] 14 agosto 2026", misurato: true, voci: voci };
}

/* ── I BOTTONI A SCHERMO — ⭐ UN REQUISITO, NON UN RIPIEGO DI FORTUNA ───────
 * `web.md` §8-bis O7: *tre riferimenti maturi su tre danno all'utente un modo
 * di mandare quel che il browser non lascia passare*.  ⇒ `Ctrl+Alt+Canc` non e'
 * «non recuperabile»: e' **recuperabile in un altro modo**, e quel modo e'
 * questo.
 *
 * ⛔ E i bottoni mandano POSIZIONI, non lettere (§7.3): `Ctrl+Alt+Canc` sul
 *    filo e' 29 giu', 56 giu', 111 giu', 111 su, 56 su, 29 su.
 *
 * ⚠ LA CUCITURA CHE USO, e la dichiaro invece di supporla in silenzio: le
 *   posizioni le spedisce `cl_spedisci(CL_TIPO.POSIZIONE_TASTO, codice, giu,
 *   ms)` dell'ancora `F4-INPUT-CLASSICO`, che a sua volta passa dalla cucitura
 *   comune `window.REMOTIX_INPUT`.  ⛔ Se quella funzione non c'e', i bottoni
 *   si mostrano SPENTI con scritto perche': un bottone che non manda niente e
 *   non lo dice sarebbe la bugia peggiore di tutta questa ancora. */
/* ⭐⭐ UN BOTTONE SOLO — deciso dall'utente il 14 agosto 2026.
 *
 * La domanda era: sei combinazioni non arriveranno mai al desktop remoto (le
 * tiene il compositore del CLIENT, non il browser), e l'unico modo di darle e'
 * un bottone a schermo — ma la barra toglie pixel all'immagine.  ⭐ La risposta:
 * **solo `Ctrl+Alt+Canc`**.
 *
 * ⛔ E la ragione per cui quello resta e' diversa da quella degli altri cinque:
 *    senza, **in una sessione bloccata non si entra piu'** — e' l'unica delle
 *    sei che, mancando, lascia l'utente fuori invece che scomodo.
 *    `SPECIFICHE.md` §7.3-bis lo chiama **un requisito, non un ripiego di
 *    fortuna**: tre riferimenti maturi su tre lo fanno.
 *
 * ⚠ Gli altri cinque NON spariscono dal codice, e non e' pigrizia: restano
 *   qui sotto **dichiarati e spenti**, con la loro ragione, perche' la scelta
 *   e' di gusto e si rivede guardandola (`LEZIONI.md` §7.3 — un'interfaccia non
 *   si giudica leggendola).  ⛔ Accenderne uno costa **una riga**: `attivo: true`.
 *
 * ⛔ E quel che NON si fa e' fingere: le cinque combinazioni spente **restano
 *    del computer dell'utente**, e la pagina lo DICHIARA nella sua tavola
 *    invece di lasciar credere che siano arrivate (`SPECIFICHE.md` §7.3-bis). */
const SC_BOTTONI = [
  { nome: "Ctrl+Alt+Canc", tasti: ["ControlLeft", "AltLeft", "Delete"],
    attivo: true,
    perche: "nessun browser la lascia passare, e nessuno la lascera' mai: "
          + "la prende il sistema operativo del CLIENT prima del browser" },
  { nome: "Ctrl+W", tasti: ["ControlLeft", "KeyW"], attivo: false,
    perche: "il browser chiude la scheda" },
  { nome: "Ctrl+T", tasti: ["ControlLeft", "KeyT"], attivo: false,
    perche: "il browser apre una scheda" },
  { nome: "Alt+F4", tasti: ["AltLeft", "F4"], attivo: false,
    perche: "la prende il compositore del client" },
  { nome: "Super", tasti: ["MetaLeft"], attivo: false,
    perche: "la prende il compositore del client (e su Android/DeX ogni "
          + "combinazione con Meta, per regola AOSP)" },
];

function sc_filo_cucito() {
  return (typeof cl_spedisci === "function" && typeof CL_TIPO === "object"
          && typeof CL_POSIZIONE === "object");
}

function sc_manda(nome, tasti) {
  if (!sc_filo_cucito()) {
    sc_nota("⛔ «" + nome + "» NON e' partita: il modo classico non e' cucito "
          + "(manca `cl_spedisci`).  Il bottone non ha fatto niente, e questa "
          + "riga esiste perche' non sembri che l'abbia fatto.");
    return false;
  }
  const codici = [];
  for (const t of tasti) {
    const c = CL_POSIZIONE[t];
    if (typeof c !== "number") {
      /* ⛔ Un codice che non c'e' NON si spedisce: manderebbe un altro tasto
         sul desktop dell'utente (la stessa regola di `CL_POSIZIONE`). */
      sc_nota("⛔ «" + nome + "» non e' partita: la posizione «" + t
            + "» non e' in tabella");
      return false;
    }
    codici.push(c);
  }
  const ms = performance.now();
  for (const c of codici) cl_spedisci(CL_TIPO.POSIZIONE_TASTO, c, 1, ms);
  for (let i = codici.length - 1; i >= 0; i--) {
    cl_spedisci(CL_TIPO.POSIZIONE_TASTO, codici[i], 0, ms);
  }
  SC_MANDATI.push({ nome: nome, codici: codici, ms: Math.round(ms) });
  if (SC_MANDATI.length > SC_REGISTRO_MAX) SC_MANDATI.shift();
  sc_nota("⭐ «" + nome + "» mandata dal bottone come posizioni: "
        + codici.join(", "));
  return true;
}
const SC_MANDATI = [];

/* ── LA BARRA ──────────────────────────────────────────────────────────────
 * ⚠ Sta dentro il documento e non in un foglio a parte: la pagina e' servita
 *   isolata fra origini e NON ha risorse esterne (`SPECIFICHE.md` §11.5). */
let sc_el = null, sc_el_voci = null, sc_el_stato = null;

function sc_costruisci() {
  if (sc_el) return sc_el;
  const b = document.createElement("div");
  b.id = "scorciatoie";
  b.style.cssText = "position:fixed; left:0; right:0; bottom:32px; z-index:12;"
    + "background:rgba(16,16,22,.94); color:#d8d8e0; font:13px/1.45 monospace;"
    + "padding:.35rem .75rem; border-top:1px solid #444; display:none;"
    /* ⛔ `max-height` piccolo E chiuso di suo: la barra costa due righe finche'
     *    l'utente non chiede il resto.  ⚠ Non si toglie del tutto — la riga di
     *    stato dice se la tastiera arriva tutta o no, ed e' l'unica cosa che
     *    l'utente deve poter leggere **senza chiedere**. */
    + "max-height:38vh; overflow:auto;";
  const s = document.createElement("div");
  s.id = "scorciatoie-stato";
  /* ⛔⭐ L'ELENCO STA DIETRO UN CONTROLLO, E NON SOTTO GLI OCCHI — cura del
   *     14 agosto 2026, dal giudizio dell'utente sulla sessione vera:
   *     *«lo schermo appare strano»*.
   *
   *     ⚠ E il difetto non era il contenuto, era la MISURA: la barra stava
   *     `fixed` in fondo, alta fino al **38 % della finestra**, e ci stampava
   *     dentro tutte le combinazioni dichiarate — ⛔ **coprendo il desktop**,
   *     che e' la cosa per cui il prodotto esiste.  L'utente ha visto il
   *     proprio desktop schiacciato in alto e un muro di testo tecnico sotto.
   *
   * ⇒ ⭐ La dichiarazione di `SPECIFICHE.md` §7.3-bis **resta per intero** —
   *   *«la pagina DICHIARA quali scorciatoie non puo' consegnare»* — ma
   *   dichiarare non vuol dire **stampare addosso**: una riga sola sempre
   *   visibile, e l'elenco a un clic di distanza.
   * ⚠ E `<details>` e' chiuso di suo: chi non lo apre non paga un pixel. */
  const det = document.createElement("details");
  det.id = "scorciatoie-elenco";
  det.style.cssText = "margin:.2rem 0 0 0;";
  const sum = document.createElement("summary");
  sum.id = "scorciatoie-riassunto";
  sum.style.cssText = "cursor:pointer; opacity:.85;";
  sum.textContent = "quali tasti non arrivano al desktop?";
  det.appendChild(sum);
  const v = document.createElement("div");
  v.id = "scorciatoie-voci";
  v.style.cssText = "margin:.35rem 0;";
  det.appendChild(v);
  const p = document.createElement("div");
  p.id = "scorciatoie-bottoni";
  p.style.cssText = "display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.4rem;";
  for (const spec of SC_BOTTONI) {
    /* ⛔ Spento vuol dire **non disegnato**, non «disegnato e inerte»: un
     *    bottone che c'e' e non fa niente e' peggio di un bottone che non c'e'.
     *    ⚠ La combinazione resta comunque nella tavola delle dichiarate, dove
     *    l'utente legge che quella battuta il suo computer se la tiene. */
    if (!spec.attivo) continue;
    const t = document.createElement("button");
    t.type = "button";
    t.textContent = spec.nome;
    t.title = spec.perche;
    t.style.cssText = "margin:0; padding:.25rem .6rem; font:12px monospace;";
    t.addEventListener("click", function (ev) {
      ev.preventDefault();
      sc_manda(spec.nome, spec.tasti);
      /* ⚠ Il fuoco torna alla tela: un bottone che se lo tiene farebbe sparire
         la tastiera dell'utente al primo clic. */
      const tela = $("schermo"); if (tela && tela.focus) tela.focus();
    });
    p.appendChild(t);
  }
  b.appendChild(s); b.appendChild(p); b.appendChild(det);
  document.body.appendChild(b);
  sc_el = b; sc_el_voci = v; sc_el_stato = s;
  return b;
}

function sc_dipingi() {
  if (!sc_el) return;
  const p = sc_perdute();
  const cucito = sc_filo_cucito();
  const nomi = { finestra: "finestra", intero: "schermo intero (senza lock)",
                 "intero+lock": "schermo intero CON Keyboard Lock",
                 F11: "schermo intero aperto con F11" };
  sc_el_stato.innerHTML = "";
  const t1 = document.createElement("div");
  t1.textContent = "Tastiera: " + (nomi[p.palco] || p.palco)
    + " · lock: " + (sc_lock_viva ? ("viva (" + sc_lock_forma + ")") : "no")
    + " — " + sc_lock_motivo;
  sc_el_stato.appendChild(t1);
  if (!cucito) {
    const t2 = document.createElement("div");
    t2.textContent = "⛔ il canale di input non e' cucito: i bottoni qui sotto "
                   + "NON mandano niente.";
    sc_el_stato.appendChild(t2);
  }
  sc_el_voci.innerHTML = "";
  /* ⭐ E il riassunto porta IL NUMERO, cosi' la riga chiusa dice gia' la cosa
   *    che serve — «quanti tasti perdo?» — e l'elenco si apre solo se
   *    interessa quali.  ⚠ Un riassunto che non dice niente e' un controllo che
   *    nessuno apre. */
  const riassunto = document.getElementById("scorciatoie-riassunto");
  if (riassunto) {
    riassunto.textContent = !p.misurato
      ? "quali tasti non arrivano al desktop? (non misurato su questo motore)"
      : (p.voci.length
           ? ("quali tasti non arrivano al desktop? — ne risultano "
              + p.voci.length)
           : "nessun tasto perso su questo motore e in questo palco");
  }
  if (!p.misurato) {
    const d = document.createElement("div");
    d.textContent = "[?] " + p.avviso;
    sc_el_voci.appendChild(d);
    return;
  }
  if (!p.voci.length) {
    const d = document.createElement("div");
    d.textContent = p.marca + " su questo motore e in questo palco non risulta "
                  + "persa nessuna delle combinazioni provate.";
    sc_el_voci.appendChild(d);
    return;
  }
  const testa = document.createElement("div");
  testa.textContent = p.marca + " — quel che il browser si tiene, e che quindi "
                    + "NON comanda il desktop remoto:";
  sc_el_voci.appendChild(testa);
  for (const v of p.voci) {
    const d = document.createElement("div");
    /* ⛔ TRE testi e non due, e il terzo e' il piu' onesto:
       · `non-consegnata`                        il browser (o il compositore) se la tiene
       · `consegnata-E-RISERVATA`                arriva E il browser fa anche il suo
       · `…-non-prevenuta`  ⇒ ⚠ `[?]`           misurata SENZA `preventDefault()`,
         cioe' senza la cura che questa pagina applica su ogni battuta che
         spedisce.  Dichiararla come persa sarebbe **falso in peggio**; tacerla
         sarebbe falso in meglio.  ⇒ Si dichiara che non si sa. */
    if (v.stato === "consegnata-E-RISERVATA-non-prevenuta") {
      d.textContent = "  [?] " + v.combinazione + " — misurata senza la cura che "
        + "questa pagina applica: potrebbe non perdersi affatto, e non lo do per buono";
    } else if (v.stato === "consegnata-E-RISERVATA") {
      d.textContent = "  ⛔ " + v.combinazione + " — arriva al desktop remoto MA "
        + "il browser esegue anche il suo comando";
    } else {
      d.textContent = "  · " + v.combinazione + " — non arriva affatto";
    }
    sc_el_voci.appendChild(d);
  }
  for (const np of SC_NON_PROVATI) {
    const d = document.createElement("div");
    d.textContent = "  [?] " + np.motore + ": non provato — " + np.perche;
    sc_el_voci.appendChild(d);
  }
}

/* ⛔⭐ IL BOTTONCINO, E PERCHE' STA IN UN ANGOLO — cura del 14 agosto 2026,
 *     dal giudizio dell'utente sulla sessione vera: *«quella barra in basso
 *     deve sparire, o non vedo il drawer di gnome»*.
 *
 *     ⚠ E aveva ragione nel posto peggiore: la barra stava `bottom:0` a tutta
 *     larghezza, ⛔ **cioe' esattamente dove GNOME tiene il dock**.  Il prodotto
 *     copriva con una propria dichiarazione la parte del desktop che l'utente
 *     usa per aprire le applicazioni.
 *
 * ⇒ ⭐ La dichiarazione di `SPECIFICHE.md` §7.3-bis resta — ⛔ ma **non si
 *   apre piu' da sola sopra il desktop**: sta dietro un bottoncino di 26 px
 *   nell'ANGOLO in basso a sinistra, dove il dock (che GNOME centra) non passa.
 * ⚠ E perche' l'obbligo di DICHIARARE resti soddisfatto senza coprire niente,
 *   la prima volta che si comincia a comandare la riga va nel REGISTRO della
 *   pagina — che l'utente puo' leggere senza che nessuno gli tolga un pixel. */
let sc_bott = null, sc_detto = false;

function sc_bottone() {
  if (sc_bott) return sc_bott;
  const t = document.createElement("button");
  t.type = "button";
  t.id = "scorciatoie-apri";
  t.textContent = "⌨";
  t.title = "quali tasti non arrivano al desktop remoto";
  t.style.cssText = "position:fixed; left:4px; bottom:4px; z-index:13;"
    + "width:26px; height:26px; padding:0; line-height:26px; text-align:center;"
    + "font:14px monospace; opacity:.55; border-radius:4px; cursor:pointer;";
  t.addEventListener("mouseenter", function () { t.style.opacity = "1"; });
  t.addEventListener("mouseleave", function () { t.style.opacity = ".55"; });
  t.addEventListener("click", function (ev) {
    ev.preventDefault();
    sc_costruisci();
    sc_mostra(sc_el.style.display === "none");
    /* ⚠ Il fuoco torna alla tela: un bottone che se lo tiene farebbe sparire
       la tastiera dell'utente al primo clic. */
    const tela = $("schermo"); if (tela && tela.focus) tela.focus();
  });
  document.body.appendChild(t);
  sc_bott = t;
  return t;
}

function sc_mostra(si) {
  sc_costruisci();
  sc_bottone();
  sc_el.style.display = si === false ? "none" : "block";
  if (si !== false) sc_dipingi();
}

/* ⚠ Un giro lento: la geometria puo' cambiare senza nessun evento (F11 su certi
   motori non manda `resize` prima che la finestra si sia assestata), e il palco
   dipinto va tenuto vero.  200 ms non pesano su niente che si misuri. */
setInterval(function () { if (sc_el && sc_el.style.display !== "none") sc_dipingi(); }, 200);

/* ⭐ E LA BARRA SI FA VEDERE DA SOLA QUANDO SI COMINCIA A COMANDARE, senza che
   A7 o A8 debbano chiamarmi: si GUARDA il loro stato — che e' un oggetto **da
   leggere** (I6) e non una cucitura da concordare — e appena una delle due
   disposizioni entra in vigore la barra compare.
   ⛔ Cosi' l'avviso «queste scorciatoie non arriveranno» sta davanti
      all'utente **prima** che le provi, che e' l'unico momento in cui serve:
      dichiararle dopo sarebbe raccontargli perche' non ha funzionato. */
setInterval(function () {
  let comanda = false;
  try {
    const c = REMOTIX.input_classico && REMOTIX.input_classico.stato();
    const t = REMOTIX.tocco && REMOTIX.tocco.stato();
    comanda = !!((c && c.in_vigore) || (t && t.dita >= 0 && REMOTIX.tocco.disposizione
                                        && REMOTIX.tocco.disposizione() === "tocco"));
  } catch (e) { /* un'ancora non ancora montata: si riprova al giro dopo */ }
  if (!comanda) return;
  /* ⭐ Il bottoncino compare quando si comincia a comandare, e basta: niente
   *    si apre sopra il desktop senza che l'utente l'abbia chiesto. */
  sc_bottone();
  if (sc_detto) return;
  sc_detto = true;
  /* ⛔ E QUI si onora §7.3-bis: la dichiarazione arriva **prima** che l'utente
   *    provi le scorciatoie — che e' l'unico momento in cui serve — ⚠ ma va nel
   *    REGISTRO, non addosso all'immagine.  Dichiarare dopo sarebbe raccontargli
   *    perche' non ha funzionato. */
  try {
    const p = sc_perdute();
    if (typeof nota === "function") {
      nota(!p.misurato
        ? ("⌨ scorciatoie: non misurate su questo motore — " + p.avviso
           + ".  Il bottoncino in basso a sinistra apre l'elenco.")
        : (p.voci.length
             ? ("⌨ " + p.marca + " su questo browser NON comandano il desktop "
                + "remoto " + p.voci.length + " combinazioni (fra cui Super, "
                + "Alt+Tab, Alt+F4): le tiene il TUO computer.  Il bottoncino "
                + "in basso a sinistra apre l'elenco, e c'e' un bottone per "
                + "Ctrl+Alt+Canc.")
             : ("⌨ " + p.marca + " su questo browser e in questo palco non "
                + "risulta persa nessuna delle combinazioni provate.")));
    }
  } catch (e) { /* la sonda non e' pronta: si ridira' al giro dopo */ sc_detto = false; }
}, 500);
addEventListener("resize", function () { if (sc_el) sc_dipingi(); });

/* ── LA CUCITURA CHE OFFRO ────────────────────────────────────────────────
 * ⭐ `window.REMOTIX_SCORCIATOIE` — quel che A7 (modo classico) e A8 (tocco)
 *    possono chiamare quando la sessione parte.  ⛔ Nessuno dei due e' obbligato
 *    a chiamarlo: senza, questa ancora non fa niente e non rompe niente. */
window.REMOTIX_SCORCIATOIE = {
  entra: async function (elemento) {
    /* ⚠ NON si apre piu' il pannello: si accende solo il bottoncino.  Entrare a
     *   schermo intero e' il momento in cui l'utente vuole PIU' desktop, non
     *   meno — aprirgli addosso una dichiarazione sarebbe il contrario di quel
     *   che ha chiesto. */
    sc_bottone();
    const r = await sc_entra_a_schermo_intero(elemento);
    sc_dipingi();
    return r;
  },
  esci: async function () { await sc_esci_da_schermo_intero(); sc_dipingi(); },
  mostra: sc_mostra,
  manda: sc_manda,
  perdute: sc_perdute,
};

/* ⛔ Quel che il banco legge.  ⚠ E' un oggetto DA LEGGERE (invariante I6):
   niente qui dentro cambia quel che la pagina fa. */
REMOTIX.scorciatoie = {
  catalogo: SC_CATALOGO,
  non_provati: SC_NON_PROVATI,
  bottoni: SC_BOTTONI,
  mandati: SC_MANDATI,
  ripieghi: SC_RIPIEGHI,
  registro: SC_REGISTRO,
  motore: SC_MOTORE,
  stato: function () {
    return {
      motore: SC_MOTORE,
      palco: sc_palco(),
      schermo_intero_API: !!document.fullscreenElement,
      schermo_intero_geometria: (innerWidth >= screen.width - 2
                                 && innerHeight >= screen.height - 2),
      intero_da_F11: sc_intero_da_F11(),
      lock_viva: sc_lock_viva,
      lock_forma: sc_lock_forma,
      lock_motivo: sc_lock_motivo,
      /* ⛔ Il FUOCO e' una delle grandezze misurate, non il contorno: la lock
         si spegne quando se ne va (O10). */
      fuoco: document.hasFocus(),
      visibilita: document.visibilityState,
      forme_disponibili: {
        vecchia: !!(navigator.keyboard && navigator.keyboard.lock),
        /* ⚠ La nuova non si sa senza chiederla: `[?]` finche' non si e' entrati
           almeno una volta a schermo intero. */
        nuova: sc_lock_forma === "nuova" ? true : null,
      },
      perdute: sc_perdute(),
      filo_cucito: sc_filo_cucito(),
      classico_cucito: !!(window.REMOTIX_CLASSICO),
      ripieghi: SC_RIPIEGHI.slice(),
    };
  },
};

/* ⬆⬆ ANCORA F4-SCORCIATOIE — FINE. */
</script>
