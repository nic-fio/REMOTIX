# remotix-tasti.conf — la seconda delle tre cinture di `DECISIONI.md` §4.7.
#
# Si installa in /etc/systemd/logind.conf.d/.
#
# ⛔ IL TASTO FISICO NON PASSA DA POLKIT, e questa e' l'unica ragione per cui
#    questo file esiste.  Chi preme il pulsante di accensione non sta chiedendo
#    niente a nessuno: logind agisce **per conto proprio**, e la regola
#    `50-remotix-niente-spegnimento.rules` non lo vede nemmeno passare.
#
# `[M]` 15 agosto 2026, macchina di prova: in `/etc/systemd/logind.conf` tutte
# le righe `Handle*` sono **commentate**, cioe' valgono i predefiniti — e il
# predefinito di `HandlePowerKey` e' `poweroff`.  ⇒ Fino a questo file, il tasto
# di accensione spegneva il server con chiunque collegato sopra.
#
# ⚠ E la decisione dell'utente e' esplicita sul punto: «no, nessuno puo'
#   spegnere, riavviare, mettere in standby o sospensione il server» — chi e'
#   fisicamente davanti alla macchina **compreso**.  Spegnere e' l'unico gesto
#   che porta via tutte le sessioni insieme, e chi lo compie non vede chi c'e'.
#
# ⭐ Resta la strada dell'amministratore: `sudo systemctl poweroff`, che passa da
#    `CAP_SYS_BOOT` e non da qui.  E i client attaccati lo vengono a sapere con
#    `SERVER_IN_CHIUSURA` (`RCP.md` §8.2, `0x0C`).
#
# ⚠ `LongPress` compreso, di proposito: la pressione lunga e' la stessa mano
#   sullo stesso tasto, e lasciarla accesa vorrebbe dire chiudere la porta e
#   lasciare la finestra.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
