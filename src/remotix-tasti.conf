# remotix-tasti.conf — the second of the three belts of `DECISIONI.md` §4.7.
#
# Installed in /etc/systemd/logind.conf.d/.
#
# ⛔ THE PHYSICAL KEY DOES NOT GO THROUGH POLKIT, and this is the only reason
#    this file exists.  Whoever presses the power button is not asking
#    anything of anyone: logind acts **on its own account**, and the rule
#    `50-remotix-niente-spegnimento.rules` does not even see it pass.
#
# `[M]` 15 August 2026, test machine: in `/etc/systemd/logind.conf` all
# the `Handle*` lines are **commented out**, that is the defaults apply — and the
# default of `HandlePowerKey` is `poweroff`.  ⇒ Until this file, the power
# key switched the server off with anyone connected to it.
#
# ⚠ And the user's decision is explicit on the point: "no, nobody can
#   switch off, reboot, put on standby or suspend the server" — whoever is
#   physically in front of the machine **included**.  Switching off is the only gesture
#   that takes away all the sessions together, and whoever makes it does not see who is there.
#
# ⭐ The administrator's way remains: `sudo systemctl poweroff`, which goes through
#    `CAP_SYS_BOOT` and not through here.  And the attached clients learn of it with
#    `SERVER_IN_CHIUSURA` (`RCP.md` §8.2, `0x0C`).
#
# ⚠ `LongPress` included, on purpose: the long press is the same hand
#   on the same key, and leaving it on would mean closing the door and
#   leaving the window open.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
