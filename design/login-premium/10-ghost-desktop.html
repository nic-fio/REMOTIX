<!doctype html>
<!-- Style: «Ghost desktop» — behind, blurred and in half-light, a desktop with its windows (terminal, files, editor, panel); in the centre the glass card.
     Idea: «you are entering your computer»: the desktop is already there, it only waits for the key; everything static, the blur is computed only once. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMOTIX — Sign in</title>
<style>
  :root{
    --notte:#060814; --carta:rgba(14,18,32,.72); --filo:rgba(255,255,255,.1); --filo-forte:rgba(255,255,255,.16);
    --testo:#f1f4fa; --tenue:#a1abc0; --etichetta:#cdd4e2;
    --campo:rgba(5,8,18,.78); --campo-bordo:rgba(255,255,255,.12); --accento:#3b8cff; --ciano:#00d8ff;
    --err-fondo:rgba(255,92,108,.12); --err-bordo:rgba(255,110,124,.38); --err-testo:#ffb0b8;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Cantarell,Ubuntu,sans-serif;
    --mono:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(16px, 0.42vw + 10px, 26px); background:var(--notte)}
  body{
    margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:2.5rem 1rem;
    font-family:var(--sans); color:var(--testo); background:var(--notte); overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }

  /* ── the desktop behind: drawn once, blurred once ── */
  .desktop{
    position:fixed; inset:-4%; z-index:0; pointer-events:none; overflow:hidden;
    filter:blur(6px) brightness(.78) saturate(1.15);
    background:
      radial-gradient(60% 70% at 78% 18%, #1f4fbf 0, transparent 60%),
      radial-gradient(55% 60% at 12% 88%, #0b7fb5 0, transparent 60%),
      radial-gradient(40% 40% at 45% 55%, #2a2a7a 0, transparent 70%),
      linear-gradient(160deg, #0b1438, #0a0f26 60%, #071025);
  }
  .desktop > *{position:absolute}
  .pannello{left:3.7%; right:3.7%; bottom:3.7%; height:3.2%; min-height:28px; background:rgba(10,14,30,.88); border-top:1px solid rgba(255,255,255,.08);
    display:flex; align-items:center; gap:10px; padding:0 14px}
  .pannello i{display:block; width:22px; height:22px; border-radius:6px; background:#2f6fe0}
  .pannello i:nth-child(2){background:#e0553a} .pannello i:nth-child(3){background:#2fae7a} .pannello i:nth-child(4){background:#c9a43a}
  .pannello b{margin-left:auto; width:70px; height:10px; border-radius:5px; background:rgba(255,255,255,.4)}

  .finestra{border-radius:10px; overflow:hidden; background:#151a2c; border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 60px -10px rgba(0,0,0,.7)}
  .finestra .barra{height:28px; background:#1d2338; display:flex; align-items:center; gap:7px; padding:0 11px}
  .finestra .barra i{width:11px; height:11px; border-radius:50%; background:#3b4258}
  .finestra .barra i:first-child{background:#e0605a} .finestra .barra i:nth-child(2){background:#e0b04a} .finestra .barra i:nth-child(3){background:#4ac06a}
  .finestra .barra b{margin-left:14px; width:30%; height:8px; border-radius:4px; background:rgba(255,255,255,.18)}

  /* terminal */
  .terminale{left:8%; top:9%; width:38%; height:44%; background:#0b0e18}
  .terminale .righe{padding:16px 18px; display:grid; gap:11px}
  .terminale .righe span{display:block; height:9px; border-radius:4px; background:#2fd08f; opacity:.75}
  .terminale .righe span:nth-child(3n){background:#5aa8ff} .terminale .righe span:nth-child(4n){background:#c7d0e0; opacity:.5}
  .terminale .righe span:nth-child(5n){background:#f0b05a}
  /* files */
  .file{left:30%; top:40%; width:40%; height:46%; display:grid; grid-template-rows:28px 1fr}
  .file .corpo{display:grid; grid-template-columns:24% 1fr; height:100%}
  .file .lato{background:#121729; padding:16px 12px; display:grid; gap:12px; align-content:start}
  .file .lato span{height:9px; border-radius:4px; background:rgba(255,255,255,.22)}
  .file .lato span:first-child{background:#3b8cff}
  .file .icone{padding:20px; display:grid; grid-template-columns:repeat(5,1fr); gap:22px 18px; align-content:start}
  .file .icone span{aspect-ratio:1.15; border-radius:8px; background:#3a6fd8}
  .file .icone span:nth-child(3n){background:#e0a03a} .file .icone span:nth-child(4n){background:#8a96b0} .file .icone span:nth-child(7n){background:#39b37e}
  /* editor */
  .editor{left:58%; top:7%; width:36%; height:52%; display:grid; grid-template-rows:28px 1fr}
  .editor .testo{padding:18px 20px; display:grid; gap:12px; align-content:start; background:#101524}
  .editor .testo span{height:9px; border-radius:4px; background:rgba(200,215,240,.32)}
  .editor .testo span.t{height:16px; width:55%; background:rgba(230,236,250,.55); margin-bottom:6px}
  .editor .testo span.b{background:#5aa8ff; opacity:.6}
  /* a box with the chart */
  .grafico{left:74%; top:64%; width:20%; height:22%; padding:16px; background:#131a2e}
  .grafico svg{width:100%; height:100%}
  /* icons on the desktop */
  .icone-desk{left:5.5%; top:62%; display:grid; gap:22px}
  .icone-desk span{display:block; width:46px; height:40px; border-radius:8px; background:#3a6fd8}
  .icone-desk span:nth-child(2){background:#e0a03a} .icone-desk span:nth-child(3){background:#8a96b0}

  /* the half-light: darker in the centre, where the card is */
  .penombra{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(34rem 30rem at 50% 50%, rgba(4,6,14,.72), rgba(4,6,14,.35) 70%, rgba(4,6,14,.55)),
      linear-gradient(to bottom, rgba(4,6,14,.25), rgba(4,6,14,.4))}

  /* ── the glass card ── */
  .scheda{
    position:relative; z-index:1; width:100%; max-width:23rem; padding:1.9rem 1.7rem 1.5rem; border-radius:1.15rem;
    background:var(--carta); border:1px solid var(--filo);
    -webkit-backdrop-filter:blur(18px) saturate(1.3); backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 40px 90px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.35);
    animation:entra .7s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes entra{from{opacity:0; transform:translateY(12px) scale(.99)} to{opacity:1; transform:none}}

  .testata{display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1.6rem}
  .marchio{display:block; width:9.5rem; color:#fff}
  .marchio svg{display:block; width:100%; height:auto}
  .pronto{display:inline-flex; align-items:center; gap:.4rem; padding:.28rem .6rem; border-radius:99px; font-family:var(--mono); font-size:.68rem;
    color:#c8f3df; background:rgba(47,208,143,.1); border:1px solid rgba(47,208,143,.28); white-space:nowrap}
  .vivo{width:.42rem; height:.42rem; border-radius:50%; background:#2fd08f; box-shadow:0 0 0 3px rgba(47,208,143,.18)}

  .scheda h1{margin:0; font-size:1.35rem; font-weight:660; letter-spacing:-.02em}
  .motto{margin:.4rem 0 1.6rem; color:var(--tenue); font-size:.9rem; line-height:1.5; text-wrap:balance}

  form{display:grid; gap:1.05rem}
  label{display:block; font-size:.8rem; font-weight:580; color:var(--etichetta); margin-bottom:.45rem}
  input{
    width:100%; font:inherit; font-size:1rem; color:var(--testo); caret-color:var(--ciano);
    padding:.72rem .85rem; border:1px solid var(--campo-bordo); border-radius:.6rem; background:var(--campo);
    transition:border-color .15s, box-shadow .15s, background-color .15s;
  }
  input:hover{border-color:rgba(255,255,255,.22)}
  input:focus{outline:none; background:rgba(5,8,18,.8); border-color:var(--accento); box-shadow:0 0 0 3px rgba(59,140,255,.28)}
  input[aria-invalid="true"]{border-color:rgba(255,110,124,.6)}
  input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px rgba(255,110,124,.22)}

  button{
    margin-top:.45rem; font:inherit; font-size:.98rem; font-weight:640; color:#fff;
    padding:.8rem 1rem; border:0; border-radius:.6rem; cursor:pointer;
    background:linear-gradient(180deg, #1c6cf0, #1560d8);
    display:flex; justify-content:center; align-items:center; gap:.5rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 10px 26px -8px rgba(26,110,255,.75);
    transition:filter .15s, box-shadow .2s, transform .1s;
  }
  button .freccia{width:1.05rem; height:1.05rem; transition:transform .2s}
  button:hover{filter:brightness(1.1); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 12px 32px -8px rgba(0,190,255,.7)}
  button:hover .freccia{transform:translateX(3px)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--ciano); outline-offset:3px}
  button:disabled{cursor:progress; filter:saturate(.35) brightness(.8); box-shadow:none; transform:none}
  button:disabled .freccia{display:none}
  .ruota{display:none; width:1rem; height:1rem; border-radius:50%; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:gira .8s linear infinite}
  button:disabled .ruota{display:block}
  @keyframes gira{to{transform:rotate(360deg)}}

  #avviso:empty, #esito:empty, #dichiarazione:empty{display:none}
  #avviso{margin:0 0 1.2rem; padding:.7rem .85rem; border-radius:.6rem; font-size:.86rem; line-height:1.45;
    background:rgba(255,190,80,.1); border:1px solid rgba(255,190,80,.32); color:#ffd391}
  #esito{margin-top:1.1rem}
  #esito.errore{display:flex; gap:.6rem; align-items:flex-start; padding:.7rem .85rem; border-radius:.6rem; font-size:.88rem; line-height:1.4;
    background:var(--err-fondo); border:1px solid var(--err-bordo); color:var(--err-testo); animation:compare .35s ease-out both}
  #esito.errore span{text-wrap:balance}
  #esito.errore svg{flex:none; width:1.05rem; height:1.05rem; margin-top:.08rem}
  @keyframes compare{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
  .scheda.scuoti{animation:scuoti .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes scuoti{20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)}}
  #dichiarazione{margin-top:1rem; padding:.7rem .85rem; border-radius:.6rem; font-size:.84rem; color:var(--etichetta); background:rgba(255,255,255,.05); border:1px solid var(--filo)}

  .piede{margin:1.5rem 0 0; padding-top:1.1rem; border-top:1px solid var(--filo); display:flex; justify-content:center; align-items:center; gap:.45rem;
    font-size:.76rem; color:var(--tenue)}
  .piede svg{width:.85rem; height:.85rem; flex:none}
  .piede code{font-family:var(--mono); font-size:.74rem; color:#c7cfdd}

  @media (max-width:700px){
    .terminale{left:-6%; top:6%; width:70%; height:34%}
    .editor{left:48%; top:20%; width:62%; height:40%}
    .file{left:-4%; top:58%; width:80%; height:32%}
    .grafico{left:64%; top:66%; width:40%; height:18%}
    .icone-desk{display:none}
  }
  @media (max-width:420px){ .scheda{padding:1.6rem 1.2rem 1.25rem} .marchio{width:8.5rem} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="desktop" aria-hidden="true">
  <div class="icone-desk"><span></span><span></span><span></span></div>
  <div class="finestra terminale">
    <div class="barra"><i></i><i></i><i></i><b></b></div>
    <div class="righe">
      <span style="width:42%"></span><span style="width:68%"></span><span style="width:55%"></span><span style="width:30%"></span>
      <span style="width:74%"></span><span style="width:48%"></span><span style="width:62%"></span><span style="width:36%"></span>
      <span style="width:58%"></span><span style="width:22%"></span>
    </div>
  </div>
  <div class="finestra editor">
    <div class="barra"><i></i><i></i><i></i><b></b></div>
    <div class="testo">
      <span class="t"></span><span style="width:92%"></span><span style="width:86%"></span><span style="width:95%"></span><span style="width:60%"></span>
      <span class="b" style="width:40%"></span><span style="width:88%"></span><span style="width:78%"></span><span style="width:90%"></span><span style="width:52%"></span>
    </div>
  </div>
  <div class="finestra file">
    <div class="barra"><i></i><i></i><i></i><b></b></div>
    <div class="corpo">
      <div class="lato"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="icone"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </div>
  <div class="finestra grafico">
    <svg viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M0 50 L15 42 L28 46 L42 28 L56 34 L70 16 L84 22 L100 8" fill="none" stroke="#2fd08f" stroke-width="3"/><path d="M0 56 L20 52 L40 54 L60 44 L80 48 L100 38" fill="none" stroke="#5aa8ff" stroke-width="3"/></svg>
  </div>
  <div class="pannello"><i></i><i></i><i></i><i></i><b></b></div>
</div>
<div class="penombra" aria-hidden="true"></div>

<main class="scheda" aria-labelledby="titolo">
  <div class="testata">
    <div class="marchio">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 360" role="img" aria-label="REMOTIX">
        <defs>
          <linearGradient id="rx-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00d8ff"/><stop offset=".45" stop-color="#1a7cff"/><stop offset="1" stop-color="#0646c8"/>
          </linearGradient>
          <linearGradient id="rx-t" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#1a6dff"/><stop offset="1" stop-color="#00d8ff"/>
          </linearGradient>
        </defs>
        <g fill="url(#rx-g)">
          <path d="M0 0H288A116 116 0 0 1 288 232H196L170 180H252A38 38 0 0 0 252 104H86Z"/>
          <path d="M26 138L214 356H26Z"/>
          <path d="M150 180H232L442 356H296Z"/>
        </g>
        <text x="450" y="356" font-family="Montserrat,'Arial Black','Helvetica Neue',system-ui,sans-serif" font-weight="900" font-size="272" letter-spacing="6"><tspan fill="currentColor">EMO</tspan><tspan fill="url(#rx-t)">TIX</tspan></text>
      </svg>
    </div>
    <span class="pronto"><i class="vivo" aria-hidden="true"></i>alfa.lan</span>
  </div>

  <h1 id="titolo">Enter your computer</h1>
  <p class="motto">Your Linux desktop, from any browser. You find everything as it was.</p>
  <div id="avviso"></div>

  <form id="modulo" novalidate>
    <div>
      <label for="utente">User</label>
      <input id="utente" name="utente" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </div>
    <div>
      <label for="parola">Password</label>
      <input id="parola" name="parola" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="vai">Connect
      <svg class="freccia" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5L15.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="ruota" aria-hidden="true"></span>
    </button>
  </form>

  <div id="esito" role="status" aria-live="polite"></div>
  <div id="dichiarazione"></div>

  <p class="piede">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.3 7V5.2a2.7 2.7 0 0 1 5.4 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    Encrypted connection with <code>alfa.lan</code>
  </p>
</main>

<script>
(function(){
  var modulo=document.getElementById('modulo'), esito=document.getElementById('esito'), vai=document.getElementById('vai'),
      scheda=document.querySelector('.scheda'), campi=[document.getElementById('utente'), document.getElementById('parola')];
  var ICONA='<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 5.8v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14" r="1.1" fill="currentColor"/></svg>';
  function errore(){
    esito.className='errore'; esito.innerHTML=ICONA+'<span>Invalid user or password.</span>';
    campi.forEach(function(c){c.setAttribute('aria-invalid','true')});
    scheda.classList.remove('scuoti'); void scheda.offsetWidth; scheda.classList.add('scuoti');
  }
  function pulisci(){ if(esito.className){esito.className=''; esito.innerHTML='';} campi.forEach(function(c){c.removeAttribute('aria-invalid')}); }
  campi.forEach(function(c){c.addEventListener('input',pulisci)});
  modulo.addEventListener('submit',function(e){
    e.preventDefault(); pulisci(); vai.disabled=true;
    setTimeout(function(){vai.disabled=false; errore(); campi[1].select();},900);
  });
  if(new URLSearchParams(location.search).get('stato')==='errore') errore();
})();
</script>
</body>
</html>
