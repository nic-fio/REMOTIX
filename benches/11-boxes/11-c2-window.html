<title>REMOTIX — C2</title>
<!--
  ⭐ THE WINDOW THAT C2 ASKS TO OPEN.

  ⛔ It must be RECOGNISABLE IN THE PIXELS without knowing what the desktop underneath
     looks like: §4.3 of the phase document — *nobody knows what a desktop looks like*.

  · the background is `#00FFFF` (cyan), and ⛔ **it is not C8's magenta, on purpose**.
    The two meshes run in the same box and C8 leaves windows around:
    with a shared colour, a C8 window left open would pass for «the
    C2 window» and this mesh would say green without having opened anything.
    ⚠ It is the same reason why C2 demands a MARGIN between the first and the last
      frame, instead of looking only at the last one.
  · no desktop puts cyan full screen on its own: not GNOME, not Plasma,
    not XFCE, not LXQt.
  · the black text is there ON PURPOSE: ⚠ a page all of one colour would be «solid
    colour» for the image judge, i.e. the verdict with which it declares
    «degenerate» what it looks at.  ⛔ A target the judge would discard is not
    a target.
  · and the colour tolerance is declared by the bench, not by this page: the chain
    goes through an H.264 encoding in 4:2:0 that subsamples the chroma, and demanding
    the exact colour would mean a test already dead (§4.3, Gemini's finding).
  · ⛔ no external resource, no font to download: the box
    has no network to the outside, and a page waiting for something that never arrives
    would give a red that is not the product's.
-->
