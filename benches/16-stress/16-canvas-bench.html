<!doctype html>
<meta charset="utf-8">
<title>Canvas bench</title>
<!--
  «Drawing path» bench — Firefox 140, VideoFrame VA-API → glass.
  Usage:  banco-tela.html?via=bmp|gl&file=prova.h264&fps=60&seconds=30
    via=bmp  createImageBitmap(f) + bitmaprenderer   (today's path)
    via=gl   WebGL2 texImage2D(f) + full triangle    (candidate)
  The file is H.264 Annex-B with AUD (one access unit per AUD), made on the server:
    ffmpeg -f lavfi -i testsrc2=3840x2160:r=60 -t 30 -pix_fmt yuv420p \
      -c:v libx264 -profile:v high -level 5.1 -bf 0 -g 600 \
      -x264-params aud=1 -preset veryfast prova.h264
  Outcome: window.OUTCOME (JSON) and document.title = "DONE" at the end.
  Firefox profile: webgl.perf.max-warnings=20 to see in the console
  «Missed GPU-copy fast-path: ...» if the fast path does NOT kick in.
-->
<body style="margin:0;background:#000">
<canvas id="t" style="width:100vw;height:100vh;display:block"></canvas>
<script>
const P = new URLSearchParams(location.search);
const VIA = P.get("via") || "bmp", FPS = +(P.get("fps") || 60),
      SECONDS = +(P.get("seconds") || 30), FILE = P.get("file") || "prova.h264";
const canvas = document.getElementById("t");
const R = { via: VIA, exited: 0, queue_skipped: 0, painted: 0, errors: [],
            drawing_ms: [], callback_gap_ms: [], queue_max: 0, format: null };
let ctx, gl, tex;

function prepare(l, a) {
  canvas.width = l; canvas.height = a;
  if (VIA === "bmp") { ctx = canvas.getContext("bitmaprenderer"); return; }
  gl = canvas.getContext("webgl2", { alpha: false, antialias: false, depth: false,
                                   preserveDrawingBuffer: false,
                                   desynchronized: true });
  const vs = `#version 300 es
    out vec2 uv; void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2);
    uv = vec2(p.x, 1.0-p.y); gl_Position = vec4(p*2.0-1.0,0,1); }`;
  const fs = `#version 300 es
    precision mediump float; in vec2 uv; uniform sampler2D s; out vec4 c;
    void main(){ c = texture(s, uv); }`;
  const pr = gl.createProgram();
  for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh);
    gl.attachShader(pr, sh);
  }
  gl.linkProgram(pr); gl.useProgram(pr);
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER])
    gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  /* ⚠ conditions of the fast path (TexUnpackBlob.cpp BlitPreventReason):
     level 0, offset 0, RGBA/UNSIGNED_BYTE, no UNPACK_SKIP, same colour space. */
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.viewport(0, 0, l, a);
}

function draw(f) {
  const t0 = performance.now();
  if (VIA === "bmp") {
    createImageBitmap(f).then((b) => {
      R.drawing_ms.push(performance.now() - t0);
      f.close();
      ctx.transferFromImageBitmap(b); R.painted++;
    }).catch((e) => { f.close(); R.errors.push(String(e)); });
    R.call_ms = (R.call_ms || []); R.call_ms.push(performance.now() - t0);
    return;
  }
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, f);
  f.close();                               /* ⭐ closed AT ONCE: the fast path has already copied */
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  R.drawing_ms.push(performance.now() - t0); R.painted++;
}

let last_cb = 0, dec;
function output(f) {
  const now = performance.now();
  if (last_cb) R.callback_gap_ms.push(now - last_cb);
  last_cb = now; R.exited++;
  if (R.format === null) R.format = f.format;
  if (!gl && !ctx) prepare(f.displayWidth, f.displayHeight);
  R.queue_max = Math.max(R.queue_max, dec.decodeQueueSize);
  if (dec.decodeQueueSize > 2) { R.queue_skipped++; f.close(); return; }   /* the page's rule */
  draw(f);
}

function unit(buf) {                      /* Annex-B → access units on the AUD (nal 9) */
  const u = new Uint8Array(buf), starts = [];
  for (let i = 0; i + 4 < u.length; i++)
    if (u[i] === 0 && u[i+1] === 0 && u[i+2] === 1 && (u[i+3] & 31) === 9)
      starts.push(i > 0 && u[i-1] === 0 ? i - 1 : i);
  starts.push(u.length);
  const out = [];
  for (let k = 0; k + 1 < starts.length; k++) {
    const piece = u.subarray(starts[k], starts[k+1]);
    let key = false;                    /* nal 5 = IDR */
    for (let i = 0; i + 3 < piece.length; i++)
      if (piece[i] === 0 && piece[i+1] === 0 && piece[i+2] === 1 && (piece[i+3] & 31) === 5) { key = true; break; }
    out.push({ data: piece, key });
  }
  return out;
}

function median(v) { if (!v.length) return null; const s = [...v].sort((a,b)=>a-b);
  return +s[s.length >> 1].toFixed(2); }
function p95(v) { if (!v.length) return null; const s = [...v].sort((a,b)=>a-b);
  return +s[Math.floor(s.length * 0.95)].toFixed(2); }

(async () => {
  const au = unit(await (await fetch(FILE)).arrayBuffer());
  dec = new VideoDecoder({ output: output, error: (e) => R.errors.push("dec: " + e) });
  dec.configure({ codec: P.get("codec") || "avc1.640033", optimizeForLatency: true,
                  hardwareAcceleration: P.get("hw") || "no-preference" });
  const step = 1000 / FPS, t_start = performance.now();
  let n = 0;
  await new Promise((fine) => {
    const round_trip = () => {                   /* delivers at the server's pace, like the wire */
      const due = Math.floor((performance.now() - t_start) / step);
      while (n <= due) {
        const a = au[n % au.length];
        if (n > 0 && n % au.length === 0 && !a.key) { n++; continue; }
        dec.decode(new EncodedVideoChunk({ type: (n === 0 || a.key) ? "key" : "delta",
                                           timestamp: n * step * 1000, data: a.data }));
        n++;
      }
      if (performance.now() - t_start < SECONDS * 1000) setTimeout(round_trip, 2); else fine();
    };
    round_trip();
  });
  await dec.flush().catch(() => {});
  window.OUTCOME = { via: VIA, delivered: n, exited: R.exited, painted: R.painted,
    queue_skipped: R.queue_skipped,
    skipped_pct: +(100 * R.queue_skipped / Math.max(1, R.exited)).toFixed(1),
    drawing_ms_median: median(R.drawing_ms), drawing_ms_p95: p95(R.drawing_ms),
    call_ms_median: median(R.call_ms || []),
    gap_callback_median: median(R.callback_gap_ms), queue_max: R.queue_max,
    format: R.format, errors: R.errors.slice(0, 5) };
  console.log("OUTCOME " + JSON.stringify(window.OUTCOME));
  document.title = "DONE";
})();
</script>
