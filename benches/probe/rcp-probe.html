<!doctype html>
<!-- rcp-probe.html — it is NOT product: it is the bench that drives a real browser
     against the server of src/.  The LOGIC is extracted from src/page.html without
     rewriting it: if the two diverged, this test would measure another
     page.  The only differences are the automatic start and the POST of the outcome. -->
<html lang="it"><head><meta charset="utf-8"><title>RCP probe</title></head>
<body>
<div id="warning" hidden></div>
<form id="signin-form"><input id="username"><input id="password" type="password"></form>
<div id="outcome"></div><div id="logbook"></div>
<script>
"use strict";

/* ⛔ The fingerprint the SERVER wrote in here while serving the page. */
const Q = new URLSearchParams(location.search);
const BASE = Q.get("base");
const SERVED_FINGERPRINT = Q.get("fingerprint") || "";

/* -------------------------------------------------------------------------
 * ⛔⭐ THE CREDENTIALS COME FROM THE FRAGMENT, NOT FROM THE QUERY — survey
 *     R12-A.34, 11 Aug 2026, and B13 found it.
 *
 * This page received `?username=prova&password=parola-di-prova`.  ⛔ The query
 * is part of the HTTP REQUEST LINE, and every server logs it as a matter of
 * course: `sonda/racc.log` held the password **in clear**, and it is
 * the line on which B13.2 is red — *"the password appears in 1 logs
 * out of 1288"*.
 *
 * ⚠ And a little further down this same page printed *"CREDENTIALS sent (the
 *   password appears in no log)"*: a sentence that was contradicted by
 *   the file next to it.
 *
 * ⭐ The fragment — what comes after `#` — **is not sent to the server**:
 *    it does not enter the request line, so it enters no HTTP log,
 *    neither ours nor that of a proxy in between.
 *
 * ⛔ AND WHAT THIS CURE DOES **NOT** CLOSE, said here and not elsewhere: the
 *    fragment stays in the HISTORY and in the browser's saved session.
 *    `[M]` 11 Aug 2026: the password was also in
 *    `sonda/prof-<label>/sessionstore-backups/recovery.jsonlz4` — ⚠ and the
 *    folder name is written out in full on purpose: the form with
 *    the asterisk carries the pair of characters that CLOSES a comment in
 *    JavaScript, and in the first draft it split this block in two.  The
 *    syntax check caught it at once; by eye it could not be seen.  The
 *    profile is
 *    thrown away at the end of the round (`launch.sh`), and as long as it is a
 *    bench with a test password that is fine; ⛔ **a product page must not take
 *    the password from any piece of the address**, and this line exists
 *    so that the difference is not forgotten.
 * ------------------------------------------------------------------------- */
const F = new URLSearchParams((location.hash || "").replace(/^#/, ""));
const credential = (name) => F.get(name) || Q.get(name) || "";
const WARNING = "";

const $ = (i) => document.getElementById(i);
const lines = [];
function note(t) { lines.push(t); $("logbook").textContent = lines.join("\n"); }
function outcome(t, good) { const e = $("outcome"); e.textContent = t; e.className = good ? "good" : "bad"; }

if (WARNING.trim()) { $("warning").hidden = false; }

/* ── The bytes of RCP (RCP.md §6.0 and §6.1) ───────────────────────────────
   ⛔ Byte order: network (big-endian).  No aligned field, no padding:
      "one extra byte that makes the sums add up in a C struct is the
      exact form of the defect corrected in §6.2".                            */

const TYPE = {
  HELLO: 0x0001, HERE_I_AM: 0x0002, CREDENTIALS: 0x0003, ADMITTED: 0x0004,
  REJECTED: 0x0005, ATTACH: 0x0006, SESSION: 0x0007, FAREWELL: 0x000C,
};

/* The reasons of §8.2, in words.  ⛔ `RCP.md` §8.2 and `SPECS.md`: the user
   is told WHY, with a sentence and not with a number. */
const REASON_TEXT = {
  0x01: "the session was closed by the user",
  0x02: "silence too long: the session expired",
  0x03: "the session was abandoned",
  0x04: "the local session on that machine took precedence",
  0x05: "that user is already signed in locally",
  0x06: "the server is full",
  0x07: "incorrect username or password",
  0x08: "the attempts from this address are used up: try again in twelve hours, or unblock the address from the server",
  0x09: "the server and this page have nothing in common to speak",
  0x0A: "incompatible protocol version",
  0x0B: "protocol error",
  0x0C: "the server is shutting down",
  0x0D: "timed out during the handshake",
  0x0E: "that session cannot be served",
  0x0F: "that user is already connected from another device",
};

class Writer {
  constructor() { this.b = []; }
  u8(v)  { this.b.push(v & 0xff); return this; }
  u16(v) { this.b.push((v >> 8) & 0xff, v & 0xff); return this; }
  u32(v) { this.b.push((v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff); return this; }
  /* string = u16 length + the UTF-8 bytes, WITHOUT terminator (§6.0) */
  str(t)  { const d = new TextEncoder().encode(t); this.u16(d.length); for (const x of d) this.b.push(x); return this; }
  byte()  { return new Uint8Array(this.b); }
}

/* The framing of §6.1: u16 type, u32 length, body. */
function envelope(type, body) {
  const m = new Uint8Array(6 + body.length);
  const v = new DataView(m.buffer);
  v.setUint16(0, type);
  v.setUint32(2, body.length);
  m.set(body, 6);
  return m;
}

class Reader {
  constructor(d) { this.v = new DataView(d.buffer, d.byteOffset, d.byteLength); this.o = 0; }
  u8()  { return this.v.getUint8(this.o++); }
  u16() { const x = this.v.getUint16(this.o); this.o += 2; return x; }
  u32() { const x = this.v.getUint32(this.o); this.o += 4; return x; }
  str() { const n = this.u16(); const d = new Uint8Array(this.v.buffer, this.v.byteOffset + this.o, n); this.o += n; return new TextDecoder().decode(d); }
  remaining() { return this.v.byteLength - this.o; }
}

/* The control channel reader: it accumulates and returns one message at a
   time.  ⛔ The length is checked BEFORE allocating (§6.1). */
class Channel {
  constructor(stream) {
    this.reader = stream.readable.getReader();
    this.writer = stream.writable.getWriter();
    this.buf = new Uint8Array(0);
  }
  async send(type, body) { await this.writer.write(envelope(type, body)); }
  async receive() {
    for (;;) {
      if (this.buf.length >= 6) {
        const v = new DataView(this.buf.buffer, this.buf.byteOffset, this.buf.byteLength);
        const type = v.getUint16(0), lung = v.getUint32(2);
        if (lung > 1024 * 1024) throw new Error("message over 1 MiB: the server violates §6.1");
        if (this.buf.length >= 6 + lung) {
          const body = this.buf.slice(6, 6 + lung);
          this.buf = this.buf.slice(6 + lung);
          return { type, body };
        }
      }
      const { value, done } = await this.reader.read();
      if (done) return null;
      const n = new Uint8Array(this.buf.length + value.length);
      n.set(this.buf); n.set(value, this.buf.length);
      this.buf = n;
    }
  }
}

function base64ABytes(b64) {
  const s = atob(b64);
  const d = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) d[i] = s.charCodeAt(i);
  return d;
}

/* ⛔⭐ THE KEYBOARD LAYOUT, AND WHY IT IS NOT `navigator.language`.
 *
 *    `[M]` 10 Aug 2026, first round with real Firefox: this line said
 *    `navigator.language.slice(0,2)`, and on a browser in English it sent `en`.
 *    ⛔ `en` IS NOT an XKB layout name — that one is called `us` — and
 *    `RCP.md` §4.5 requires the server to dismiss with `SESSION_UNSERVABLE`
 *    a well-formed layout the system does not know.  The server did
 *    exactly what it must; it was the PAGE asking for a keyboard that
 *    does not exist, and every user with a browser in English would have seen
 *    "that session cannot be served" with nothing naming the keyboard.
 *
 * ⚠ And a declared `[?]` remains: a page CANNOT know the PHYSICAL layout
 *   of the keyboard of whoever looks at it — the interface language is a
 *   hint, not a fact.  This table is an honest fallback; the real cure is
 *   to let the user choose, and `SPECS.md` §7.3 is the place where
 *   that decision will be taken. */
function layout() {
  const l = (navigator.language || "it-IT").toLowerCase();
  const language = l.slice(0, 2);
  const region = l.length > 3 ? l.slice(3, 5) : "";
  if (language === "en") {
    const per_region = {gb: "gb", au: "us", ca: "us", nz: "us", ie: "ie", in: "us", za: "us"};
    return per_region[region] || "us";
  }
  /* The languages in which the XKB name matches the ISO code.  ⛔ Outside these
     it falls back to `us` instead of guessing: a wrong layout does not give
     an error, it makes the wrong letters come out. */
  const note = ["it", "de", "fr", "es", "pt", "nl", "se", "no", "dk", "fi",
                "pl", "cz", "sk", "hu", "ro", "ru", "ua", "gr", "tr", "il",
                "jp", "kr", "br", "ch", "be", "at", "yes", "hr", "rs", "bg"];
  if (note.includes(language)) return language;
  if (language === "sv") return "se";
  if (language === "da") return "dk";
  if (language === "cs") return "cz";
  if (language === "el") return "gr";
  if (language === "he") return "il";
  if (language === "ja") return "jp";
  if (language === "ko") return "kr";
  if (language === "uk") return "ua";
  return "us";
}

/* ⛔ The fingerprint is FETCHED AGAIN before every attempt (§4.1-bis). If the
   fetch fails the one served with the page is used, and IT IS SAID: a silent
   fallback produces two behaviours under the same label. */
async function fingerprint() {
  try {
    const r = await fetch(BASE + "/fingerprint", { cache: "no-store" });
    if (!r.ok) throw new Error("status " + r.status);
    const j = await r.json();
    if (j.fingerprint && j.fingerprint !== SERVED_FINGERPRINT) {
      note("fingerprint: the certificate has been rotated since this page was served — using the new one");
    }
    return j.fingerprint || SERVED_FINGERPRINT;
  } catch (e) {
    note("fingerprint: /fingerprint does not answer (" + e.message + "): using the one served with the page");
    return SERVED_FINGERPRINT;
  }
}

async function connect(username, password) {
  if (!("WebTransport" in window)) {
    outcome("This browser has no WebTransport: you need Chrome/Edge, Firefox or Safari 26+.", false);
    return;
  }

  const b64 = await fingerprint();
  const url = BASE + "/rcp/1";
  note("opening " + url);

  /* ⛔ `allowPooling: false` and the fingerprint: `RCP.md` §4.1-bis.  With
     `serverCertificateHashes` the browser does NOT look at the exception — it
     looks at the fingerprint — and it is the only mechanism browsers expose for
     a server without a domain. */
  const wt = new WebTransport(url, {
    allowPooling: false,
    serverCertificateHashes: [{ algorithm: "sha-256", value: base64ABytes(b64) }],
  });

  wt.closed.then((info) => {
    const c = info && info.closeCode;
    if (c && REASON_TEXT[c]) outcome(REASON_TEXT[c], false);
    note("session closed by the server: code " + (c === undefined ? "?" : c));
  }).catch((e) => note("session closed with error: " + e));

  await wt.ready;
  note("WebTransport session open");

  /* ⛔ §4.2: the client opens the FIRST bidirectional stream of the session.
     That is the control channel, and its closing IS the end of the
     session. */
  const channel = new Channel(await wt.createBidirectionalStream());

  /* ── HELLO (§4.3) ────────────────────────────────────────────────────── */
  const cap = [
    ["video.codec", "hevc,av1"],
    ["video.depth", "8,10"],
    ["video.level", "5.1"],
    ["video.max_size", screen.width * devicePixelRatio + "x" + screen.height * devicePixelRatio],
    ["audio.codec", "opus,pcm"],
    ["input.touch", "no"],
    ["clipboard.text", "yes"],
    ["client.name", "remotix-page 0.1.0"],
  ];
  const s = new Writer();
  s.u16(1);              /* the major version this page can speak */
  s.u16(cap.length);
  for (const [n, v] of cap) s.str(n).str(v);
  await channel.send(TYPE.HELLO, s.byte());
  note("HELLO sent (" + cap.length + " capabilities)");

  let m = await channel.receive();
  if (!m) { outcome("The server closed the channel without answering.", false); return; }
  if (m.type === TYPE.FAREWELL) { const l = new Reader(m.body); outcome(REASON_TEXT[l.u8()] || "dismissed", false); return; }
  if (m.type !== TYPE.HERE_I_AM) { outcome("The server answered 0x" + m.type.toString(16) + " instead of HERE_I_AM.", false); return; }
  {
    const l = new Reader(m.body);
    const ver = l.u16(), tries = l.u16();
    const choices = [];
    for (let i = 0; i < tries; i++) choices.push(l.str() + "=" + l.str());
    note("HERE_I_AM: version " + ver + " — " + choices.join(" · "));
  }

  /* ── CREDENTIALS (§4.4) ─────────────────────────────────────────────── */
  await channel.send(TYPE.CREDENTIALS, new Writer().str(username).str(password).byte());
  note("CREDENTIALS sent — ⛔ and the password appears in no\n  HTTP log because it comes from the FRAGMENT, which the browser does not\n  send to the server (R12-A.34).  \u26a0 It stays in the browser's\n  history: this round's profile is thrown away at the end of the round");

  m = await channel.receive();
  if (!m) { outcome("The server closed the channel without answering the credentials.", false); return; }
  if (m.type === TYPE.REJECTED) {
    const l = new Reader(m.body);
    const rsn = l.u8();
    outcome(REASON_TEXT[rsn] || ("refused, reason 0x" + rsn.toString(16)), false);
    /* ⛔ §4.4: "the client MUST NOT retry on the same connection: for a
       second attempt a new one is opened".  And the only thing left for it
       to say is FAREWELL — which §8.1 REQUIRES of it when it is the one closing;
       here the server closes, so it keeps quiet. */
    return;
  }
  if (m.type === TYPE.FAREWELL) { const l = new Reader(m.body); outcome(REASON_TEXT[l.u8()] || "dismissed", false); return; }
  if (m.type !== TYPE.ADMITTED) { outcome("The server answered 0x" + m.type.toString(16) + " instead of ADMITTED.", false); return; }
  note("ADMITTED");

  /* ── ATTACH (§4.5) ─────────────────────────────────────────────────── */
  /* ⛔ The limits are normative: between 320×240 and 7680×4320, and both EVEN. */
  const peer = (n, min, max) => Math.max(min, Math.min(max, n - (n % 2)));
  const canvas_w = peer(1920, 320, 7680), canvas_h = peer(1080, 240, 4320);
  const vista_l = Math.max(1, Math.round(innerWidth * devicePixelRatio));
  const vista_a = Math.max(1, Math.round(innerHeight * devicePixelRatio));
  const avail = layout();
  await channel.send(TYPE.ATTACH,
    new Writer().u32(canvas_w).u32(canvas_h).u32(vista_l).u32(vista_a).str(avail).byte());
  note("ATTACH: canvas " + canvas_w + "×" + canvas_h + ", view " + vista_l + "×" + vista_a + ", layout «" + avail + "»");

  m = await channel.receive();
  if (!m) { outcome("The server closed the channel without answering ATTACH.", false); return; }
  if (m.type === TYPE.FAREWELL) { const l = new Reader(m.body); outcome(REASON_TEXT[l.u8()] || "dismissed", false); return; }
  if (m.type !== TYPE.SESSION) { outcome("The server answered 0x" + m.type.toString(16) + " instead of SESSION.", false); return; }
  {
    const l = new Reader(m.body);
    const state = l.u8(), tl = l.u32(), ta = l.u32(), desktop = l.str();
    outcome("Admitted, " + (state === 1 ? "new" : "resumed") +
          " session, canvas " + tl + "×" + ta + ", desktop " + desktop, true);
  }
}

async function ship(outcome, detail) {
  try {
    await fetch("/outcome", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({outcome: outcome, engine: navigator.userAgent,
                            detail: detail, lines: lines})});
  } catch (e) { /* there is no other way to say it */ }
}

(async () => {
  $("username").value = credential("username");
  $("password").value = credential("password");
  try {
    await connect(credential("username"), credential("password"));
    const t = $("outcome").textContent;
    await ship(/^Admitted/.test(t) ? "ADMITTED" : "REFUSED", t);
  } catch (e) {
    await ship("ERROR", String(e && e.message ? e.message : e));
  }
})();
</script></body></html>
